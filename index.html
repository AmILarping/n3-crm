    const out = []; const re = /<(?:\w+:)?si\b[^>]*?(?:\/>|>([\s\S]*?)<\/(?:\w+:)?si>)/g; let m;
    while ((m = re.exec(xml))) out.push(m[1] ? richText(m[1]) : '');
    return out;
  }

  /**
   * Ein Arbeitsblatt in Kopf / Zeilen / Rest zerlegen.
   * Jede Zelle behält ihr rohes XML (attrs ohne r, inner) für verlustfreies Zurückschreiben.
   */
  function parseSheet(xml, book) {
    const sd = /<(\w+:)?sheetData\b[^>]*?(\/>|>)/.exec(xml);
    if (!sd) throw new XlsxError('Arbeitsblatt ohne <sheetData>.', 'nosheetdata');
    const P = sd[1] || '';
    const pre = xml.slice(0, sd.index);
    let body = '', post;
    if (sd[2] === '/>') { post = xml.slice(sd.index + sd[0].length); }
    else {
      const closeTag = `</${P}sheetData>`;
      const end = xml.indexOf(closeTag, sd.index);
      if (end < 0) throw new XlsxError('Arbeitsblatt beschädigt (</sheetData> fehlt).', 'badsheet');
      body = xml.slice(sd.index + sd[0].length, end);
      post = xml.slice(end + closeTag.length);
    }
    const rows = [];
    const rowRe = new RegExp(`<${P}row\\b([^>]*?)(?:/>|>([\\s\\S]*?)</${P}row>)`, 'g');
    const cellRe = new RegExp(`<${P}c\\b([^>]*?)(?:/>|>([\\s\\S]*?)</${P}c>)`, 'g');
    let rm, lastRow = 0;
    while ((rm = rowRe.exec(body))) {
      const ra = rm[1];
      const rAttr = /\sr\s*=\s*"(\d+)"/.exec(ra);
      const r = rAttr ? +rAttr[1] : lastRow + 1;
      lastRow = r;
      const row = { r, attrs: stripAttrs(ra, ['r', 'spans']), cells: new Map(), hasFormula: false };
      const inner = rm[2] || '';
      let cm, lastCol = 0;
      cellRe.lastIndex = 0;
      while ((cm = cellRe.exec(inner))) {
        const ca = cm[1];
        const refM = /\sr\s*=\s*"([A-Z]+)(\d+)"/.exec(ca);
        const c = refM ? colToIndex(refM[1]) : lastCol + 1;
        lastCol = c;
        const cell = decodeCell(ca, cm[2], book, P);
        cell.selfClose = cm[2] === undefined;
        cell.attrs = stripAttrs(ca, ['r']);
        cell.inner = cm[2] || '';
        if (cell.hasFormula) row.hasFormula = true;
        row.cells.set(c, cell);
      }
      rows.push(row);
    }
    // Spalten-Standardformate (<col style="..">) für neue Zellen
    const colStyle = {};
    const colRe = /<(?:\w+:)?col\b([^>]*?)\/?>/g; let cm2;
    const colsBlock = (/<(?:\w+:)?cols\b[^>]*>([\s\S]*?)<\/(?:\w+:)?cols>/.exec(pre) || [, ''])[1];
    while ((cm2 = colRe.exec(colsBlock))) {
      const a = parseAttrs(cm2[1]);
      if (a.style !== undefined) for (let i = +a.min; i <= +a.max && i <= 200; i++) colStyle[i] = a.style;
    }
    const features = {
      merges: new RegExp(`<${P}mergeCell\\b`).test(post),
      hyperlinks: new RegExp(`<${P}hyperlink\\b`).test(post),
      tables: new RegExp(`<${P}tablePart\\b`).test(post),
      legacyDrawing: new RegExp(`<${P}legacyDrawing\\b`).test(post),
    };
    return { P, pre, post, rows, colStyle, features };
  }

  /** Wert einer Zelle dekodieren (ohne Typwissen der Spalte). */
  function decodeCell(attrStr, inner, book, P) {
    const a = parseAttrs(attrStr);
    const t = a.t || 'n';
    const cell = { t, s: a.s, value: null, hasFormula: false };
    if (!inner) return cell;
    if (inner.indexOf('<' + P + 'f') >= 0) cell.hasFormula = true;
    if (t === 'inlineStr') { const is = new RegExp(`<${P}is\\b[^>]*>([\\s\\S]*?)</${P}is>`).exec(inner); cell.value = is ? richText(is[1]) : ''; return cell; }
    const vm = new RegExp(`<${P}v\\b[^>]*?(?:/>|>([\\s\\S]*?)</${P}v>)`).exec(inner);
    const raw = vm && vm[1] !== undefined ? vm[1] : null;
    if (raw === null) return cell;
    if (t === 's') { const i = parseInt(raw, 10); cell.value = (i >= 0 && i < book.sst.length) ? book.sst[i] : ''; if (!(i >= 0 && i < book.sst.length)) cell.badSST = true; }
    else if (t === 'str') cell.value = ooxmlUnescape(xmlDecode(raw));
    else if (t === 'b') cell.value = raw.trim() === '1';
    else if (t === 'e') { cell.value = xmlDecode(raw); cell.isError = true; }
    else if (t === 'd') { cell.value = xmlDecode(raw); cell.isIsoDate = true; }
    else { const n = Number(raw); cell.value = raw.trim() === '' ? null : (Number.isFinite(n) ? n : xmlDecode(raw)); }
    return cell;
  }

  /** Zellwert -> Feldwert nach Spaltentyp. Ungültiges bleibt als Text erhalten (Datencheck meldet es). */
  function typedValue(cell, type, date1904) {
    if (!cell || isEmpty(cell.value)) return '';
    const v = cell.value;
    switch (type) {
      case 'int':
        if (typeof v === 'number') return v;
        if (typeof v === 'string' && /^\s*-?\d+\s*$/.test(v)) return parseInt(v, 10);
        return typeof v === 'boolean' ? (v ? 'WAHR' : 'FALSCH') : String(v);
      case 'dateText':       // als Text gespeichert (lesbar ohne Zellformat), Excel-Datum wird aber auch verstanden
      case 'date':
        if (typeof v === 'number') return v >= 1 ? fmtDate(serialToParts(Math.floor(v + 1e-9), date1904)) : String(v);
        return parseLooseDate(v, false) || String(v);
      case 'dateTimeText':
      case 'datetime': {
        if (typeof v === 'number') {
          if (v < 1) return String(v);
          const p = serialToParts(v, date1904);
          return (Math.abs(v - Math.round(v)) < 1e-9) ? fmtDate(p) : fmtDateTime(p);
        }
        const dt = parseLooseDate(v, true);
        if (dt) return /T00:00$/.test(dt) && !/\d:\d/.test(String(v)) ? dt.slice(0, 10) : dt;
        return String(v);
      }
      case 'time':
        if (typeof v === 'number') { const frac = v - Math.floor(v); return fmtTime(serialToParts(frac, false)); }
        return parseLooseTime(v) || String(v);
      default:
        if (typeof v === 'number') return numberToText(v);
        if (typeof v === 'boolean') return v ? 'WAHR' : 'FALSCH';
        return v;
    }
  }
  function cellText(cell) { return cell ? (typeof cell.value === 'number' ? numberToText(cell.value) : String(cell.value ?? '')) : ''; }

  /* ---------------------------------------------------------------------------
   * 5. Datenmodell
   * ------------------------------------------------------------------------- */
  function normHeader(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

  function mapHeaders(headerRow, defs) {
    const byNorm = new Map(defs.map(d => [normHeader(d.header), d]));
    const colOf = {}, fieldAt = {}, unknown = [], duplicates = [];
    if (headerRow) {
      for (const [c, cell] of [...headerRow.cells.entries()].sort((a, b) => a[0] - b[0])) {
        const name = cellText(cell).trim(); if (!name) continue;
        const d = byNorm.get(normHeader(name));
        if (d) { if (colOf[d.key]) duplicates.push(d.header); else { colOf[d.key] = c; fieldAt[c] = d.key; } }
        else unknown.push({ col: c, name });
      }
    }
    const missing = defs.filter(d => !colOf[d.key] && !d.optional);
    const missingOptional = defs.filter(d => !colOf[d.key] && d.optional);
    return { colOf, fieldAt, unknown, duplicates, missing, missingOptional };
  }

  function findSheet(book, name) {
    return book.sheets.find(s => s.name === name) || book.sheets.find(s => (s.name || '').toLowerCase() === name.toLowerCase());
  }

  /** Datenblatt (Contacts/Activities) -> Datensätze. */
  function readDataSheet(book, sheetName, defs, problems) {
    const meta = findSheet(book, sheetName);
    if (!meta || !meta.path || !book.files[meta.path] || !meta.isWorksheet) {
      problems.push({ level: 'fatal', message: `Das Blatt „${sheetName}“ fehlt. Wurde es umbenannt oder gelöscht? Bitte den alten Namen wiederherstellen.` });
      return null;
    }
    const parsed = parseSheet(decodeXml(book.files[meta.path]), book);
    const headerRow = parsed.rows.find(r => r.r === 1) || null;
    const hm = mapHeaders(headerRow, defs);
    if (!headerRow) problems.push({ level: 'fatal', sheet: sheetName, message: `Im Blatt „${sheetName}“ fehlt die Kopfzeile (Zeile 1).` });
    if (hm.duplicates.length) problems.push({ level: 'fatal', sheet: sheetName, message: `Im Blatt „${sheetName}“ gibt es doppelte Spaltenüberschriften: ${hm.duplicates.join(', ')}.` });
    if (hm.missing.length) {
      const unk = hm.unknown.map(u => `„${u.name}“`).join(', ');
      problems.push({ level: 'fatal', sheet: sheetName, code: 'missingColumns', missing: hm.missing.map(d => d.header),
        message: `Im Blatt „${sheetName}“ fehlen Spalten: ${hm.missing.map(d => '„' + d.header + '“').join(', ')}.` + (unk ? ` Unbekannte Spalten gefunden: ${unk} – wurde eine umbenannt?` : '') });
    }
    const records = [];
    const seen = new Map();
    let droppedEmpty = 0;
    for (const row of parsed.rows) {
      if (row.r === 1) continue;
      let any = false;
      for (const cell of row.cells.values()) if (!isEmpty(cell.value) || cell.hasFormula) { any = true; break; }
      if (!any) { droppedEmpty++; continue; }        // nur formatierte, leere Zeile
      const v = {}, orig = {};
      for (const d of defs) {
        const c = hm.colOf[d.key]; if (!c) { v[d.key] = ''; continue; }
        const val = typedValue(row.cells.get(c), d.type, book.date1904);
        v[d.key] = val; orig[d.key] = val;
      }
      const id = typeof v.id === 'string' ? v.id : String(v.id || '');
      let key = id;
      if (!id) key = `#row${row.r}`;
      else if (seen.has(id)) key = `${id}#dup${row.r}`;
      else seen.set(id, row.r);
      records.push({ key, v, src: { row: row.r, attrs: row.attrs, cells: row.cells, orig, hasFormula: row.hasFormula }, ghost: !id, dup: key !== id && !!id });
    }
    return { meta, parsed, headerRow, hm, records, droppedEmpty };
  }

  /** Settings-Blatt lesen. Listen spaltenweise, Bänder/Gründer/Schlüssel zeilenweise. */
  function readSettings(book, problems) {
    const name = SCHEMA.sheets.settings;
    const meta = findSheet(book, name);
    if (!meta || !meta.path || !book.files[meta.path]) {
      problems.push({ level: 'fatal', message: `Das Blatt „${name}“ fehlt. Bitte aus der Vorlage wiederherstellen oder den Namen korrigieren.` });
      return null;
    }
    const parsed = parseSheet(decodeXml(book.files[meta.path]), book);
    const headerRow = parsed.rows.find(r => r.r === 1) || null;
    const hm = mapHeaders(headerRow, SCHEMA.settingsColumns);
    if (hm.missing.length) problems.push({ level: 'fatal', sheet: name, code: 'missingColumns', missing: hm.missing.map(d => d.header), message: `Im Blatt „${name}“ fehlen Spalten: ${hm.missing.map(d => '„' + d.header + '“').join(', ')}.` });
    const grid = new Map();  // "row:col" -> text
    for (const row of parsed.rows) if (row.r > 1) for (const [c, cell] of row.cells) if (hm.fieldAt[c]) grid.set(row.r + ':' + c, cellText(cell));
    const col = k => hm.colOf[k];
    const maxRow = parsed.rows.reduce((m, r) => Math.max(m, r.r), 1);
    const at = (r, k) => (col(k) ? (grid.get(r + ':' + col(k)) || '') : '');
    const list = k => { const out = []; for (let r = 2; r <= maxRow; r++) { const x = at(r, k).trim(); if (x) out.push(x); } return out; };
    const s = { categories: list('categories'), activityTypes: list('activityTypes'), outcomes: list('outcomes'), consentOptions: list('consentOptions'), founders: [], bands: [], kv: {} , kvOrder: [] };
    for (let r = 2; r <= maxRow; r++) {
      const fn = at(r, 'founderName').trim(); if (fn) s.founders.push({ name: fn, email: at(r, 'founderEmail').trim() });
      const num = x => (String(x).trim() === '' ? NaN : Number(String(x).replace(',', '.')));
      const bn = at(r, 'bandName').trim(); if (bn) s.bands.push({ name: bn, min: num(at(r, 'bandMin')), max: num(at(r, 'bandMax')), color: at(r, 'bandColor').trim() || '#888888' });
      const k = at(r, 'settingKey').trim(); if (k) { s.kv[k] = at(r, 'settingValue'); s.kvOrder.push(k); }
    }
    return { meta, parsed, headerRow, hm, settings: s };
  }

  function defaultSettings() {
    const D = SCHEMA.defaults;
    const s = { categories: D.categories.slice(), activityTypes: D.activityTypes.slice(), outcomes: D.outcomes.slice(), consentOptions: D.consentOptions.slice(),
      founders: D.founders.map(f => ({ ...f })), bands: D.bands.map(b => ({ ...b })), kv: {}, kvOrder: [] };
    for (const [k, v] of D.kv) { s.kv[k] = v; s.kvOrder.push(k); }
    return s;
  }
  /** Fehlende Einstellungen mit Standardwerten auffüllen (nur im Speicher). */
  function settingsWithDefaults(s) {
    const d = defaultSettings();
    const out = { ...s, kv: { ...s.kv }, kvOrder: s.kvOrder.slice() };
    for (const k of d.kvOrder) if (!(k in out.kv)) { out.kv[k] = d.kv[k]; out.kvOrder.push(k); }
    for (const k of ['categories', 'activityTypes', 'outcomes', 'consentOptions', 'founders', 'bands']) if (!out[k] || !out[k].length) out[k] = d[k];
    return out;
  }
  function settingNum(s, key, fallback) {
    const raw = String(((s && s.kv) || {})[key] ?? '').trim();   // fehlender Schlüssel -> Standardwert (nicht 0)
    const n = Number(raw.replace(',', '.'));
    return raw !== '' && Number.isFinite(n) ? n : fallback;
  }
  function settingBool(s, key) { return /^(ja|yes|true|1|x|wahr)$/i.test(String((s.kv || {})[key] || '').trim()); }

  /**
   * Komplette Datei lesen.
   * Rückgabe: { book, contacts, activities, settings, sheets:{...}, problems, readOnly }
   */
  function loadWorkbook(bytes) {
    const problems = [];
    const book = openBook(bytes);
    const c = readDataSheet(book, SCHEMA.sheets.contacts, DEF.contacts, problems);
    const a = readDataSheet(book, SCHEMA.sheets.activities, DEF.activities, problems);
    const st = readSettings(book, problems);
    const settings = st ? st.settings : defaultSettings();
    const readOnly = problems.some(p => p.level === 'fatal');
    return {
      book,
      contacts: c ? c.records : [],
      activities: a ? a.records : [],
      settings,
      sheets: { contacts: c, activities: a, settings: st },
      problems,
      readOnly,
    };
  }

  /* ---------------------------------------------------------------------------
   * 6. XLSX schreiben
   * ------------------------------------------------------------------------- */
  function cellRef(col, row) { return indexToCol(col) + row; }
  function sAttr(style) { return (style !== undefined && style !== null && style !== '') ? ` s="${style}"` : ''; }

  /** Neue Zelle für einen Feldwert erzeugen. */
  function genCell(P, col, row, value, type, style, date1904) {
    const r = cellRef(col, row);
    if (isEmpty(value)) return style !== undefined && style !== null && style !== '' && style !== '0' ? `<${P}c r="${r}"${sAttr(style)}/>` : '';
    const num = n => `<${P}c r="${r}"${sAttr(style)}><${P}v>${n}</${P}v></${P}c>`;
    const txt = t => `<${P}c r="${r}"${sAttr(style)} t="inlineStr"><${P}is><${P}t xml:space="preserve">${cellTextEscape(String(t))}</${P}t></${P}is></${P}c>`;
    if (type === 'int' && typeof value === 'number' && Number.isFinite(value)) return num(String(value));
    if ((type === 'date' || type === 'datetime') && typeof value === 'string' && (isDate(value) || isDateTime(value))) return num(String(partsToSerial(splitDT(value), date1904)));
    if (type === 'time' && typeof value === 'string' && isTime(value)) { const t = splitTime(value); return num(String((t.hh * 3600 + t.mi * 60 + t.ss) / 86400)); }
    return txt(typeof value === 'number' ? numberToText(value) : value);
  }

  /** Rohe Zelle mit neuer Zeilennummer ausgeben. */
  function emitRaw(P, cell, col, row) {
    const r = cellRef(col, row);
    return cell.selfClose ? `<${P}c r="${r}"${cell.attrs}/>` : `<${P}c r="${r}"${cell.attrs}>${cell.inner}</${P}c>`;
  }
  /** Zusatzspalten-Zelle: roh, aber geteilte/Array-Formeln entschärfen (sonst wären sie nach Zeilenverschiebung ungültig). */
  function emitExtra(P, cell, col, row, origRow, warnings) {
    if (!cell.hasFormula) return emitRaw(P, cell, col, row);
    const fRe = new RegExp(`<${P}f\\b([^>]*?)(?:/>|>([\\s\\S]*?)</${P}f>)`);
    const m = fRe.exec(cell.inner);
    if (!m) return emitRaw(P, cell, col, row);
    const a = parseAttrs(m[1]);
    let inner = cell.inner;
    if (a.t === 'shared') {
      if (m[2]) { inner = inner.replace(m[0], `<${P}f>${m[2]}</${P}f>`); warnings.add('sharedMaster'); }
      else { inner = inner.replace(m[0], ''); warnings.add('sharedChild'); }
    } else if (a.t === 'array') {
      const single = a.ref && /^[A-Z]+\d+$/.test(a.ref);
      if (single) inner = inner.replace(m[0], m[0].replace(/\sref\s*=\s*"[^"]*"/, ` ref="${cellRef(col, row)}"`));
      else { inner = inner.replace(m[0], ''); warnings.add('arrayToValue'); }
    } else if (a.t === 'dataTable') { inner = inner.replace(m[0], ''); warnings.add('dataTableToValue'); }
    else if (origRow !== row) warnings.add('formulaShifted');
    return emitRaw(P, { ...cell, inner }, col, row);
  }

  /**
   * Datenblatt neu zusammensetzen.
   *  sheet:   Ergebnis von readDataSheet() der Datei, die überschrieben wird (aktueller Stand auf der Platte)
   *  records: Datensätze in Ausgabereihenfolge; rec.src (falls vorhanden) stammt aus genau dieser Datei
   */
  /** Neue, optionale Spalten (spätere Tool-Versionen) rechts an die Kopfzeile anhängen. */
  function addOptionalColumns(sheet) {
    const hm = sheet.hm, hr = sheet.headerRow;
    if (!hr || !hm.missingOptional || !hm.missingOptional.length) return;
    const P = sheet.parsed.P;
    let maxCol = Math.max(0, ...hr.cells.keys(), ...Object.keys(hm.fieldAt).map(Number));
    for (const r of sheet.records) if (r.src) for (const c of r.src.cells.keys()) maxCol = Math.max(maxCol, c);
    const style = hr.cells.size ? [...hr.cells.values()].pop().s : undefined;
    for (const d of hm.missingOptional) {
      maxCol++;
      hr.cells.set(maxCol, { attrs: sAttr(style) + ' t="inlineStr"', inner: `<${P}is><${P}t>${xmlEscapeText(d.header)}</${P}t></${P}is>`, selfClose: false, value: d.header });
      hm.colOf[d.key] = maxCol; hm.fieldAt[maxCol] = d.key;
    }
    hm.missingOptional = [];
  }
  function buildDataSheetXml(sheet, defs, records, date1904, warnings) {
    addOptionalColumns(sheet);
    const { P, pre, post, colStyle } = sheet.parsed;
    const hm = sheet.hm;
    const typeOf = Object.fromEntries(defs.map(d => [d.key, d.type]));
    const knownCols = Object.keys(hm.fieldAt).map(Number).sort((a, b) => a - b);
    const lastStyle = {};
    const out = [];
    let maxCol = knownCols.length ? knownCols[knownCols.length - 1] : 1;
    // Kopfzeile unverändert
    const hr = sheet.headerRow;
    if (hr) {
      const cells = [...hr.cells.entries()].sort((a, b) => a[0] - b[0]);
      for (const [c] of cells) if (c > maxCol) maxCol = c;
      out.push(`<${P}row r="1"${hr.attrs}>` + cells.map(([c, cell]) => emitRaw(P, cell, c, 1)).join('') + `</${P}row>`);
    }
    let rowNum = 1;
    for (const rec of records) {
      rowNum++;
      const src = rec.src;
      const cols = new Set(knownCols);
      if (src) for (const c of src.cells.keys()) cols.add(c);
      const parts = [];
      for (const col of [...cols].sort((a, b) => a - b)) {
        if (col > maxCol) maxCol = col;
        const key = hm.fieldAt[col];
        const sc = src ? src.cells.get(col) : undefined;
        if (key) {
          const val = rec.v[key];
          if (sc && valuesEqual(val, src.orig[key])) { parts.push(emitRaw(P, sc, col, rowNum)); if (sc.s !== undefined) lastStyle[col] = sc.s; continue; }
          if (!sc && isEmpty(val)) continue;
          const style = sc && sc.s !== undefined ? sc.s : (colStyle[col] !== undefined ? colStyle[col] : lastStyle[col]);
          const x = sc ? genCell(P, col, rowNum, val, typeOf[key], style, date1904) : (isEmpty(val) ? '' : genCell(P, col, rowNum, val, typeOf[key], style, date1904));
          if (x) parts.push(x);
          if (style !== undefined) lastStyle[col] = style;
        } else if (sc) {
          parts.push(emitExtra(P, sc, col, rowNum, src.row, warnings));
        }
      }
      const attrs = src ? src.attrs : '';
      out.push(`<${P}row r="${rowNum}"${attrs}>` + parts.join('') + `</${P}row>`);
    }
    const lastRow = Math.max(1, rowNum);
    const dimRef = `A1:${indexToCol(maxCol)}${lastRow}`;
    let newPre = pre.replace(new RegExp(`<${P}dimension\\b[^>]*?/>`), `<${P}dimension ref="${dimRef}"/>`);
    let newPost = post.replace(new RegExp(`(<${P}autoFilter\\b[^>]*?\\sref\\s*=\\s*")([A-Z]+)(\\d+):([A-Z]+)(\\d+)(")`),
      (m, a, c1, r1, c2, r2, z) => `${a}${c1}${r1}:${c2}${Math.max(lastRow, +r1)}${z}`);
    return { xml: newPre + `<${P}sheetData>` + out.join('') + `</${P}sheetData>` + newPost, lastRow, maxCol };
  }

  /** Settings-Blatt: bekannte Spalten aus dem Modell, unbekannte Zellen bleiben an ihrer Stelle. */
  function buildSettingsXml(st, settings, warnings) {
    const { P, pre, post, colStyle } = st.parsed;
    const hm = st.hm;
    const want = new Map(); // "row:col" -> value
    const put = (key, values) => { const c = hm.colOf[key]; if (!c) return; values.forEach((v, i) => want.set((i + 2) + ':' + c, v)); };
    put('categories', settings.categories); put('activityTypes', settings.activityTypes);
    put('outcomes', settings.outcomes); put('consentOptions', settings.consentOptions);
    put('founderName', settings.founders.map(f => f.name)); put('founderEmail', settings.founders.map(f => f.email || ''));
    put('bandName', settings.bands.map(b => b.name)); put('bandMin', settings.bands.map(b => b.min));
    put('bandMax', settings.bands.map(b => b.max)); put('bandColor', settings.bands.map(b => b.color));
    put('settingKey', settings.kvOrder); put('settingValue', settings.kvOrder.map(k => settings.kv[k] ?? ''));
    const numericKeys = new Set([hm.colOf.bandMin, hm.colOf.bandMax]);
    const srcRows = new Map(st.parsed.rows.map(r => [r.r, r]));
    let maxRow = 1; for (const k of want.keys()) maxRow = Math.max(maxRow, +k.split(':')[0]);
    for (const r of st.parsed.rows) maxRow = Math.max(maxRow, r.r);
    let maxCol = 1; const out = [];
    for (let r = 1; r <= maxRow; r++) {
      const src = srcRows.get(r);
      if (r === 1) { if (src) { const cells = [...src.cells.entries()].sort((a, b) => a[0] - b[0]); cells.forEach(([c]) => { maxCol = Math.max(maxCol, c); }); out.push(`<${P}row r="1"${src.attrs}>` + cells.map(([c, cell]) => emitRaw(P, cell, c, 1)).join('') + `</${P}row>`); } continue; }
      const cols = new Set(Object.keys(hm.fieldAt).map(Number));
      if (src) for (const c of src.cells.keys()) cols.add(c);
      const parts = [];
      for (const c of [...cols].sort((a, b) => a - b)) {
        const sc = src ? src.cells.get(c) : undefined;
        if (hm.fieldAt[c]) {
          const v = want.has(r + ':' + c) ? want.get(r + ':' + c) : '';
          const old = sc ? cellText(sc) : '';
          if (sc && String(v) === old) { parts.push(emitRaw(P, sc, c, r)); maxCol = Math.max(maxCol, c); continue; }
          if (isEmpty(v)) { if (sc && sc.s !== undefined && sc.s !== '0') { parts.push(`<${P}c r="${cellRef(c, r)}"${sAttr(sc.s)}/>`); maxCol = Math.max(maxCol, c); } continue; }
          const style = sc && sc.s !== undefined ? sc.s : colStyle[c];
          const isNum = numericKeys.has(c) && Number.isFinite(Number(v)) && String(v).trim() !== '';
          parts.push(genCell(P, c, r, isNum ? Number(v) : String(v), isNum ? 'int' : 'text', style, false));
          maxCol = Math.max(maxCol, c);
        } else if (sc) { parts.push(emitExtra(P, sc, c, r, r, warnings)); maxCol = Math.max(maxCol, c); }
      }
      if (parts.length || (src && src.attrs.trim())) out.push(`<${P}row r="${r}"${src ? src.attrs : ''}>` + parts.join('') + `</${P}row>`);
    }
    const dimRef = `A1:${indexToCol(maxCol)}${maxRow}`;
    const newPre = pre.replace(new RegExp(`<${P}dimension\\b[^>]*?/>`), `<${P}dimension ref="${dimRef}"/>`);
    return newPre + `<${P}sheetData>` + out.join('') + `</${P}sheetData>` + post;
  }

  /** Tabellen (ListObjects) auf einem unserer Blätter an die neue Zeilenzahl anpassen. */
  function patchTablesForSheet(book, sheetPath, lastRow, files) {
    const relsPath = relsPathFor(sheetPath);
    if (!book.files[relsPath]) return 0;
    let n = 0;
    for (const rel of parseRels(decodeXml(book.files[relsPath]))) {
      if (!rel.type.endsWith('/table')) continue;
      const tPath = resolvePath(dirname(sheetPath), rel.target);
      if (!book.files[tPath]) continue;
      let xml = decodeXml(book.files[tPath]);
      xml = xml.replace(/(\sref\s*=\s*")([A-Z]+)(\d+):([A-Z]+)(\d+)(")/g, (m, a, c1, r1, c2, r2, z) => `${a}${c1}${r1}:${c2}${Math.max(lastRow, +r1 + 1)}${z}`);
      files[tPath] = encodeXml(xml); n++;
    }
    return n;
  }

  /**
   * Neue Datei-Bytes erzeugen.
   *  loaded: Ergebnis von loadWorkbook() der AKTUELLEN Datei auf der Platte (wird gepatcht)
   *  data:   { contacts, activities, settings } – zu schreibender Stand (Datensätze mit src aus `loaded`)
   */
  function writeWorkbook(loaded, data, opts) {
    opts = opts || {};
    if (loaded.readOnly) throw new XlsxError('Die Datei hat strukturelle Probleme und wird nicht überschrieben.', 'readonly');
    const book = loaded.book;
    const warnings = new Set();
    const files = {};
    for (const name of book.order) files[name] = book.files[name];
    const C = loaded.sheets.contacts, A = loaded.sheets.activities, S = loaded.sheets.settings;
    const cRes = buildDataSheetXml(C, DEF.contacts, data.contacts, book.date1904, warnings);
    const aRes = buildDataSheetXml(A, DEF.activities, data.activities, book.date1904, warnings);
    files[C.meta.path] = encodeXml(cRes.xml);
    files[A.meta.path] = encodeXml(aRes.xml);
    files[S.meta.path] = encodeXml(buildSettingsXml(S, data.settings, warnings));
    if (C.parsed.features.tables) patchTablesForSheet(book, C.meta.path, cRes.lastRow, files);
    if (A.parsed.features.tables) patchTablesForSheet(book, A.meta.path, aRes.lastRow, files);

    // workbook.xml: Filterbereiche nachziehen; Neuberechnung erzwingen, wenn andere Blätter unsere Daten per Formel nutzen
    let wbXml = book.wbXml; let wbChanged = false;
    const sheetIndex = name => book.sheets.findIndex(s => s.name === name);
    const fixFilterDb = (idx, lastRow) => {
      const re = new RegExp(`(<(?:\\w+:)?definedName\\b[^>]*name="_xlnm\\._FilterDatabase"[^>]*localSheetId="${idx}"[^>]*>[^<]*?\\$[A-Z]+\\$)(\\d+)(:\\$[A-Z]+\\$)(\\d+)(<)`);
      const nx = wbXml.replace(re, (m, a, r1, b, r2, z) => `${a}${r1}${b}${Math.max(lastRow, +r1)}${z}`);
      if (nx !== wbXml) { wbXml = nx; wbChanged = true; }
    };
    fixFilterDb(sheetIndex(C.meta.name), cRes.lastRow);
    fixFilterDb(sheetIndex(A.meta.name), aRes.lastRow);
    const ourNames = [C.meta.name, A.meta.name, S.meta.name];
    let otherFormulasUseUs = false;
    for (const s of book.sheets) {
      if (ourNames.includes(s.name) || !s.path || !book.files[s.path]) continue;
      const x = decodeXml(book.files[s.path]);
      if (/<(?:\w+:)?f\b/.test(x) && ourNames.some(n => x.includes(n + '!') || x.includes("'" + n + "'!"))) { otherFormulasUseUs = true; break; }
    }
    if (otherFormulasUseUs && !/fullCalcOnLoad\s*=\s*"(1|true)"/.test(wbXml)) {
      if (/<(?:\w+:)?calcPr\b/.test(wbXml)) wbXml = wbXml.replace(/<((?:\w+:)?calcPr)\b/, '<$1 fullCalcOnLoad="1"');
      else wbXml = wbXml.replace(/(<\/(?:\w+:)?workbook>)/, '<calcPr fullCalcOnLoad="1"/>$1');
      wbChanged = true;
    }
    // calcChain verweist auf Formelzellen; wenn unsere Blätter Formeln enthalten, kann er nach Zeilenverschiebung veralten -> entfernen (Excel baut ihn neu)
    const ourHaveFormulas = [C, A, S].some(x => x.parsed.rows.some(r => r.hasFormula));
    const ccRel = book.wbRels.find(r => r.type.endsWith('/calcChain'));
    if (ourHaveFormulas && ccRel) {
      const ccPath = resolvePath(dirname(book.wbPath), ccRel.target);
      delete files[ccPath];
      let rels = decodeXml(book.files[book.wbRelsPath]);
      rels = rels.replace(new RegExp(`<(?:\\w+:)?Relationship\\b[^>]*Id="${ccRel.id}"[^>]*/>`), '');
      files[book.wbRelsPath] = encodeXml(rels);
      if (files['[Content_Types].xml']) {
        let ct = decodeXml(files['[Content_Types].xml']);
        ct = ct.replace(new RegExp(`<Override\\b[^>]*PartName="/${ccPath.replace(/[.]/g, '\\.')}"[^>]*/>`), '');
        files['[Content_Types].xml'] = encodeXml(ct);
      }
      warnings.add('calcChainRemoved');
    }
    if (wbChanged) files[book.wbPath] = encodeXml(wbXml);
    const zipped = fflate.zipSync(files, { level: opts.level ?? 6 });
    return { bytes: zipped, warnings: [...warnings], lastRows: { contacts: cRes.lastRow, activities: aRes.lastRow } };
  }

  /** Fehlende Spalten am Ende der Kopfzeile ergänzen (Reparatur, ändert keine Daten). */
  function repairMissingColumns(bytes) {
    const loaded = loadWorkbook(bytes);
    const book = loaded.book;
    const files = {}; for (const n of book.order) files[n] = book.files[n];
    let changed = 0;
    const fix = (sheet, defs) => {
      if (!sheet || !sheet.headerRow || !sheet.hm.missing.length) return;
      const { P, pre, post } = sheet.parsed;
      const hr = sheet.headerRow;
      let maxCol = Math.max(0, ...hr.cells.keys());
      const style = hr.cells.size ? [...hr.cells.values()].pop().s : undefined;
      for (const d of sheet.hm.missing) { maxCol++; hr.cells.set(maxCol, { attrs: sAttr(style) + ' t="inlineStr"', inner: `<${P}is><${P}t>${xmlEscapeText(d.header)}</${P}t></${P}is>`, selfClose: false, value: d.header }); changed++; }
      let xml = decodeXml(book.files[sheet.meta.path]);
      const cells = [...hr.cells.entries()].sort((a, b) => a[0] - b[0]).map(([c, cell]) => emitRaw(P, cell, c, 1)).join('');
      const rowRe = new RegExp(`<${P}row\\b[^>]*?\\sr="1"[^>]*?(?:/>|>[\\s\\S]*?</${P}row>)`);
      xml = xml.replace(rowRe, `<${P}row r="1"${hr.attrs}>${cells}</${P}row>`);
      files[sheet.meta.path] = encodeXml(xml);
    };
    fix(loaded.sheets.contacts, DEF.contacts);
    fix(loaded.sheets.activities, DEF.activities);
    return { bytes: fflate.zipSync(files, { level: 6 }), added: changed };
  }

  /* ---------------------------------------------------------------------------
   * 7. Automatische Spalten
   * ------------------------------------------------------------------------- */
  function isContactActivity(a) { return !isEmpty(a.v.direction) && !NON_CONTACT_TYPES.has(a.v.type); }
  function followUpKey(a) { return a.v.fuDate + 'T' + (isTime(a.v.fuTime) ? a.v.fuTime : '00:00'); }
  function isOpenFollowUp(a) { return isDate(a.v.fuDate) && isEmpty(a.v.fuDone); }
  /** Website-Eingabe in einen sicheren Link verwandeln (nur http/https). Leer, wenn es keine plausible Adresse ist. */
  /* ----- Process Management: abgeleitete Werte (keine zweite Wahrheit) ----- */
  const PM_FIRST = 2;                       // ab „Replied / Engaged“ gehört ein Kontakt in Process Management
  /** Prozessstatus wird nur aus der Phase (+ Startdatum) abgeleitet: active | won | lost | inactive | none */
  function processStatus(v) {
    const i = stageIndex(v);
    if (i === STAGES.length - 1) return 'lost';
    if (i === STAGES.length - 2) return 'won';
    if (i >= PM_FIRST && i < STAGES.length - 2) return 'active';
    return isEmpty(v && v.procStart) ? 'none' : 'inactive';
  }
  function inProcess(v) { return processStatus(v) !== 'none'; }
  /** Aufgabenstatus: „Erledigt“ ergibt sich allein aus dem Erledigt-Zeitpunkt, sonst gespeicherter Status oder „Offen“. */
  function taskStatus(a) { return !isEmpty(a.v.todoDone) ? 'Erledigt' : (String(a.v.todoStatus || '').trim() || 'Offen'); }
  function isTask(a) { return !isEmpty(a.v.nextStep) && String(a.v.nextStep).trim() !== ''; }
  /** Betrag tolerant lesen: „5.000“, „5000 €“, „5 000“ -> 5000. Leer -> ''. Ungültig -> null. */
  function parseAmount(raw) {
    const t = String(raw ?? '').trim(); if (!t) return '';
    const n = t.replace(/[€\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(/,\d{1,2}$/, '');
    return /^\d{1,10}$/.test(n) ? parseInt(n, 10) : null;
  }
  function fmtAmount(n) { return typeof n === 'number' && Number.isFinite(n) ? n.toLocaleString('de-DE') + ' €' : ''; }
  /** Phase eines Kontakts; leer zählt als erste Phase („Cold“). */
  function stageOf(v) { const t = String((v && v.stage) ?? '').trim(); return t || STAGES[0]; }
  function stageIndex(v) { const i = STAGES.indexOf(stageOf(v)); return i < 0 ? STAGES.length : i; }
  /** Laufende Phasen (zwischen „Cold“ und „Closed …“) – nur diese können „kalt werden“. */
  function isActiveStage(v) { const i = STAGES.indexOf(stageOf(v)); return i > 0 && i < STAGES.length - 2; }
  /** To-do-Priorität: 1 = höchste, 3 = niedrigste; leer/ungültig zählt als 2. */
  function todoPrio(a) { const n = Number(a && a.v ? a.v.todoPrio : a); return n === 1 || n === 2 || n === 3 ? n : 2; }
  function websiteUrl(raw) {
    let t = String(raw ?? '').trim(); if (!t || /\s/.test(t)) return '';
    if (!/^https?:\/\//i.test(t)) { if (/^[a-z][a-z0-9+.-]*:/i.test(t) && !/^[^:/]+:\d+/.test(t)) return ''; t = 'https://' + t; }
    try { const u = new URL(t); if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) return ''; return u.href; } catch (_) { return ''; }
  }
  /** LinkedIn-Profil/Firmenseite: nur Links auf linkedin.com. */
  function linkedinUrl(raw) { const u = websiteUrl(raw); if (!u) return ''; try { return /(^|\.)linkedin\.com$/i.test(new URL(u).hostname) ? u : ''; } catch (_) { return ''; } }
  function linkedinLabel(raw) { const m = /linkedin\.com\/(in|company|pub)\/([^/?#]+)/i.exec(String(raw || '')); return m ? (m[1].toLowerCase() === 'company' ? 'Firmenseite: ' : '') + decodeURIComponent(m[2]) : websiteLabel(raw); }
  function websiteLabel(raw) { return String(raw ?? '').trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/$/, ''); }
  function isOpenTodo(a) { return !isEmpty(a.v.nextStep) && String(a.v.nextStep).trim() !== '' && isEmpty(a.v.todoDone); }
  /** Index Aktivitäten je Kontakt (neueste zuerst). */
  function indexActivities(activities) {
    const m = new Map();
    for (const a of activities) { const k = a.v.contactId; if (!k) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
    for (const list of m.values()) list.sort((x, y) => String(y.v.at).localeCompare(String(x.v.at)));
    return m;
  }
  function computeAuto(contacts, activities, byContact) {
    byContact = byContact || indexActivities(activities);
    for (const c of contacts) {
      const list = byContact.get(c.v.id) || [];
      let last = '', next = null;
      for (const a of list) {
        if (isContactActivity(a) && isDateTime(a.v.at) && a.v.at > last) last = a.v.at;
        if (isOpenFollowUp(a) && (!next || followUpKey(a) < followUpKey(next))) next = a;
      }
      c.v.lastContacted = last;
      c.v.nextFollowUp = next ? (isTime(next.v.fuTime) ? `${next.v.fuDate}T${next.v.fuTime}` : next.v.fuDate) : '';
      c.v.followUpFor = next ? (next.v.assignedTo || '') : '';
    }
    return byContact;
  }

  /* ---------------------------------------------------------------------------
   * 8. Drei-Wege-Merge
   *    base   = Stand beim letzten Laden/Speichern
   *    mine   = mein Arbeitsstand (base + meine Änderungen)
   *    theirs = aktuelle Datei auf der Platte (enthält Änderungen der anderen)
   *    Ergebnis = theirs + meine Änderungen. Konflikte nur, wenn dasselbe Feld
   *    auf beiden Seiten unterschiedlich geändert wurde (oder Löschung vs. Änderung).
   * ------------------------------------------------------------------------- */
  function cloneRec(r) { return { key: r.key, v: { ...r.v }, src: r.src || null, ghost: r.ghost, dup: r.dup }; }
  function recChanged(a, b, fields) { return fields.some(f => !valuesEqual(a.v[f], b.v[f])); }
  function changedFields(a, b, fields) { return fields.filter(f => !valuesEqual(a.v[f], b.v[f])); }

  function mergeCollection(coll, base, mine, theirs, resolutions, conflicts, restoredByMe) {
    const fields = MERGE_FIELDS[coll];
    const B = new Map(base.map(r => [r.key, r])), M = new Map(mine.map(r => [r.key, r])), T = new Map(theirs.map(r => [r.key, r]));
    const result = new Map();
    const order = theirs.map(r => r.key).concat(mine.filter(r => !T.has(r.key)).map(r => r.key));
    const res = (k, f) => resolutions[`${coll}|${k}|${f || '*'}`];
    const deletedByMe = new Set(), deletedByThem = new Set();
    for (const key of order) {
      if (result.has(key)) continue;
      const b = B.get(key), m = M.get(key), t = T.get(key);
      if (!b) {
        if (m && !t) result.set(key, { ...cloneRec(m), src: null });
        else if (!m && t) result.set(key, cloneRec(t));
        else if (m && t) {  // gleiche ID neu auf beiden Seiten (praktisch ausgeschlossen)
          if (!recChanged(m, t, fields)) result.set(key, cloneRec(t));
          else { const r = res(key); if (r === 'mine') result.set(key, { ...cloneRec(t), v: { ...m.v } }); else { if (!r) conflicts.push({ kind: 'idClash', coll, key, mine: m.v, theirs: t.v }); result.set(key, cloneRec(t)); } }
        }
        continue;
      }
      if (!m && !t) continue;                                      // beide gelöscht
      if (!m && t) {                                               // ich habe gelöscht
        if (!recChanged(b, t, fields)) { deletedByMe.add(key); continue; }
        const r = res(key);
        if (r === 'mine') { deletedByMe.add(key); continue; }
        if (!r) conflicts.push({ kind: 'deletedByMe', coll, key, base: b.v, theirs: t.v, fields: changedFields(b, t, fields) });
        result.set(key, cloneRec(t)); continue;
      }
      if (m && !t) {                                               // andere haben gelöscht
        if (!recChanged(b, m, fields)) { deletedByThem.add(key); continue; }
        const r = res(key);
        if (r === 'theirs') { deletedByThem.add(key); continue; }
        if (!r) conflicts.push({ kind: 'deletedByThem', coll, key, base: b.v, mine: m.v, fields: changedFields(b, m, fields) });
        if (restoredByMe) restoredByMe.add(m.v.id);
        result.set(key, { ...cloneRec(m), src: null }); continue;  // vorläufig: meine Version wiederherstellen
      }
      // auf beiden Seiten vorhanden: feldweise
      const out = cloneRec(t);
      let mineTouched = false;
      for (const f of fields) {
        const bf = b.v[f], mf = m.v[f], tf = t.v[f];
        if (valuesEqual(mf, bf)) continue;                         // ich habe nichts geändert -> theirs
        mineTouched = true;
        if (valuesEqual(tf, bf) || valuesEqual(mf, tf)) { out.v[f] = mf; continue; }
        const r = res(key, f);
        if (r === 'mine') out.v[f] = mf;
        else if (r === 'theirs') out.v[f] = tf;
        else { conflicts.push({ kind: 'field', coll, key, field: f, base: bf, mine: mf, theirs: tf, rec: { mine: m.v, theirs: t.v } }); out.v[f] = tf; }
      }
      if (coll === 'contacts' && mineTouched) {                   // Geändert/Geändert von: der spätere Stempel gewinnt
        if (String(m.v.updated || '') >= String(t.v.updated || '')) { out.v.updated = m.v.updated; out.v.updatedBy = m.v.updatedBy; }
      }
      result.set(key, out);
    }
    return { list: [...result.values()], deletedByMe, deletedByThem };
  }

  function settingsFields(s) {
    const f = {
      categories: JSON.stringify(s.categories), activityTypes: JSON.stringify(s.activityTypes), outcomes: JSON.stringify(s.outcomes),
      consentOptions: JSON.stringify(s.consentOptions), founders: JSON.stringify(s.founders), bands: JSON.stringify(s.bands),
    };
    for (const k of s.kvOrder) if (!SETTINGS_IGNORE_IN_MERGE.has(k)) f['kv:' + k] = String(s.kv[k] ?? '');
    return f;
  }
  function settingsFromFields(f, template) {
    const s = { categories: JSON.parse(f.categories), activityTypes: JSON.parse(f.activityTypes), outcomes: JSON.parse(f.outcomes),
      consentOptions: JSON.parse(f.consentOptions), founders: JSON.parse(f.founders), bands: JSON.parse(f.bands), kv: {}, kvOrder: [] };
    const keys = template.kvOrder.slice();
    for (const k of Object.keys(f)) if (k.startsWith('kv:') && !keys.includes(k.slice(3))) keys.push(k.slice(3));
    for (const k of keys) {
      if (SETTINGS_IGNORE_IN_MERGE.has(k)) { s.kv[k] = template.kv[k] ?? ''; s.kvOrder.push(k); }
      else if (('kv:' + k) in f) { s.kv[k] = f['kv:' + k]; s.kvOrder.push(k); }
    }
    return s;
  }
  function mergeSettings(base, mine, theirs, resolutions, conflicts) {
    const B = settingsFields(base), M = settingsFields(mine), T = settingsFields(theirs);
    const out = { ...T };
    for (const k of new Set([...Object.keys(B), ...Object.keys(M), ...Object.keys(T)])) {
      const bf = B[k], mf = M[k], tf = T[k];
      if (mf === bf) continue;
      if (tf === bf || mf === tf) { if (mf === undefined) delete out[k]; else out[k] = mf; continue; }
      const r = resolutions[`settings|settings|${k}`];
      if (r === 'mine') { if (mf === undefined) delete out[k]; else out[k] = mf; }
      else if (r !== 'theirs') conflicts.push({ kind: 'field', coll: 'settings', key: 'settings', field: k, base: bf, mine: mf, theirs: tf });
    }
    return settingsFromFields(out, theirs);
  }

  /**
   * Gesamter Merge. Rückgabe { contacts, activities, settings, conflicts }.
   * resolutions: { "coll|key|field": "mine"|"theirs" } bzw. "coll|key|*" für ganze Datensätze.
   */
  function mergeAll(base, mine, theirs, resolutions) {
    resolutions = resolutions || {};
    const conflicts = [];
    const restoredByMe = new Set();   // von anderen gelöschte Kontakte, die ich wiederherstelle
    const c = mergeCollection('contacts', base.contacts, mine.contacts, theirs.contacts, resolutions, conflicts, restoredByMe);
    const a = mergeCollection('activities', base.activities, mine.activities, theirs.activities, resolutions, conflicts);
    // Wiederhergestellter Kontakt -> seine (von den anderen mitgelöschten) Aktivitäten ebenfalls zurückholen
    if (restoredByMe.size) {
      const have = new Set(a.list.map(x => x.key));
      for (const m of mine.activities) if (restoredByMe.has(m.v.contactId) && !have.has(m.key)) { a.list.push({ ...cloneRec(m), src: null }); have.add(m.key); }
    }
    const settings = mergeSettings(base.settings, mine.settings, theirs.settings, resolutions, conflicts);
    // Waisen durch Löschungen auflösen
    const contactIds = new Set(c.list.map(r => r.v.id));
    const baseActs = new Set(base.activities.map(r => r.key));
    const mineActs = new Set(mine.activities.map(r => r.key));
    const keepActs = [];
    const restored = new Set();   // Kontakte, deren Löschung (durch mich) zurückgenommen wurde
    for (const act of a.list) {
      const cid = act.v.contactId;
      if (!cid || contactIds.has(cid)) { keepActs.push(act); continue; }
      const contactWasInBase = base.contacts.some(x => x.v.id === cid);
      if (!contactWasInBase) { keepActs.push(act); continue; }       // war schon vorher verwaist -> nicht anfassen
      if (c.deletedByMe.has(cid)) {
        // Ich habe den Kontakt gelöscht, jemand anderes hat danach eine Aktivität erfasst/geändert.
        // Ein evtl. schon gemeldeter Aktivitäts-Konflikt geht in diesem auf.
        for (let i = conflicts.length - 1; i >= 0; i--) if (conflicts[i].coll === 'activities' && conflicts[i].key === act.key) conflicts.splice(i, 1);
        const r = resolutions[`activities|${act.key}|*`];
        if (r === 'mine') continue;                                     // mitlöschen
        if (r === 'theirs') {                                           // Kontakt doch behalten
          const tc = theirs.contacts.find(x => x.v.id === cid);
          if (tc && !contactIds.has(cid)) { c.list.push(cloneRec(tc)); contactIds.add(cid); c.deletedByMe.delete(cid); restored.add(cid); }
          keepActs.push(act); continue;
        }
        conflicts.push({ kind: 'orphanAfterMyDelete', coll: 'activities', key: act.key, contactId: cid, theirs: act.v, contactTheirs: (theirs.contacts.find(x => x.v.id === cid) || {}).v });
        keepActs.push(act); continue;
      }
      if (c.deletedByThem.has(cid)) {
        // Jemand anderes hat den Kontakt gelöscht, ich habe eine Aktivität erfasst
        const isMineNew = mineActs.has(act.key) && !baseActs.has(act.key);
        if (!isMineNew) continue;
        const r = resolutions[`activities|${act.key}|*`];
        if (r === 'theirs') continue;                                   // meine Aktivität verwerfen
        if (r === 'mine') {                                             // Kontakt wiederherstellen
          const bc = mine.contacts.find(x => x.v.id === cid) || base.contacts.find(x => x.v.id === cid);
          if (bc && !contactIds.has(cid)) { c.list.push({ ...cloneRec(bc), src: null }); contactIds.add(cid); }
          keepActs.push(act); continue;
        }
        conflicts.push({ kind: 'orphanAfterTheirDelete', coll: 'activities', key: act.key, contactId: cid, mine: act.v, contactBase: (base.contacts.find(x => x.v.id === cid) || {}).v });
        keepActs.push(act); continue;
      }
      keepActs.push(act);
    }
    // Löschung zurückgenommen -> auch die mitgelöschten Aktivitäten (Stand der anderen) zurückholen
    if (restored.size) {
      const have = new Set(keepActs.map(x => x.key));
      for (const t of theirs.activities) if (restored.has(t.v.contactId) && !have.has(t.key)) keepActs.push(cloneRec(t));
    }
    return { contacts: c.list, activities: keepActs, settings, conflicts };
  }

  /* ----- Versionskette ---------------------------------------------------------
   * Jede gespeicherte Fassung bekommt eine zufällige Kennung und trägt die Kennungen
   * ihrer Vorgänger mit. Daran erkennt das Tool, ob eine neue Datei auf der eigenen
   * letzten Speicherung aufbaut (alles gut) oder ob die Synchronisierung sie durch eine
   * "Geschwister"-Fassung ersetzt hat (dann fehlen die eigenen Änderungen und werden
   * wieder eingespielt).
   * -------------------------------------------------------------------------- */
  function versionInfo(settings) {
    const kv = (settings && settings.kv) || {};
    const id = String(kv['File version'] || '').trim();
    const hist = String(kv['Version history'] || '').split(/[\s,]+/).filter(Boolean);
    return { id, history: id ? [id, ...hist.filter(x => x !== id)] : hist };
  }
  /** Kennung + Verlauf für eine neue Fassung, die auf `parentSettings` aufbaut. */
  function nextVersion(parentSettings) {
    const p = versionInfo(parentSettings);
    const id = 'V' + randomChars(10);
    return { id, history: p.history.slice(0, HISTORY_LEN - 1) };
  }
  function stampVersion(settings, v, who, at) {
    const s = JSON.parse(JSON.stringify(settings));
    const set = (k, val) => { if (!s.kvOrder.includes(k)) s.kvOrder.push(k); s.kv[k] = val; };
    set('Last saved by', who || ''); set('Last saved at', at || nowBerlin());
    set('File version', v.id); set('Version history', v.history.join(','));
    return s;
  }
  /**
   * Eigene Speicherungen, die in `theirs` (noch) nicht enthalten sind.
   * journal: [{ id, P, W }] in zeitlicher Reihenfolge (P = Stand vor, W = Stand nach meiner Speicherung).
   * Rückgabe: die nicht bestätigten Einträge (leer = alles enthalten).
   */
  function unackedWrites(journal, theirsSettings) {
    if (!journal || !journal.length) return [];
    const hist = new Set(versionInfo(theirsSettings).history);
    let k = -1;
    for (let i = journal.length - 1; i >= 0; i--) if (hist.has(journal[i].id)) { k = i; break; }
    return journal.slice(k + 1);
  }

  /** Was haben andere geändert? (base -> theirs) – für "Updated by"-Hinweise. */
  function describeChanges(base, theirs) {
    const out = [];
    const nameOf = v => displayName(v);
    for (const coll of ['contacts', 'activities']) {
      const B = new Map(base[coll].map(r => [r.key, r])), T = new Map(theirs[coll].map(r => [r.key, r]));
      const fields = MERGE_FIELDS[coll];
      for (const [k, t] of T) {
        const b = B.get(k);
        if (!b) out.push({ coll, kind: 'added', key: k, v: t.v, who: coll === 'contacts' ? t.v.createdBy : t.v.loggedBy });
        else if (recChanged(b, t, fields)) out.push({ coll, kind: 'changed', key: k, v: t.v, fields: changedFields(b, t, fields), who: coll === 'contacts' ? t.v.updatedBy : t.v.loggedBy });
      }
      for (const [k, b] of B) if (!T.has(k)) out.push({ coll, kind: 'deleted', key: k, v: b.v });
    }
    const contactsById = new Map(theirs.contacts.map(c => [c.v.id, c.v]).concat(base.contacts.map(c => [c.v.id, c.v])));
    for (const ch of out) ch.label = ch.coll === 'contacts' ? nameOf(ch.v) : nameOf(contactsById.get(ch.v.contactId) || {});
    if (JSON.stringify(settingsFields(base.settings)) !== JSON.stringify(settingsFields(theirs.settings))) out.push({ coll: 'settings', kind: 'changed', label: 'Einstellungen' });
    return out;
  }

  /* ---------------------------------------------------------------------------
   * 9. Datencheck
   * ------------------------------------------------------------------------- */
  const RX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function validEmail(s) { return isEmpty(s) || RX_EMAIL.test(String(s).trim()); }
  function validPhone(s) { if (isEmpty(s)) return true; const t = String(s).trim(); return /^[+()\d\s\/.-]{5,}$/.test(t) && (t.match(/\d/g) || []).length >= 5; }
  function isFlagYes(v) { return v === true || /^(ja|yes|x|1|true|wahr)$/i.test(String(v ?? '').trim()); }
  function validTemp(v) { return isEmpty(v) || (typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 100); }

  function dataCheck(state) {
    const issues = [];
    const push = (level, sheet, row, message, key) => issues.push({ level, sheet, row, message, key });
    const S = state.sheets || {};
    const contactIds = new Set();
    for (const c of state.contacts) {
      const row = c.src ? c.src.row : null;
      if (c.ghost) { push('error', 'Contacts', row, 'Zeile ohne Contact ID – bleibt erhalten, ist im Tool aber nicht sichtbar.', c.key); continue; }
      if (c.dup) { const first = state.contacts.find(x => x.key === c.v.id); push('error', 'Contacts', row, `Doppelte Contact ID „${c.v.id}“` + (first && first.src ? ` (erste Fundstelle Zeile ${first.src.row})` : '') + '. Die zweite Zeile bleibt erhalten, ist im Tool aber schreibgeschützt.', c.key); continue; }
      contactIds.add(c.v.id);
      if (!/^C-[A-Z0-9]{8}$/.test(c.v.id)) push('info', 'Contacts', row, `Ungewöhnliches ID-Format „${c.v.id}“.`, c.key);
      if (isEmpty(c.v.firstName) && isEmpty(c.v.lastName) && isEmpty(c.v.company)) push('warn', 'Contacts', row, 'Weder Name noch Firma eingetragen.', c.key);
      for (const f of ['dealValue', 'finalValue', 'proposalAmount']) if (!isEmpty(c.v[f]) && typeof c.v[f] !== 'number') push('warn', 'Contacts', row, `${FIELD_LABELS[f]} ist keine ganze Zahl: „${c.v[f]}“.`, c.key);
      for (const f of ['procStart', 'procClosed', 'draftsSent', 'draftsFeedback', 'proposalDate', 'decisionDate']) if (!isEmpty(c.v[f]) && !isDate(c.v[f])) push('warn', 'Contacts', row, `Ungültiges Datum in „${FIELD_LABELS[f]}“: „${c.v[f]}“.`, c.key);
      if (!isEmpty(c.v.stage) && !STAGES.includes(String(c.v.stage).trim())) push('warn', 'Contacts', row, `Unbekannte Phase „${c.v.stage}“.`, c.key);
      if (!validTemp(c.v.temperature)) push('error', 'Contacts', row, `Ungültige Temperatur „${c.v.temperature}“ (erlaubt: ganze Zahl 0–100 oder leer).`, c.key);
      if (!validEmail(c.v.email)) push('warn', 'Contacts', row, `E-Mail sieht ungültig aus: „${c.v.email}“.`, c.key);
      if (!validPhone(c.v.phone)) push('warn', 'Contacts', row, `Telefonnummer sieht ungültig aus: „${c.v.phone}“.`, c.key);
      const pc = c.src && S.contacts && c.src.cells.get(S.contacts.hm.colOf.phone);
      if (pc && typeof pc.value === 'number') push('warn', 'Contacts', row, `Telefon als Zahl gespeichert (${pc.value}) – führende Null oder + ging evtl. verloren.`, c.key);
      for (const f of ['consentDate']) if (!isEmpty(c.v[f]) && !isDate(c.v[f])) push('error', 'Contacts', row, `Ungültiges Datum in „${FIELD_LABELS[f]}“: „${c.v[f]}“.`, c.key);
      for (const f of ['created', 'updated']) if (!isEmpty(c.v[f]) && !isDateTime(c.v[f]) && !isDate(c.v[f])) push('error', 'Contacts', row, `Ungültiges Datum in „${FIELD_LABELS[f]}“: „${c.v[f]}“.`, c.key);
      if (!isEmpty(c.v.dnc) && !isFlagYes(c.v.dnc)) push('warn', 'Contacts', row, `„Nicht kontaktieren“ hat den unbekannten Wert „${c.v.dnc}“ (erwartet: ja oder leer).`, c.key);
      for (const f of ['notes', 'company', 'firstName', 'lastName']) if (typeof c.v[f] === 'string' && c.v[f].length > SAFE_CELL_TEXT) push('error', 'Contacts', row, `${FIELD_LABELS[f]} ist länger als ${SAFE_CELL_TEXT} Zeichen (Excel-Grenze ${MAX_CELL_TEXT}).`, c.key);
    }
    const founders = new Set((state.settings.founders || []).map(f => f.name));
    const actIds = new Set();
    for (const a of state.activities) {
      const row = a.src ? a.src.row : null;
      if (a.ghost) { push('error', 'Activities', row, 'Zeile ohne Activity ID – bleibt erhalten, ist im Tool aber nicht sichtbar.', a.key); continue; }
      if (a.dup) { push('error', 'Activities', row, `Doppelte Activity ID „${a.v.id}“.`, a.key); continue; }
      actIds.add(a.v.id);
      if (isEmpty(a.v.contactId)) { if (a.v.type !== TODO_TYPE) push('error', 'Activities', row, 'Aktivität ohne Contact ID.', a.key); }
      else if (!contactIds.has(a.v.contactId)) push('error', 'Activities', row, `Verwaiste Aktivität: Contact ID „${a.v.contactId}“ gibt es nicht.`, a.key);
      if (!isDateTime(a.v.at) && !isDate(a.v.at)) push('error', 'Activities', row, `Ungültiges Datum/Zeit: „${a.v.at}“.`, a.key);
      if (!isEmpty(a.v.fuDate) && !isDate(a.v.fuDate)) push('error', 'Activities', row, `Ungültiges Follow-up-Datum: „${a.v.fuDate}“.`, a.key);
      if (!isEmpty(a.v.fuTime) && !isTime(a.v.fuTime)) push('error', 'Activities', row, `Ungültige Follow-up-Uhrzeit: „${a.v.fuTime}“.`, a.key);
      if (!isEmpty(a.v.fuTime) && isEmpty(a.v.fuDate)) push('warn', 'Activities', row, 'Follow-up-Uhrzeit ohne Datum.', a.key);
      if (!isEmpty(a.v.fuDate) && !isEmpty(a.v.assignedTo) && !founders.has(a.v.assignedTo)) push('warn', 'Activities', row, `Zuständig „${a.v.assignedTo}“ ist kein Gründer aus den Einstellungen.`, a.key);
      for (const f of ['tempBefore', 'tempAfter']) if (!validTemp(a.v[f])) push('error', 'Activities', row, `Ungültige ${FIELD_LABELS[f]}: „${a.v[f]}“.`, a.key);
      for (const f of ['summary', 'nextStep']) if (typeof a.v[f] === 'string' && a.v[f].length > SAFE_CELL_TEXT) push('error', 'Activities', row, `${FIELD_LABELS[f]} ist länger als ${SAFE_CELL_TEXT} Zeichen.`, a.key);
    }
    for (const [name, sh] of [['Contacts', S.contacts], ['Activities', S.activities]]) {
      if (!sh) continue;
      if (sh.hm.unknown.length) push('info', name, 1, `Zusatzspalten (werden unverändert mitgeführt): ${sh.hm.unknown.map(u => u.name).join(', ')}.`);
      if (sh.records.some(r => r.src && r.src.hasFormula)) push('warn', name, null, 'Formeln im Datenblatt: werden erhalten, Zeilenbezüge aber nicht angepasst, wenn Zeilen beim Löschen nachrücken. Formeln besser in ein eigenes Blatt.');
      const f = sh.parsed.features;
      if (f.merges) push('warn', name, null, 'Verbundene Zellen im Datenblatt – sie werden beim Nachrücken von Zeilen nicht mitverschoben.');
      if (f.hyperlinks) push('warn', name, null, 'Hyperlinks im Datenblatt – sie bleiben an ihrer Zelladresse und können nach Löschungen auf die falsche Zeile zeigen.');
      if (f.legacyDrawing) push('warn', name, null, 'Kommentare im Datenblatt – sie bleiben an ihrer Zelladresse und können nach Löschungen verrutschen.');
      if (sh.droppedEmpty > 0) push('info', name, null, `${sh.droppedEmpty} leere, nur formatierte Zeile(n) werden beim nächsten Speichern entfernt.`);
    }
    const st = state.settings;
    const bands = (st.bands || []).slice().sort((a, b) => a.min - b.min);
    let expect = 0;
    for (const b of bands) {
      if (!Number.isFinite(b.min) || !Number.isFinite(b.max) || b.min > b.max) { push('error', 'Settings', null, `Temperaturbereich „${b.name}“ hat ungültige Grenzen.`); continue; }
      if (b.min !== expect) push('warn', 'Settings', null, `Temperaturbereiche: Lücke oder Überlappung vor „${b.name}“ (beginnt bei ${b.min}, erwartet ${expect}).`);
      expect = b.max + 1;
    }
    if (bands.length && expect !== 101) push('warn', 'Settings', null, 'Temperaturbereiche decken 0–100 nicht vollständig ab.');
    for (const k of ['categories', 'activityTypes', 'outcomes', 'consentOptions']) {
      const l = st[k] || []; const d = l.filter((x, i) => l.indexOf(x) !== i);
      if (d.length) push('warn', 'Settings', null, `Doppelte Einträge in ${FIELD_LABELS[k]}: ${[...new Set(d)].join(', ')}.`);
    }
    for (const f of st.founders || []) if (f.email && !validEmail(f.email)) push('warn', 'Settings', null, `E-Mail von ${f.name} sieht ungültig aus.`);
    return issues;
  }

  /* ---------------------------------------------------------------------------
   * 10. Kalender
   * ------------------------------------------------------------------------- */
  function displayName(v) {
    if (!v) return '';
    const n = [v.firstName, v.lastName].filter(x => !isEmpty(x)).join(' ').trim();
    return n || (v.company || '').trim() || '(ohne Namen)';
  }
  function bandFor(temp, bands) {
    if (typeof temp !== 'number' || !Number.isFinite(temp)) return null;
    return (bands || []).find(b => temp >= b.min && temp <= b.max) || null;
  }

  /** Titel + Beschreibung eines Follow-up-Termins (minimal, Felder per Einstellung zuschaltbar). */
  function eventText(contact, act, settings) {
    const rawTitle = (settings.kv || {})['Calendar name in title'];
    const nameInTitle = rawTitle === undefined || String(rawTitle).trim() === '' || settingBool(settings, 'Calendar name in title');
    const who = displayName(contact);
    const company = (contact.company || '').trim();
    let title;
    if (nameInTitle) title = 'Follow-up: ' + who + (company && company !== who ? ` (${company})` : '');
    else title = 'Follow-up: ' + (contact.id || 'Kontakt');
    const lines = [];
    if (!isEmpty(act.nextStep)) lines.push(String(act.nextStep));
    if (settingBool(settings, 'Calendar include phone') && !isEmpty(contact.phone)) lines.push('Tel.: ' + contact.phone);
    if (settingBool(settings, 'Calendar include email') && !isEmpty(contact.email)) lines.push('E-Mail: ' + contact.email);
    if (settingBool(settings, 'Calendar include notes') && !isEmpty(contact.notes)) lines.push('Notizen: ' + contact.notes);
    if (act.assignedTo) lines.push('Zuständig: ' + act.assignedTo);
    lines.push('(aus dem CRM, Kontakt-ID ' + (contact.id || '') + ')');
    return { title, details: lines.join('\n') };
  }
  function utcStamp(ms) { const d = new Date(ms); return `${d.getUTCFullYear()}${pad2(d.getUTCMonth() + 1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`; }
  function ymdCompact(ymd) { return ymd.replace(/-/g, ''); }
  /** Start/Ende eines Follow-ups: ganztägig ohne Uhrzeit, sonst Dauer in Minuten. */
  function eventTimes(fuDate, fuTime, durationMin) {
    if (!isDate(fuDate)) throw new Error('Follow-up-Datum fehlt oder ist ungültig.');
    if (!isTime(fuTime)) return { allDay: true, start: fuDate, end: addDays(fuDate, 1) };
    const p = splitDT(fuDate), t = splitTime(fuTime);
    const startMs = berlinToUtcMs({ y: p.y, m: p.m, d: p.d, hh: t.hh, mi: t.mi, ss: 0 });
    return { allDay: false, startMs, endMs: startMs + Math.max(5, durationMin || 15) * 60000 };
  }
  const GCAL_MAX_DETAILS = 1000;   // konservativ: sehr lange Links liefern bei Google Fehler 414
  const GCAL_MAX_URL = 2000;
  function googleCalendarUrl({ title, details, fuDate, fuTime, durationMin, guests }) {
    const t = eventTimes(fuDate, fuTime, durationMin);
    const dates = t.allDay ? `${ymdCompact(t.start)}/${ymdCompact(t.end)}` : `${utcStamp(t.startMs)}/${utcStamp(t.endMs)}`;
    let d = details || '', truncated = false;
    const build = det => {
      const q = [['action', 'TEMPLATE'], ['text', title], ['dates', dates], ['ctz', TZ], ['details', det]];
      if (guests && guests.length) q.push(['add', guests.join(',')]);
      return 'https://calendar.google.com/calendar/render?' + q.map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
    };
    if (d.length > GCAL_MAX_DETAILS) { d = d.slice(0, GCAL_MAX_DETAILS) + ' … (gekürzt, vollständig im CRM)'; truncated = true; }
    let url = build(d);
    while (url.length > GCAL_MAX_URL && d.length > 40) { d = d.slice(0, Math.floor(d.length * 0.8)) + ' … (gekürzt)'; truncated = true; url = build(d); }
    return { url, truncated };
  }
  function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  /** Zeilen nach RFC 5545 bei 75 Oktetts falten (UTF-8-sicher). */
  function icsFold(line) {
    const enc = utf8enc; if (enc.encode(line).length <= 75) return line;
    const out = []; let cur = '', curLen = 0, limit = 75;
    for (const ch of line) {
      const l = enc.encode(ch).length;
      if (curLen + l > limit) { out.push(cur); cur = ' ' + ch; curLen = 1 + l; limit = 75; }
      else { cur += ch; curLen += l; }
    }
    out.push(cur); return out.join('\r\n');
  }
  function buildIcs({ uid, title, details, fuDate, fuTime, durationMin, reminderMin, now }) {
    const t = eventTimes(fuDate, fuTime, durationMin);
    const stamp = utcStamp(now || Date.now());
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//N3 Digital//CRM//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
      'UID:' + uid, 'DTSTAMP:' + stamp, 'SEQUENCE:' + Math.floor((now || Date.now()) / 1000)];
    if (t.allDay) { L.push('DTSTART;VALUE=DATE:' + ymdCompact(t.start), 'DTEND;VALUE=DATE:' + ymdCompact(t.end)); }
    else { L.push('DTSTART:' + utcStamp(t.startMs), 'DTEND:' + utcStamp(t.endMs)); }
    L.push('SUMMARY:' + icsEscape(title), 'DESCRIPTION:' + icsEscape(details || ''), 'TRANSP:OPAQUE', 'STATUS:CONFIRMED');
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(title));
    if (t.allDay) L.push('TRIGGER;RELATED=START:PT8H');           // 08:00 Uhr am Tag selbst
    else L.push('TRIGGER:-PT' + Math.max(0, reminderMin ?? 30) + 'M');
    L.push('END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
    return L.map(icsFold).join('\r\n') + '\r\n';
  }

  /* ---------------------------------------------------------------------------
   * 11. Backups & Ordnerinhalt
   * ------------------------------------------------------------------------- */
  function fileStem(name) { return name.replace(/\.xlsx$/i, ''); }
  function backupFileName(dataFileName, date, founder) {
    const p = berlinParts(date || new Date());
    const who = String(founder || 'unbekannt').replace(/[^\p{L}\p{N}_-]+/gu, '');
    return `${fileStem(dataFileName)}_${p.y}-${pad2(p.m)}-${pad2(p.d)}_${pad2(p.hh)}-${pad2(p.mi)}-${pad2(p.ss)}_${who}.xlsx`;
  }
  function parseBackupName(name, dataFileName) {
    const stem = fileStem(dataFileName).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const m = new RegExp(`^${stem}_(\\d{4}-\\d{2}-\\d{2})_(\\d{2})-(\\d{2})-(\\d{2})_([^.]*)(?:\\.(\\d+))?\\.xlsx$`, 'i').exec(name);
    if (!m) return null;
    return { name, stamp: `${m[1]}T${m[2]}:${m[3]}:${m[4]}`, day: m[1], who: m[5] };
  }
  /**
   * Welche Backups löschen? Behalten werden:
   *  - die `keep` neuesten,
   *  - pro Kalendertag der letzten `days` Tage das neueste,
   *  dann, falls über `maxBytes`: die ältesten der behaltenen (die 3 neuesten nie).
   */
  function selectBackupsToDelete(list, { keep = 30, days = 14, maxBytes = 500 * 1024 * 1024, today } = {}) {
    const items = list.slice().sort((a, b) => b.stamp.localeCompare(a.stamp));
    const kept = new Set();
    items.slice(0, keep).forEach(b => kept.add(b.name));
    const cutoff = addDays(today || items[0]?.day || todayBerlin(), -(days - 1));
    const seenDay = new Set();
    for (const b of items) if (b.day >= cutoff && !seenDay.has(b.day)) { seenDay.add(b.day); kept.add(b.name); }
    let total = items.filter(b => kept.has(b.name)).reduce((s, b) => s + (b.size || 0), 0);
    const keptOrdered = items.filter(b => kept.has(b.name));
    for (let i = keptOrdered.length - 1; i >= 3 && total > maxBytes; i--) { kept.delete(keptOrdered[i].name); total -= keptOrdered[i].size || 0; }
    return items.filter(b => !kept.has(b.name)).map(b => b.name);
  }
  /** Ordnerinhalt einordnen: Hauptdatei, Excel-/LibreOffice-Sperrdateien, mögliche Konfliktkopien. */
  function classifyFolder(names, dataFileName) {
    const lower = dataFileName.toLowerCase(), stem = fileStem(lower);
    const res = { hasData: false, lockFiles: [], conflictCopies: [], swapFiles: [], otherXlsx: [] };
    for (const n of names) {
      const l = n.toLowerCase();
      if (l === lower) { res.hasData = true; continue; }
      if (l.endsWith('.crswap')) { res.swapFiles.push(n); continue; }
      if (l.startsWith('~$') && l.length >= 8 && lower.endsWith(l.slice(2))) { res.lockFiles.push(n); continue; }
      if (l === '.~lock.' + lower + '#') { res.lockFiles.push(n); continue; }
      if (l.startsWith('~$') || l.startsWith('.~lock')) continue;
      if (/\.xlsx$/.test(l) && l.includes(stem)) { res.conflictCopies.push(n); continue; }
      if (/\.xlsx$/.test(l)) res.otherXlsx.push(n);
    }
    return res;
  }

  }

  /** 'f' | 'm' | null (unbekannt oder mehrdeutig – dann wird nicht geraten). */
  function genderOf(firstName) {
    const n = String(firstName || '').trim().split(/[\s-]+/)[0].toLowerCase();

    return g === 'f' || g === 'm' ? g : null;

  /** Anredezeile: "Hallo Frau Müller," / "Hallo Herr Müller," / neutral "Guten Tag ...,". */
  function salutation(firstName, lastName) {
    const ln = String(lastName || '').trim(), fn = String(firstName || '').trim();
    const g = genderOf(fn);
    if (ln && g) return `Hallo ${g === 'f' ? 'Frau' : 'Herr'} ${ln},`;
    if (ln && fn) return `Guten Tag ${fn} ${ln},`;
    return 'Guten Tag,';

  function mailTemplates(settings) {
    const kv = (settings && settings.kv) || {}; const out = [];
    for (let i = 1; i <= 5; i++) {
      const name = String(kv['Website category ' + i] || '').trim();
      if (name) out.push({ index: i, name, subject: String(kv['Mail ' + i + ' subject'] || ''), body: String(kv['Mail ' + i + ' body'] || '') });
    }
    return out;
  }
  /**
   * Vorlage füllen: nur Anrede und Name werden automatisch eingesetzt.
   * Die erste Zeile "Hallo {Vorname}," wird durch die Anrede ersetzt; {Vorname}/{Nachname} werden gefüllt, wenn bekannt.
   */
  function fillTemplate(tpl, contact) {
    const fn = String(contact.firstName || '').trim(), ln = String(contact.lastName || '').trim();
    const fillNames = t => t.replace(/\{Vorname\}/g, m => fn || m).replace(/\{Nachname\}/g, m => ln || m);
    let body = String(tpl.body || '').replace(/\r\n?/g, '\n');
    body = body.replace(/^\s*(Hallo|Guten Tag|Liebe[r]?)\s+\{Vorname\}[^\n,]*,?/, salutation(fn, ln));
    return { subject: fillNames(String(tpl.subject || '')), body: fillNames(body) };
  }
  /** Noch offene Platzhalter {…} (auch verschachtelte wie {Ergebnis … {Wettbewerber}.}). */
  function openPlaceholders(text) {
    const out = []; let depth = 0, start = -1;
    for (let i = 0; i < text.length; i++) {
      if (text[i] === '{') { if (depth === 0) start = i; depth++; }
      else if (text[i] === '}' && depth > 0) { depth--; if (depth === 0) out.push(text.slice(start, i + 1)); }
    }
    return out;
  }
