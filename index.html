  const st = S();
  const lst = (k, label, hint) => `<label class="f"><span>${label}</span><textarea class="in" rows="6" data-list="${k}">${esc(st[k].join('\n'))}</textarea><span class="hint">${hint || 'Ein Eintrag pro Zeile.'}</span></label>`;
  const kv = (k, label, type, hint) => `<label class="f"><span>${label}</span><input class="in" data-kv="${esc(k)}" type="${type || 'text'}" value="${esc(st.kv[k] ?? '')}">${hint ? `<span class="hint">${hint}</span>` : ''}</label>`;
  const yes = (k, label) => `<label class="check"><input type="checkbox" data-kvb="${esc(k)}"${C.settingBool(st, k) || (k === 'Calendar name in title' && String(st.kv[k] ?? '').trim() === '') ? ' checked' : ''}> ${label}</label>`;
  const theme = LS.get('theme', 'auto');
  el.innerHTML = `<div class="view-head"><div><h1>Einstellungen</h1><p>Listen, Gründer und Schwellenwerte gelten für alle drei und werden im Blatt „Settings“ gespeichert. Name, Darstellung und Ordner gelten nur für diesen Browser.</p></div></div>
  <div class="settings">
    <section class="panel"><h2>Nur in diesem Browser</h2><div class="body">
      <div class="grid3">
        <label class="f"><span>Ich bin</span><select class="in" id="me">${st.founders.map(f => `<option${f.name === App.identity ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>
        <label class="f"><span>Darstellung</span><select class="in" id="theme"><option value="auto"${theme === 'auto' ? ' selected' : ''}>Wie das System</option><option value="light"${theme === 'light' ? ' selected' : ''}>Hell</option><option value="dark"${theme === 'dark' ? ' selected' : ''}>Dunkel</option></select></label>
        <div class="f"><span>Browser-Hinweise bei fälligen Follow-ups</span><button class="btn" id="notif" type="button">${typeof Notification !== 'undefined' && Notification.permission === 'granted' ? 'Aktiv' : 'Aktivieren'}</button><span class="hint">Nur solange das Tool geöffnet ist.</span></div>
      </div>
      <div class="grid2">
        <div class="f"><span>CRM-Ordner</span><div>${esc(App.dir ? App.dir.name : '–')} <button class="btn sm" id="chcrm" type="button">Ändern</button></div></div>
        <div class="f"><span>Backup-Ordner</span><div>${esc(App.backupDir ? App.backupDir.name : '–')} <button class="btn sm" id="chbak" type="button">Ändern</button></div></div>
      </div>
    </div></section>
    <section class="panel" id="catpanel"><h2>Kontakt-Kategorien</h2><div class="body">
      <div class="chips" data-catchips>${st.categories.map(c => `<span class="chip cat"><span>${esc(c)}</span><small>${categoryUsage(c)}</small><button type="button" class="x" data-catdel="${esc(c)}" aria-label="${esc(c)} entfernen" title="Entfernen">×</button></span>`).join('') || '<span class="muted">Noch keine Kategorien.</span>'}</div>
      <div class="addrow" style="max-width:520px"><input class="in" id="catnew" placeholder="Neue Kategorie, z. B. Steuerberater" maxlength="60" autocomplete="off" aria-label="Neue Kategorie"><button type="button" class="btn ok" id="catadd">Hinzufügen</button></div>
      <span class="hint" id="cathint">Wird sofort gespeichert und gilt für alle drei. Die Zahl zeigt, wie viele Kontakte die Kategorie haben. Entfernen ändert keine Kontakte – sie behalten ihren Wert.</span>
    </div></section>
    <section class="panel"><h2>Auswahllisten</h2><div class="body"><div class="grid2">
      ${lst('activityTypes', 'Aktivitätsarten', 'Ein Eintrag pro Zeile. „Notiz“ zählt nicht als Kontakt. „Phasenwechsel“ und „To-do“ legt das Tool selbst an.')}
      ${lst('outcomes', 'Ergebnisse')}
    </div></div></section>
    <section class="panel"><h2>Gründer</h2><div class="body"><div class="rows" id="frows">${st.founders.map(f => `<div class="r" style="grid-template-columns:180px 1fr"><input class="in" data-fn value="${esc(f.name)}" aria-label="Name"><input class="in" data-fe type="email" value="${esc(f.email)}" placeholder="E-Mail für Kalender-Einladungen" aria-label="E-Mail"></div>`).join('')}</div>
      <span class="hint">Die E-Mail wird als Gast in Kalendereinladungen eingetragen, wenn ein Follow-up einer anderen Person zugewiesen ist. Namen besser nicht ändern – sie stehen in allen Einträgen.</span></div></section>
    <section class="panel"><h2>Kalender</h2><div class="body">
      <div class="grid3">${kv('Default follow-up minutes', 'Termindauer (Minuten)', 'number')}${kv('Reminder minutes before', 'Erinnerung in .ics-Dateien (Minuten vorher)', 'number')}</div>
      <div style="display:grid;gap:6px">${yes('Calendar name in title', 'Name und Firma im Termintitel')}${yes('Calendar include phone', 'Telefonnummer in die Terminbeschreibung')}${yes('Calendar include email', 'E-Mail-Adresse in die Terminbeschreibung')}${yes('Calendar include notes', 'Notizen in die Terminbeschreibung')}</div>
      <div class="alert info">Alles, was in einen Kalendertermin geht, verlässt das CRM und liegt dann bei Google (bzw. dem Kalenderanbieter). Bei kostenlosen Gmail-Konten gibt es keinen Auftragsverarbeitungsvertrag. Empfehlung: so wenig wie möglich – Standard ist Name, Firma und nächster Schritt.</div>
    </div></section>
    <section class="panel"><h2>Dein Absender in Mails</h2><div class="body">
      <p class="hint">Name, Telefonnummer und Signatur für {{salesRepName}}, {{senderPhone}} und {{signature}} in allen Vorlagen. Jede Person stellt ihren eigenen ein – aktuell: <b>${esc(st.kv['Absender: ' + App.identity] || 'noch nicht eingerichtet')}</b>.</p>
      <div><button class="btn" id="senderbtn" type="button">Absender bearbeiten</button> <button class="btn ghost" id="tplbtn" type="button">Zu Vorlagen &amp; Leitfäden</button></div></div></section>
    <section class="panel"><h2>Prioritätsregeln („Nächste beste Aktionen“ auf Heute)</h2><div class="body">
      <p class="hint">Punkte je Signal. Leer = Standard, 0 schaltet ein Signal ab. Gilt für alle drei. Die Gründe stehen auf jeder Zeile unter „Heute“ und auf der Kontaktseite.</p>
      <div class="grid3">${SL.WEIGHTS.map(w => `<label class="f"><span>${esc(w.label)}</span><input class="in" data-kv="${esc('Prio: ' + w.key)}" type="number" min="0" max="200" step="1" value="${esc(st.kv['Prio: ' + w.key] ?? '')}" placeholder="${w.pts}"></label>`).join('')}</div></div></section>
    <section class="panel"><h2>Website-Kategorien und Mail-Vorlagen</h2><div class="body">
      <p class="hint">Diese fünf Vorlagen erscheinen auch unter <b>Vorlagen &amp; Leitfäden</b> als „Website-Fall 1–5“ und können dort bearbeitet werden.</p>
      <p class="hint">Eine Kategorie pro Vorlage. Automatisch eingesetzt werden nur Anrede (erste Zeile „Hallo {Vorname},“) sowie {Vorname} und {Nachname}. Alle anderen {Platzhalter} füllst du beim Schreiben selbst aus.</p>
      ${[1, 2, 3, 4, 5].map(i => `<div class="tpl"><div class="grid2">${kv('Website category ' + i, 'Kategorie ' + i)}${kv('Mail ' + i + ' subject', 'Betreff')}</div>
        <label class="f"><span>Text</span><textarea class="in" rows="7" data-kv="${esc('Mail ' + i + ' body')}">${esc(st.kv['Mail ' + i + ' body'] ?? '')}</textarea></label></div>`).join('')}
    </div></section>
    <section class="panel"><h2>Schwellenwerte</h2><div class="body"><div class="grid3">
      ${kv('Going cold days', '„Wird kalt“ nach Tagen ohne Kontakt', 'number')}${kv('Process stalled days', 'Process Management: „Stillstand“ nach Tagen ohne Interaktion', 'number')}${kv('Poll seconds', 'Auf Änderungen prüfen alle … Sekunden', 'number')}
      ${kv('Backups to keep', 'Backups: Anzahl behalten', 'number')}${kv('Backup days to keep', 'Backups: je Tag behalten (Tage)', 'number')}${kv('Backup max MB', 'Backups: höchstens MB', 'number')}
    </div></div></section>
    <div style="display:flex;gap:8px"><button class="btn ok" id="saveset" type="button">Einstellungen speichern</button><span class="hint" id="sethint"></span></div>
  </div>`;
  $('#me').onchange = e => { App.identity = e.target.value; LS.set('identity', App.identity); try { sessionStorage.removeItem('crm.as'); } catch (_) { /* egal */ } renderAll(); toast('Du bist jetzt ' + App.identity + '.'); };
  $('#theme').onchange = e => { LS.set('theme', e.target.value); applyTheme(); };
  $('#notif').onclick = async () => { if (typeof Notification === 'undefined') return toast('Dieser Browser unterstützt keine Benachrichtigungen.', { error: true }); const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Browser-Hinweise aktiv (solange das Tool offen ist).' : 'Der Browser hat Benachrichtigungen abgelehnt. In-App-Hinweise funktionieren trotzdem.'); renderSettings(el); };
  const catAdd = () => {
    const r = addCategory($('#catnew').value);
    if (r.error) { $('#cathint').className = 'hint err'; $('#cathint').textContent = r.error; $('#catnew').focus(); return; }
    toast(r.existed ? `„${r.name}“ gibt es schon.` : `Kategorie „${r.name}“ gespeichert.`);
    const n = $('#catnew'); if (n) n.focus();
  };
  $('#catadd').onclick = catAdd;
  $('#catnew').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); catAdd(); } });
  $$('[data-catdel]', el).forEach(b => b.onclick = async () => {
    const name = b.dataset.catdel, n = categoryUsage(name);
    if (n && !(await confirmDialog({ title: `„${name}“ entfernen?`, body: `${plural(n, 'Kontakt hat', 'Kontakte haben')} diese Kategorie. ${n === 1 ? 'Er behält' : 'Sie behalten'} sie, aber sie ist danach nicht mehr auswählbar.`, ok: 'Entfernen', danger: true }))) return;
    removeCategory(name); toast(`Kategorie „${name}“ entfernt.`);
  });
  $('#chcrm').onclick = () => changeCrmFolder();
  $('#senderbtn').onclick = () => senderDialog();
  $('#tplbtn').onclick = () => go('templates');
  $('#chbak').onclick = async () => { try { const d = await pickFolder('crm-backup'); if (await validateBackupFolder(d)) { App.backupDir = d; await IDB.set('backupDir', d); toast('Backup-Ordner geändert.'); renderSettings(el); } } catch (e) { if (!(e instanceof UserCancelled)) toast(explainFsError(e).text, { error: true }); } };
  $('#saveset').onclick = () => {
    const next = JSON.parse(JSON.stringify(App.work.settings));
    const lines = t => [...new Set(t.split('\n').map(x => x.trim()).filter(Boolean))];
    for (const t of $$('[data-list]', el)) next[t.dataset.list] = lines(t.value);
    const fr = $$('#frows .r', el).map(r => ({ name: $('[data-fn]', r).value.trim(), email: $('[data-fe]', r).value.trim() })).filter(f => f.name);
    const badMail = fr.find(f => f.email && !C.validEmail(f.email));
    if (badMail) { $('#sethint').className = 'hint err'; $('#sethint').textContent = `E-Mail von ${badMail.name} sieht ungültig aus.`; return; }
    next.founders = fr;
    const effK = S();
    for (const i of $$('[data-kv]', el)) { const k = i.dataset.kv; if (!(k in next.kv) && i.value.trim() === '') continue; if (!next.kvOrder.includes(k)) next.kvOrder.push(k); next.kv[k] = i.value.trim(); }
    for (const i of $$('[data-kvb]', el)) { const k = i.dataset.kvb; if (!next.kvOrder.includes(k)) next.kvOrder.push(k); next.kv[k] = i.checked ? 'ja' : 'nein'; }
    for (const k of Object.keys(next.kv)) if (next.kv[k] === undefined) next.kv[k] = effK.kv[k];
    if (JSON.stringify(C.settingsFields(next)) === JSON.stringify(C.settingsFields(App.work.settings))) { toast('Keine Änderungen.'); return; }
    setSettings(next);
    startPolling();
    toast('Einstellungen übernommen.');
  };
}

/* Hilfe */
function renderHelp(el) {
  el.innerHTML = `<div class="help"><div class="view-head"><div><h1>Hilfe</h1><p>Das Wichtigste aus der Anleitung (Anleitung.pdf im CRM-Ordner).</p></div></div>
  <h2>Neu: Anrufen, Mailen, Priorisieren</h2>
  <ul>
    <li><b>Heute › Nächste beste Aktionen</b>: Wer braucht jetzt Aufmerksamkeit – und warum. Jede Zeile nennt den Grund (z. B. „Angebot seit 6 Tagen ohne Kontakt“). Die Zahl links sind Punkte aus festen Regeln (Einstellungen › Prioritätsregeln). „Anrufliste starten“ arbeitet die Kontakte nacheinander im Anruf-Modus ab.</li>
    <li><b>Anruf-Modus</b> (<kbd>A</kbd> auf einer Kontaktseite): links das Briefing (warum anrufen, was war zuletzt, was ist offen, woher stammt der Kontakt), in der Mitte der passende Leitfaden mit Einstieg, Fragen, Nutzen und Abschluss, rechts Notizen, Einwände, Ergebnis (<kbd>1</kbd>–<kbd>9</kbd>), Follow-up und To-dos. Die Zusammenfassung entsteht aus deinen Eingaben – nichts wird dazuerfunden. <kbd>⌘</kbd>/<kbd>Strg</kbd>+<kbd>Enter</kbd> speichert. Danach: Follow-up-Mail mit einem Klick vorbereiten.</li>
    <li><b>E-Mail schreiben</b> (<kbd>M</kbd>): Vorlage wählen (oben stehen die passenden für die aktuelle Phase), Ton Sie/Du umschalten, anpassen, im Mailprogramm öffnen. Fehlende Angaben sind gelb markiert und sperren den Versand, bis sie gefüllt sind. Gesendet wird nie automatisch.</li>
    <li><b>Vorlagen &amp; Leitfäden</b> (<kbd>V</kbd>): alle Mail-Vorlagen (Deutsch/Englisch, Favoriten, zuletzt verwendet), eigene anlegen, eingebaute anpassen oder ausblenden; Telefonleitfäden; Einwände mit Auswertung, welche am häufigsten kommen; Nutzen-Sätze je Zielgruppe; dein Absender.</li>
    <li><b>Befehlspalette</b> (<kbd>⌘</kbd>/<kbd>Strg</kbd>+<kbd>K</kbd>): Kontakte, To-dos, Verlauf, Vorlagen und Aktionen durchsuchen. Tippen + Enter auf „Neues To-do“ legt sofort ein To-do an.</li>
    <li><b>Kontaktseite</b>: „Nächste beste Aktion“, „Beziehungsstatus“ (erklärbare Signale statt Bauchgefühl) und Filter für den Verlauf.</li>
  </ul>
  <h2>So arbeitet das Tool</h2>
  <p>Alle drei arbeiten mit derselben Datei <b>crm-data.xlsx</b> im synchronisierten CRM-Ordner. Das Tool speichert nach jeder abgeschlossenen Aktion. Vorher liest es die Datei neu ein und übernimmt Änderungen der anderen. Nur wenn zwei Personen <i>dasselbe Feld</i> unterschiedlich geändert haben, fragt es nach.</p>
  <p>Änderungen der anderen kommen über OneDrive bzw. Google Drive an – mit Verzögerung (Sekunden bis Minuten). Das Tool prüft alle ${pollSeconds()} Sekunden.</p>
  <h2>Tagesablauf</h2>
  <ol><li>„Heute“ öffnen: überfällige und heute fällige Follow-ups.</li><li>Anrufen, dann sofort <kbd>L</kbd>: Art, Ergebnis, ein Satz, nächstes Follow-up. <kbd>Enter</kbd> speichert.</li><li>Follow-up für jemand anderen? Nach dem Speichern „Google Kalender öffnen“ und dort auf „Speichern“ und „Senden“ klicken.</li></ol>
  <h2>E-Mails in den Verlauf übernehmen</h2>
  <p>Eine Mail als <b>.eml-Datei</b> ins CRM-Fenster ziehen (oder „Mail übernehmen“ auf der Kontaktseite). Das CRM erkennt Absender, Empfänger, Datum, Betreff und Text, schlägt den passenden Kontakt vor – oder legt einen neuen an. Aus <b>Apple Mail</b>: Mail erst auf den Schreibtisch ziehen (dabei entsteht die .eml-Datei), dann diese Datei ins CRM. Dieselbe Mail wird nicht doppelt übernommen.</p>
  <h2>Process Management</h2>
  <p>Jeder Kontakt ab der Phase <b>„Replied / Engaged“</b> erscheint automatisch dort – egal, wo die Phase geändert wurde (Kontaktseite, Kontaktformular, Aktivität loggen, Pipeline). Zurück auf „Cold“ oder „Contact Made“ nimmt ihn aus den aktiven Ansichten; Daten und Verlauf bleiben. „Closed Lost“ landet im Archiv.</p>
  <ul><li><b>Übersicht</b>: Kennzahlen aus euren echten Daten, Klick auf eine Kachel filtert.</li><li><b>Pipeline</b>: Karten per Drag &amp; Drop in eine andere Phase ziehen.</li><li><b>Aufgaben</b>: dieselben To-dos wie unter „Heute“, mit Status und Fälligkeit.</li><li><b>Prozessseite</b>: Felder zur aktuellen Phase, alle Prozessdaten, kompletter Verlauf.</li></ul>
  <p>Automatisch (je Kontakt nur einmal): „Discovery Call vorbereiten“, „Angebot vorbereiten“, „Angebot nachfassen“. Bei „Closed Won“ kann ein Projekt mit Onboarding-Aufgaben angelegt werden – auch das nur einmal.</p>
  <h2>Nie tun</h2>
  <ul><li>Die Excel-Datei direkt öffnen und speichern, während jemand das Tool benutzt.</li><li>Blattnamen, Spaltenüberschriften oder IDs ändern.</li><li>Zeilen in Excel löschen (Kontakte im Tool löschen).</li><li>Die Datei umbenennen oder verschieben.</li></ul>
  <h2>Wenn etwas nicht stimmt</h2>
  <ul><li><b>„Zugriff erlauben“</b>: Chrome fragt nach jedem Neustart einmal nach dem Ordnerzugriff.</li><li><b>„Datei ist gesperrt“</b>: Excel schließen, dann „Erneut speichern“.</li><li><b>Konfliktkopie</b>: In „Konfliktkopien“ vergleichen und übernehmen, dann wegräumen.</li><li><b>Etwas ist weg</b>: „Backups“ öffnen und eine frühere Fassung wiederherstellen.</li></ul>
  <h2>Tastenkürzel</h2>
  <table class="plain" style="max-width:520px"><tbody>
  <tr><td><kbd>⌘</kbd>/<kbd>Strg</kbd>+<kbd>K</kbd></td><td>Befehlspalette: alles suchen, Aktionen ausführen</td></tr><tr><td><kbd>A</kbd></td><td>Anruf-Modus (Kontaktseite oder markierter Kontakt)</td></tr><tr><td><kbd>M</kbd></td><td>E-Mail mit Vorlage schreiben</td></tr><tr><td><kbd>V</kbd></td><td>Vorlagen &amp; Leitfäden</td></tr><tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>Im Anruf-Modus: Ergebnis wählen</td></tr><tr><td><kbd>/</kbd></td><td>Suchen</td></tr><tr><td><kbd>N</kbd></td><td>Neuer Kontakt</td></tr><tr><td><kbd>L</kbd></td><td>Aktivität loggen (geöffneter oder markierter Kontakt)</td></tr>
  <tr><td><kbd>E</kbd></td><td>Kontakt bearbeiten</td></tr><tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></td><td>In Listen bewegen und öffnen</td></tr>
  <tr><td><kbd>T</kbd> <kbd>K</kbd> <kbd>G</kbd></td><td>Heute, Kontakte, Wird kalt</td></tr><tr><td><kbd>1</kbd>–<kbd>7</kbd></td><td>Ergebnis wählen (im Log-Formular)</td></tr>
  <tr><td><kbd>Enter</kbd></td><td>Formular speichern (<kbd>Shift</kbd>+<kbd>Enter</kbd> = neue Zeile)</td></tr><tr><td><kbd>Esc</kbd></td><td>Schließen bzw. zurück</td></tr><tr><td><kbd>Strg</kbd>/<kbd>⌘</kbd>+<kbd>S</kbd></td><td>Sofort speichern</td></tr>
  </tbody></table></div>`;
}

/* ==========================================================================
 * Process Management
 * Alle Daten kommen aus denselben Datensätzen wie der Rest des CRM:
 *  - Phase                = Kontaktfeld „Stage“ (einzige Wahrheit, auch für das Board)
 *  - Prozessdaten         = zusätzliche Spalten im Blatt „Contacts“ (ein Prozess pro Kontakt, Prozess-ID = Kontakt-ID)
 *  - Aufgaben             = To-dos im Blatt „Activities“ (Status, Fälligkeit, Beschreibung, Automatik-Schlüssel)
 *  - Interaktionen/Verlauf= Activities (Anrufe, E-Mails, Phasenwechsel, Prozessänderungen)
 * Prozessstatus (aktiv, gewonnen, verloren, inaktiv) wird nur abgeleitet, nie gespeichert.
 * ========================================================================== */

const PM_STAGES = () => C.STAGES.slice(C.PM_FIRST);              // Board-Spalten: Replied / Engaged … Closed Lost
const PM_STATUS_LABEL = { active: 'Aktiv', won: 'Gewonnen', lost: 'Verloren', inactive: 'Inaktiv (zurück im Outreach)', none: '–' };
const PRIO_LABEL = { 1: 'Hoch', 2: 'Mittel', 3: 'Niedrig' };
const SYSTEM_ACT_TYPES = () => [C.TODO_TYPE, C.STAGE_CHANGE_TYPE, C.PROCESS_CHANGE_TYPE, C.TEMP_CHANGE_TYPE];

function stalledDays() { return C.settingNum(S(), 'Process stalled days', 7); }

/** Alles, was die Ansichten über einen Prozess wissen müssen – aus vorhandenen Daten berechnet. */
function pmInfo(c) {
  const v = c.v, today = C.todayBerlin();
  const acts = activitiesOf(v.id);                               // neueste zuerst
  const stage = C.stageOf(v), status = C.processStatus(v);
  const enter = acts.find(a => a.v.stageAfter === stage);
  const since = String((enter && enter.v.at) || v.procStart || v.created || '').slice(0, 10);
  const daysInStage = C.isDate(since) ? C.daysBetween(since, today) : null;
  const tasks = acts.filter(a => C.isOpenTodo(a)).sort(taskOrder);
  const nextTask = tasks[0] || null;
  const lastInt = String(v.lastContacted || '').slice(0, 10);
  const fu = String(v.nextFollowUp || '').slice(0, 10);
  const dues = [fu, ...tasks.map(t => t.v.todoDue)].filter(C.isDate).sort();
  const nextDue = dues[0] || '';
  const overdue = dues.some(d => d < today);
  // Stillstand: Tage seit der letzten Bewegung – letzte Interaktion ODER Eintritt in die aktuelle Phase, was jünger ist.
  const ref = [lastInt, since].filter(C.isDate).sort().pop() || '';
  const sinceInt = ref ? C.daysBetween(ref, today) : 0;
  const stalled = status === 'active' && sinceInt >= stalledDays();
  const needsFollowUp = status === 'active' && (stalled || (!tasks.length && !C.isDate(fu)));
  const value = typeof v.finalValue === 'number' && status === 'won' ? v.finalValue : (typeof v.dealValue === 'number' ? v.dealValue : (typeof v.proposalAmount === 'number' ? v.proposalAmount : null));
  return { c, v, stage, status, since, daysInStage, tasks, nextTask, lastInt, fu, nextDue, overdue, stalled, needsFollowUp, value, sinceInt };
}
function taskOrder(a, b) {
  return (C.todoPrio(a) - C.todoPrio(b)) || String(a.v.todoDue || '9999').localeCompare(String(b.v.todoDue || '9999')) || String(a.v.at).localeCompare(String(b.v.at));
}
function pmAll() { return visibleContacts().filter(c => C.inProcess(c.v)).map(pmInfo); }

/* ----- Filter, Suche, Sortierung (gemeinsam für Übersicht, Board, Archiv) ----- */
function pmFilters() {
  if (!App.ui.pm) App.ui.pm = { tab: LS.get('pmTab', 'overview'), q: '', stage: '', due: '', source: '', service: '', owner: '', prio: '', quick: '', sort: LS.get('pmSort', 'due'), mineTasks: false };
  return App.ui.pm;
}
const PM_QUICK = {
  active: { label: 'Aktive Prozesse', test: p => p.status === 'active' },
  drafts: { label: 'Entwürfe ohne Feedback', test: p => p.stage === 'Drafts Sent' && C.isEmpty(p.v.draftsFeedback) },
  calls: { label: 'Discovery Calls gebucht', test: p => p.stage === 'Discovery Call Booked' },
  proposals: { label: 'Angebote ohne Entscheidung', test: p => p.stage === 'Proposal Sent' },
  negotiation: { label: 'In Verhandlung', test: p => p.stage === 'Negotiation' },
  followup: { label: 'Brauchen ein Follow-up', test: p => p.needsFollowUp },
  overdue: { label: 'Überfällig', test: p => p.status === 'active' && p.overdue },
  won: { label: 'Closed Won', test: p => p.status === 'won' },
  lost: { label: 'Closed Lost', test: p => p.status === 'lost' },
};
function pmApply(list, f, opts) {
  const today = C.todayBerlin(), in7 = C.addDays(today, 7);
  const terms = f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return list.filter(p => {
    if (!(opts && opts.keepStage) && f.stage && p.stage !== f.stage) return false;
    if (f.quick && PM_QUICK[f.quick] && !PM_QUICK[f.quick].test(p)) return false;
    if (f.source && (p.v.source || '') !== f.source) return false;
    if (f.service && (p.v.service || '') !== (f.service === '__none' ? '' : f.service)) return false;
    if (f.owner && (p.v.owner || '') !== (f.owner === '__none' ? '' : f.owner)) return false;
    if (f.prio && (p.v.procPrio || 'Mittel') !== f.prio) return false;
    if (f.due === 'overdue' && !p.overdue) return false;
    if (f.due === 'today' && p.nextDue !== today) return false;
    if (f.due === 'week' && !(p.nextDue && p.nextDue <= in7)) return false;
    if (f.due === 'none' && p.nextDue) return false;
    if (terms.length) { const h = haystack(p.c) + ' ' + (p.v.service || '').toLowerCase(); if (!terms.every(t => h.includes(t))) return false; }
    return true;
  });
}
const PM_SORTS = {
  due: { label: 'Nächster Termin', fn: (a, b) => (a.nextDue || '9999').localeCompare(b.nextDue || '9999') },
  value: { label: 'Auftragswert', fn: (a, b) => (b.value ?? -1) - (a.value ?? -1) },
  age: { label: 'Tage in Phase', fn: (a, b) => (b.daysInStage ?? -1) - (a.daysInStage ?? -1) },
  action: { label: 'Nächste Aktion', fn: (a, b) => (a.nextTask ? C.todoPrio(a.nextTask) : 9) - (b.nextTask ? C.todoPrio(b.nextTask) : 9) || (a.nextTask ? a.nextTask.v.nextStep : '~').localeCompare(b.nextTask ? b.nextTask.v.nextStep : '~') },
  prio: { label: 'Priorität', fn: (a, b) => prioRank(a.v.procPrio) - prioRank(b.v.procPrio) },
  stage: { label: 'Phase', fn: (a, b) => C.stageIndex(a.v) - C.stageIndex(b.v) },
};
function prioRank(p) { return p === 'Hoch' ? 0 : p === 'Niedrig' ? 2 : 1; }
function pmSorted(list, f) { const s = PM_SORTS[f.sort] || PM_SORTS.due; return list.slice().sort((a, b) => s.fn(a, b) || C.displayName(a.v).localeCompare(C.displayName(b.v))); }

function pmToolbar(all, f, opts) {
  const opt = (val, label, cur) => `<option value="${esc(val)}"${val === cur ? ' selected' : ''}>${esc(label)}</option>`;
  const uniq = k => [...new Set(all.map(p => p.v[k]).filter(x => !C.isEmpty(x)).map(String))].sort((a, b) => a.localeCompare(b, 'de'));
  return `<div class="filters pm-filters" role="group" aria-label="Filter">
    <input class="in" type="search" data-pmf="q" value="${esc(f.q)}" placeholder="Prozesse durchsuchen …" aria-label="Prozesse durchsuchen">
    ${opts && opts.noStage ? '' : `<select class="in" data-pmf="stage" aria-label="Phase">${opt('', 'Alle Phasen', f.stage)}${PM_STAGES().map(x => opt(x, x, f.stage)).join('')}</select>`}
    <select class="in" data-pmf="due" aria-label="Follow-up">${opt('', 'Termine: alle', f.due)}${opt('overdue', 'Überfällig', f.due)}${opt('today', 'Heute fällig', f.due)}${opt('week', 'Nächste 7 Tage', f.due)}${opt('none', 'Ohne Termin', f.due)}</select>
    <select class="in" data-pmf="service" aria-label="Leistung">${opt('', 'Leistung: alle', f.service)}${C.SCHEMA.services.map(x => opt(x, x, f.service)).join('')}${opt('__none', 'Leistung: offen', f.service)}</select>
    <select class="in" data-pmf="source" aria-label="Quelle">${opt('', 'Quelle: alle', f.source)}${uniq('source').map(x => opt(x, x.length > 40 ? x.slice(0, 38) + '…' : x, f.source)).join('')}</select>
    <select class="in" data-pmf="owner" aria-label="Lead">${opt('', 'Lead: alle', f.owner)}${S().founders.map(x => opt(x.name, 'Lead: ' + x.name, f.owner)).join('')}${opt('__none', 'Lead: niemand', f.owner)}</select>
    <select class="in" data-pmf="prio" aria-label="Priorität">${opt('', 'Prio: alle', f.prio)}${C.SCHEMA.processPriorities.map(x => opt(x, 'Prio: ' + x, f.prio)).join('')}</select>
    ${opts && opts.noSort ? '' : `<select class="in" data-pmf="sort" aria-label="Sortierung">${Object.entries(PM_SORTS).map(([k, s]) => opt(k, 'Sortieren: ' + s.label, f.sort)).join('')}</select>`}
    ${f.quick ? `<button type="button" class="chip" data-pmquick="" aria-pressed="true" title="Schnellfilter entfernen">${esc(PM_QUICK[f.quick].label)} ×</button>` : ''}
    ${hasPmFilter(f) ? '<button type="button" class="btn sm ghost" data-pmreset>Filter zurücksetzen</button>' : ''}
  </div>`;
}
function hasPmFilter(f) { return !!(f.q || f.stage || f.due || f.source || f.service || f.owner || f.prio || f.quick); }
function bindPmToolbar(el) {
  const f = pmFilters();
  $$('[data-pmf]', el).forEach(x => {
    const ev = x.type === 'search' ? 'input' : 'change';
    x.addEventListener(ev, (x.type === 'search' ? debounce : (fn => fn))(() => {
      f[x.dataset.pmf] = x.value; if (x.dataset.pmf === 'sort') LS.set('pmSort', x.value);
      renderProcess(el, x.dataset.pmf === 'q');
    }, 150));
  });
  $$('[data-pmquick]', el).forEach(b => b.onclick = () => { f.quick = b.dataset.pmquick === f.quick ? '' : b.dataset.pmquick; if (f.tab !== 'overview' && f.tab !== 'board') f.tab = 'overview'; renderProcess(el); });
  const r = $('[data-pmreset]', el); if (r) r.onclick = () => { Object.assign(f, { q: '', stage: '', due: '', source: '', service: '', owner: '', prio: '', quick: '' }); renderProcess(el); };
}

/* ----- Hauptansicht mit Reitern ----- */
function renderProcess(el, keepSearchFocus) {
  const f = pmFilters();
  const all = pmAll();
  const tabs = [['overview', 'Übersicht'], ['board', 'Pipeline'], ['tasks', 'Aufgaben'], ['archive', 'Archiv']];
  const activeN = all.filter(p => p.status === 'active').length;
  el.innerHTML = `<div class="view-head"><div><h1>Process Management</h1><p>Alle Kontakte ab „Replied / Engaged“. Die Phase ist dieselbe wie auf der Kontaktseite – Änderungen hier oder dort landen sofort in der Excel-Datei.</p></div>
    <div class="actions"><button type="button" class="btn ok" data-newtask>+ Aufgabe</button></div></div>
    <div class="pm-tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-pmtab="${k}" aria-selected="${f.tab === k}">${l}${k === 'overview' ? ` <span class="count">${activeN}</span>` : ''}</button>`).join('')}</div>
    <div data-pmbody></div>`;
  $$('[data-pmtab]', el).forEach(b => b.onclick = () => { f.tab = b.dataset.pmtab; LS.set('pmTab', f.tab); renderProcess(el); });
  $('[data-newtask]', el).onclick = () => todoForm();
  const body = $('[data-pmbody]', el);
  if (f.tab === 'board') renderPmBoard(body, all, f);
  else if (f.tab === 'tasks') renderPmTasks(body, all, f);
  else if (f.tab === 'archive') renderPmArchive(body, all, f);
  else renderPmOverview(body, all, f);
  if (keepSearchFocus) { const q = $('[data-pmf="q"]', el); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

function pmCardMeta(p) {
  const today = C.todayBerlin(), bits = [];
  if (p.v.service) bits.push(`<span class="tag">${esc(p.v.service)}</span>`);
  if (p.value !== null) bits.push(`<span class="pm-val">${esc(C.fmtAmount(p.value))}</span>`);
  return bits.join(' ');
}
function dueLabel(d) { const today = C.todayBerlin(); if (!C.isDate(d)) return '–'; return d === today ? 'heute' : (d < today ? `${C.displayDate(d)} (überfällig)` : C.displayDate(d)); }
function flags(p) {
  const out = [];
  if (p.status === 'active' && p.overdue) out.push('<span class="flag late" title="Ein Follow-up oder eine Aufgabe ist überfällig">überfällig</span>');
  if (p.stalled) out.push(`<span class="flag stall" title="Seit ${p.sinceInt} Tagen keine Interaktion">Stillstand ${p.sinceInt} T.</span>`);
  if (p.stage === 'Drafts Sent' && C.isEmpty(p.v.draftsFeedback)) out.push('<span class="flag wait" title="Entwürfe gesendet, noch kein Feedback">wartet auf Feedback</span>');
  return out.join(' ');
}

function renderPmOverview(el, all, f) {
  const list = pmApply(all, { ...f, quick: '' });               // Kennzahlen über die gefilterten Prozesse
  const count = q => list.filter(PM_QUICK[q].test).length;
  const sum = arr => arr.reduce((s, p) => s + (typeof p.value === 'number' ? p.value : 0), 0);
  const active = list.filter(p => p.status === 'active'), won = list.filter(p => p.status === 'won');
  const tile = (q, n, sub, cls) => `<button type="button" class="kpi ${cls || ''}${f.quick === q ? ' on' : ''}" data-pmquick="${q}"><span class="n">${n}</span><span class="l">${esc(PM_QUICK[q].label)}</span>${sub ? `<span class="s">${sub}</span>` : ''}</button>`;
  const perStage = PM_STAGES().map(st => ({ st, n: list.filter(p => p.stage === st).length }));
  const maxN = Math.max(1, ...perStage.map(x => x.n));
  const rows = pmSorted(pmApply(all, f), f);
  el.innerHTML = `${pmToolbar(all, f)}
    ${all.length ? `<div class="kpis">
      ${tile('active', active.length, sum(active) ? 'Pipeline ' + esc(C.fmtAmount(sum(active))) : '')}
      ${tile('drafts', count('drafts'))}${tile('calls', count('calls'))}${tile('proposals', count('proposals'))}${tile('negotiation', count('negotiation'))}
      ${tile('followup', count('followup'), '', count('followup') ? 'warn' : '')}${tile('overdue', count('overdue'), '', count('overdue') ? 'bad' : '')}
      ${tile('won', won.length, sum(won) ? esc(C.fmtAmount(sum(won))) : '', 'good')}${tile('lost', count('lost'))}
    </div>
    <section class="panel"><h2>Kontakte je Phase</h2><div class="body stage-bars">${perStage.map(x => `<button type="button" class="sbar" data-stagef="${esc(x.st)}" aria-pressed="${f.stage === x.st}"><span class="lab">${stageBadge({ stage: x.st })}</span><span class="bar"><span style="width:${(x.n / maxN) * 100}%"></span></span><span class="num">${x.n}</span></button>`).join('')}</div></section>
    <section class="panel"><h2><span class="grow">Prozesse</span><span class="muted" style="font-weight:400">${plural(rows.length, 'Prozess', 'Prozesse')}${f.quick ? ' · ' + esc(PM_QUICK[f.quick].label) : ''}</span></h2>
      ${rows.length ? `<div class="pm-table-wrap"><table class="plain pm-table"><thead><tr><th>Kontakt</th><th>Phase</th><th>Leistung / Wert</th><th>Letzte Interaktion</th><th>Nächster Termin</th><th>Nächste Aktion</th><th>Prio</th><th class="num">Tage in Phase</th></tr></thead><tbody>
      ${rows.map(p => `<tr data-proc="${esc(p.v.id)}"><td><b>${esc(C.displayName(p.v))}</b>${p.v.company && C.displayName(p.v) !== p.v.company ? `<div class="muted small">${esc(p.v.company)}</div>` : ''}<div>${flags(p)}</div></td>
        <td>${stageBadge(p.v)}</td><td>${pmCardMeta(p) || '<span class="muted">–</span>'}</td><td>${p.lastInt ? esc(C.displayDate(p.lastInt)) : '<span class="muted">nie</span>'}</td>
        <td class="${p.nextDue && p.nextDue < C.todayBerlin() ? 'overdue' : ''}">${esc(dueLabel(p.nextDue))}</td><td>${p.nextTask ? esc(p.nextTask.v.nextStep) : '<span class="muted">–</span>'}</td>
        <td>${esc(p.v.procPrio || 'Mittel')}</td><td class="num">${p.daysInStage ?? '–'}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="body muted">Keine Prozesse für diese Auswahl.</div>`}
    </section>` : `<div class="empty"><div><h2>Noch keine Prozesse</h2><p>Sobald ein Kontakt die Phase „Replied / Engaged“ oder höher erreicht, erscheint er hier automatisch. Die Phase setzt du auf der Kontaktseite, im Kontaktformular oder beim Loggen einer Aktivität.</p></div></div>`}`;
  bindPmToolbar(el.closest('.content') || el);
  $$('[data-stagef]', el).forEach(b => b.onclick = () => { f.stage = f.stage === b.dataset.stagef ? '' : b.dataset.stagef; renderProcess($('#content')); });
  $$('[data-proc]', el).forEach(r => r.onclick = () => go('proc', r.dataset.proc));
}

/* ----- Pipeline (Kanban) ----- */
function renderPmBoard(el, all, f) {
  const list = pmApply(all, f, { keepStage: true }).filter(p => p.status !== 'inactive');
  const cols = PM_STAGES().map(st => {
    let items = pmSorted(list.filter(p => p.stage === st), f);
    const closedCol = st === 'Closed Won' || st === 'Closed Lost';
    const hidden = closedCol ? Math.max(0, items.length - 20) : 0;
    if (closedCol) items = items.sort((a, b) => String(b.v.procClosed || '').localeCompare(String(a.v.procClosed || ''))).slice(0, 20);
    const sum = items.reduce((s, p) => s + (typeof p.value === 'number' ? p.value : 0), 0);
    return `<section class="kcol" data-col="${esc(st)}" aria-label="${esc(st)}"><header>${stageBadge({ stage: st })}<span class="cnt">${list.filter(p => p.stage === st).length}</span>${sum ? `<span class="sum">${esc(C.fmtAmount(sum))}</span>` : ''}</header>
      <div class="kcards">${items.map(p => `<article class="kcard${p.overdue && p.status === 'active' ? ' late' : ''}${p.stalled ? ' stall' : ''}" draggable="true" data-card="${esc(p.v.id)}" tabindex="0" aria-label="${esc(C.displayName(p.v))}">
        <div class="kc-top"><b>${esc(C.displayName(p.v))}</b>${p.v.procPrio === 'Hoch' ? '<span class="flag late" title="Prozess-Priorität hoch">Hoch</span>' : ''}</div>
        ${p.v.company && C.displayName(p.v) !== p.v.company ? `<div class="muted small">${esc(p.v.company)}</div>` : ''}
        <div class="kc-meta">${pmCardMeta(p)}</div>
        ${p.nextTask ? `<div class="kc-next" title="Nächste Aktion">→ ${esc(p.nextTask.v.nextStep)}</div>` : ''}
        <div class="kc-foot"><span title="Letzte Interaktion">↺ ${p.lastInt ? esc(C.displayDate(p.lastInt)) : 'nie'}</span><span class="${p.nextDue && p.nextDue < C.todayBerlin() ? 'overdue' : ''}" title="Nächster Termin">⏱ ${esc(dueLabel(p.nextDue))}</span><span title="Tage in dieser Phase">${p.daysInStage ?? '–'} T.</span></div>
        ${flags(p) ? `<div class="kc-flags">${flags(p)}</div>` : ''}
      </article>`).join('')}${hidden ? `<button type="button" class="btn sm ghost" data-goarchive>+ ${hidden} ältere im Archiv</button>` : ''}</div></section>`;
  }).join('');
  el.innerHTML = `${pmToolbar(all, f, { noStage: true })}<p class="hint">Karten per Drag &amp; Drop in eine andere Phase ziehen – beim Ziehen erscheint oben eine Leiste mit allen Phasen. Die Phase des Kontakts ändert sich sofort mit. Zurück in „Cold“ oder „Contact Made“ geht über die Prozessseite.</p>
    <div class="board-wrap"><div class="dropbar" data-dropbar hidden>${PM_STAGES().map(st => `<div class="dz" data-col="${esc(st)}">${stageBadge({ stage: st })}</div>`).join('')}</div>
    <div class="kanban">${cols}</div></div>`;
  bindPmToolbar(el.closest('.content') || el);
  const ga = $('[data-goarchive]', el); if (ga) ga.onclick = () => { f.tab = 'archive'; renderProcess($('#content')); };
  let dragId = null;
  $$('[data-card]', el).forEach(card => {
    card.addEventListener('click', () => go('proc', card.dataset.card));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') go('proc', card.dataset.card); });
    card.addEventListener('dragstart', e => { dragId = card.dataset.card; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); $('[data-dropbar]', el).hidden = false; });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); $$('.over', el).forEach(x => x.classList.remove('over')); const db = $('[data-dropbar]', el); if (db) db.hidden = true; });
  });
  $$('[data-col]', el).forEach(col => {
    col.addEventListener('dragover', e => { if (!dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const id = (e.dataTransfer.getData('text/plain') || dragId); dragId = null;
      moveToStage(id, col.dataset.col);
    });
  });
}
/** Eine Stelle für Phasenwechsel aus Process Management (Board und Prozessseite). */
function moveToStage(contactId, to) {
  if (App.loaded && App.loaded.readOnly) { toast('Nur-lesen-Modus: Die Datei hat Strukturprobleme (siehe Hinweis oben).', { error: true }); return; }
  const c = contactById(contactId); if (!c || !C.STAGES.includes(to)) return;
  if (C.stageOf(c.v) === to) return;
  if (changeStage(contactId, to) && (to === 'Closed Won' || to === 'Closed Lost')) closeDialog(contactId, to);
}

/* ----- Abschluss-Dialog (Won / Lost): alles optional ----- */
function closeDialog(contactId, to) {
  const c = contactById(contactId); if (!c) return;
  const v = c.v, won = to === 'Closed Won';
  const d = openDlg(`<form method="dialog" novalidate>
    <div class="dlg-head"><h2>${won ? 'Gewonnen 🎉' : 'Verloren'}: ${esc(C.displayName(v))}</h2><p>Alle Angaben sind optional und lassen sich später auf der Prozessseite ergänzen.</p></div>
    <div class="dlg-body"><div class="grid2">
      <label class="f"><span>${won ? 'Abschlussdatum' : 'Verloren am'}</span><input class="in" type="date" name="closed" value="${esc(C.isDate(v.procClosed) ? v.procClosed : C.todayBerlin())}"></label>
      ${won ? `<label class="f"><span>Finaler Auftragswert (€)</span><input class="in" name="finalValue" inputmode="numeric" value="${esc(v.finalValue !== '' && v.finalValue != null ? v.finalValue : (v.proposalAmount !== '' && v.proposalAmount != null ? v.proposalAmount : (v.dealValue ?? '')))}" placeholder="z. B. 4.500"></label>`
        : `<label class="f span2"><span>Grund (falls bekannt)</span><input class="in" name="lossReason" value="${esc(v.lossReason)}" maxlength="300" placeholder="z. B. Budget, Timing, anderer Anbieter"></label>`}
    </div>
    ${won ? (C.isEmpty(v.projectCreated) ? `<label class="check"><input type="checkbox" name="project" checked> Projekt anlegen (Onboarding-Aufgaben${v.service ? ' für ' + esc(v.service) : ''})</label>` : `<p class="muted">Projekt wurde bereits am ${esc(C.displayDate(v.projectCreated))} angelegt.</p>`) : ''}
    <span class="hint err" data-err></span></div>
    <div class="dlg-foot"><button class="btn" type="button" data-x>Später</button><button class="btn ok" type="submit">Speichern</button></div></form>`, { form: true, label: won ? 'Gewonnen' : 'Verloren' });
  const f = $('form', d);
  $('[data-x]', d).onclick = () => d.close();
  f.addEventListener('submit', e => {
    e.preventDefault();
    const closed = f.elements.closed.value;
    if (closed && !C.isDate(closed)) { $('[data-err]', d).textContent = 'Ungültiges Datum.'; return; }
    const fields = { procClosed: closed };
    if (won) { const n = C.parseAmount(f.elements.finalValue.value); if (n === null) { $('[data-err]', d).textContent = 'Auftragswert bitte als ganze Zahl in Euro, z. B. 4500.'; return; } fields.finalValue = n; }
    else fields.lossReason = f.elements.lossReason.value.trim().slice(0, 300);
    if (C.stageOf(contactById(contactId).v) !== to) { d.close(); toast('Die Phase wurde inzwischen geändert – nichts gespeichert.', { error: true }); return; }
    updateProcess(contactId, fields);
    const wantProject = won && f.elements.project && f.elements.project.checked;
    d.close();
    if (wantProject) createProject(contactId); else toast('Gespeichert.');
  });
}

/* ----- Aufgaben ----- */
function renderPmTasks(el, all, f) {
  const today = C.todayBerlin();
  const ids = new Set(all.map(p => p.v.id));
  let tasks = App.work.activities.filter(a => C.isOpenTodo(a) && (ids.has(a.v.contactId)));
  if (f.mineTasks) tasks = tasks.filter(a => todoOwner(a) === App.identity);
  tasks.sort(taskOrder);
  const groups = [
    ['Überfällig', tasks.filter(a => C.isDate(a.v.todoDue) && a.v.todoDue < today), 'late'],
    ['Heute fällig', tasks.filter(a => a.v.todoDue === today)],
    ['Demnächst', tasks.filter(a => C.isDate(a.v.todoDue) && a.v.todoDue > today).sort((a, b) => a.v.todoDue.localeCompare(b.v.todoDue))],
    ['Ohne Fälligkeit', tasks.filter(a => !C.isDate(a.v.todoDue))],
  ];
  el.innerHTML = `<div class="filters"><div class="chips" role="group" aria-label="Wessen Aufgaben"><button type="button" class="chip" data-mine="0" aria-pressed="${!f.mineTasks}">Alle</button><button type="button" class="chip" data-mine="1" aria-pressed="${!!f.mineTasks}">Meine</button></div>
    <span class="hint">Aufgaben zu Prozessen. Es sind dieselben To-dos wie unter „Heute“ – abhaken, Status und Fälligkeit wirken überall.</span></div>
    ${tasks.length ? groups.filter(g => g[1].length).map(([t, l, cls]) => `<section class="today-group"><h2 class="${cls || ''}">${t} (${l.length})</h2>${l.map(a => taskRow(a, true)).join('')}</section>`).join('')
      : '<div class="empty"><div><h2>Keine offenen Aufgaben</h2><p>Lege mit „+ Aufgabe“ eine an – oder sie entstehen automatisch, z. B. „Discovery Call vorbereiten“ oder „Angebot nachfassen“.</p></div></div>'}
    ${doneList(doneTodos(f.mineTasks, null, 15).filter(x => ids.has(x.a.v.contactId)), true)}`;
  $$('[data-mine]', el).forEach(b => b.onclick = () => { f.mineTasks = b.dataset.mine === '1'; renderProcess($('#content')); });
  bindTaskRows(el);
  bindTodoActions(el);
}
/** Aufgabenzeile mit Status, Fälligkeit, Priorität. Wird in „Aufgaben“ und auf der Prozessseite benutzt. */
function taskRow(a, withContact) {
  const c = a.v.contactId ? contactById(a.v.contactId) : null;
  const st = C.taskStatus(a);
  return `<div class="todo-item task-row pr${C.todoPrio(a)}" data-aid="${esc(a.key)}">
    <button type="button" class="todo-tick" data-tick="${esc(a.key)}" aria-label="Erledigt: ${esc(a.v.nextStep)}" title="Erledigt"></button>
    <div class="todo-main"><div class="todo-top"><div class="todo-text" data-edit-todo="${esc(a.key)}" title="Klicken zum Bearbeiten">${esc(a.v.nextStep)}</div>${todoTools(a)}</div>
      ${a.v.summary && a.v.type === C.TODO_TYPE ? `<div class="task-desc">${esc(a.v.summary)}</div>` : ''}
      <div class="sub">${withContact && c ? `<button type="button" data-procopen="${esc(c.v.id)}">${esc(C.displayName(c.v))}</button> · ` : ''}${esc(todoOwner(a) || 'niemand')}${taskMeta(a)}</div>
      <div class="task-ctl">
        <label>Status <select class="in sm" data-tstatus="${esc(a.key)}">${C.SCHEMA.taskStatuses.map(x => `<option${x === st ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        <label>Fällig <input class="in sm" type="date" data-tdue="${esc(a.key)}" value="${esc(C.isDate(a.v.todoDue) ? a.v.todoDue : '')}"></label>

}
function bindTaskRows(el) {
  $$('[data-tstatus]', el).forEach(s => s.onchange = () => { setTaskStatus(s.dataset.tstatus, s.value); toast(`Status: ${s.value}.`); });
  $$('[data-tdue]', el).forEach(i => i.onchange = () => { const v = i.value; if (v && !C.isDate(v)) return toast('Ungültiges Datum.', { error: true }); updateActivity(i.dataset.tdue, { todoDue: v }); });
  $$('[data-procopen]', el).forEach(b => b.onclick = () => go('proc', b.dataset.procopen));
}

/* ----- Archiv: gewonnen, verloren, zurück im Outreach ----- */

/* ----- Prozessseite ----- */
const PF = {   // Prozessfelder: Typ und Beschriftung
  dealValue: ['amount', 'Geschätzter Auftragswert (€)'], finalValue: ['amount', 'Finaler Auftragswert (€)'], proposalAmount: ['amount', 'Angebotssumme (€)'],
  procStart: ['date', 'Prozess gestartet'], procClosed: ['date', 'Abgeschlossen am'], lossReason: ['text', 'Verlustgrund'],
  draftsUrl: ['url', 'Entwürfe (Link oder Datei)'], draftsSent: ['date', 'Entwürfe gesendet am'], draftsFeedback: ['date', 'Feedback erhalten am'],
  qualNotes: ['area', 'Bedarf, Fit, Budget'], meetingAt: ['datetime', 'Discovery Call am'], meetingLink: ['url', 'Meeting-Link'], meetingPrep: ['area', 'Vorbereitung'],
  discoveryNotes: ['area', 'Anforderungen, Ziele, Umfang, nächste Schritte'], proposalUrl: ['url', 'Angebot (Link oder Datei)'], proposalDate: ['date', 'Angebot vom'],
  negotiationNotes: ['area', 'Gewünschte Änderungen (Preis, Umfang, Timing)'], decisionDate: ['date', 'Entscheidung erwartet bis'],
};
const STAGE_FIELDS = {
  'Replied / Engaged': [],
  'Drafts Sent': ['draftsUrl', 'draftsSent', 'draftsFeedback'],
  'Qualified': ['qualNotes'],
  'Discovery Call Booked': ['meetingAt', 'meetingLink', 'meetingPrep'],
  'Discovery Completed': ['discoveryNotes'],
  'Proposal Sent': ['proposalUrl', 'proposalDate', 'proposalAmount'],
  'Negotiation': ['negotiationNotes', 'decisionDate'],
  'Closed Won': ['finalValue', 'procClosed'],
  'Closed Lost': ['procClosed', 'lossReason'],
};
const STAGE_HINT = {
  'Replied / Engaged': 'Antwort und Gesprächsnotizen über „Aktivität loggen“ festhalten, dann die nächste Aktion als Aufgabe anlegen.',
  'Drafts Sent': 'Bis „Feedback erhalten am“ gesetzt ist, gilt der Prozess als „wartet auf Feedback“.',
  'Qualified': 'Passt der Lead? Dann Discovery Call buchen – sonst als verloren markieren.',
  'Discovery Call Booked': 'Beim Wechsel in diese Phase wird automatisch die Aufgabe „Discovery Call vorbereiten“ angelegt (einmalig).',
  'Discovery Completed': 'Beim Wechsel in diese Phase wird automatisch „Angebot vorbereiten“ angelegt (einmalig).',
  'Proposal Sent': 'Beim Wechsel in diese Phase wird automatisch „Angebot nachfassen“ (5 Tage nach Angebotsdatum) angelegt (einmalig).',
  'Negotiation': 'Erwarteten Auftragswert aktuell halten und Entscheidungsdatum eintragen.',
  'Closed Won': 'Gewonnen. Ein Projekt mit Onboarding-Aufgaben lässt sich genau einmal anlegen.',
  'Closed Lost': 'Verloren. Verlauf und Aufgaben bleiben erhalten; der Prozess erscheint nicht mehr in den aktiven Ansichten.',
};
function pfInput(v, k, draft) {
  const [type, label] = PF[k];
  const raw = draft && k in draft ? draft[k] : (type === 'datetime' ? (C.isDateTime(v[k]) ? String(v[k]).slice(0, 16) : (C.isDate(v[k]) ? v[k] + 'T09:00' : '')) : (v[k] ?? ''));
  const link = type === 'url' && C.websiteUrl(v[k]) ? ` <a href="${esc(C.websiteUrl(v[k]))}" target="_blank" rel="noopener noreferrer">öffnen</a>` : '';
  const dirty = draft && k in draft ? ' dirty' : '';
  if (type === 'area') return `<label class="f span2"><span>${label}</span><textarea class="in${dirty}" rows="3" data-pf="${k}" maxlength="${C.SAFE_CELL_TEXT}">${esc(raw)}</textarea></label>`;
  const t = type === 'date' ? 'date' : type === 'datetime' ? 'datetime-local' : 'text';
  return `<label class="f"><span>${label}${link}</span><input class="in${dirty}" type="${t}" data-pf="${k}" value="${esc(raw)}"${type === 'amount' ? ' inputmode="numeric" placeholder="z. B. 4.500"' : ''}${type === 'url' ? ' placeholder="https://… oder Dateiname" spellcheck="false"' : ''}></label>`;
}
function procDraft(id) { const d = App.ui.procDraft; return d && d.id === id ? d.vals : null; }

function saveProcDraft(id, el) {
  const d = procDraft(id); if (!d) return;
  const out = {}, errs = [];
  for (const [k, raw0] of Object.entries(d)) {
    const [type, label] = PF[k] || ['text', k]; const raw = String(raw0 ?? '').trim();
    if (type === 'amount') { const n = C.parseAmount(raw); if (n === null) errs.push(`${label}: bitte ganze Zahl in Euro`); else out[k] = n; }
    else if (type === 'date') { if (raw && !C.isDate(raw)) errs.push(`${label}: ungültiges Datum`); else out[k] = raw; }
    else if (type === 'datetime') { if (raw && !C.isDateTime(raw)) errs.push(`${label}: ungültige Zeit`); else out[k] = raw; }
    else if (type === 'area') out[k] = C.normalizeNewlines(raw).slice(0, C.SAFE_CELL_TEXT);
    else out[k] = raw.slice(0, 1000);
  }
  if (errs.length) { $('[data-pferr]', el).textContent = errs.join(' · '); return; }
  App.ui.procDraft = null;
  if (updateProcess(id, out)) toast('Prozessdaten gespeichert.'); else renderAll();
}
/** Chronologischer Prozessverlauf: Phasenwechsel, Interaktionen, Aufgaben (angelegt/erledigt), Follow-ups, Prozessereignisse. */
function procTimeline(v, acts) {
  const ev = [];
  for (const a of acts) {
    const x = a.v;
    if (x.type === C.STAGE_CHANGE_TYPE || (x.stageAfter && x.stageBefore !== x.stageAfter)) ev.push({ at: x.at, who: x.loggedBy, cls: 'stage', html: `Phase ${esc(x.stageBefore || '–')} → ${stageBadge({ stage: x.stageAfter })}` });
    if (x.type === C.PROCESS_CHANGE_TYPE) ev.push({ at: x.at, who: x.loggedBy, cls: 'chg', html: esc(x.summary).replace(/\n/g, '<br>') });
    else if (x.type === C.TODO_TYPE || (C.isTask(a) && x.type !== C.STAGE_CHANGE_TYPE)) {
      ev.push({ at: x.at, who: x.loggedBy, cls: 'task', html: `Aufgabe angelegt: ${esc(x.nextStep)}${String(x.todoKey || '').startsWith('auto:') || String(x.todoKey || '').startsWith('proj:') ? ' <span class="muted">(automatisch)</span>' : ''}` });
      if (!C.isEmpty(x.todoDone)) ev.push({ at: x.todoDone, who: '', cls: 'done', html: `Aufgabe erledigt: ${esc(x.nextStep)}` });
    }
    if (!SYSTEM_ACT_TYPES().includes(x.type)) ev.push({ at: x.at, who: x.loggedBy, cls: 'int', html: `<b>${esc(x.type)}</b>${x.direction ? ` <span class="muted">${x.direction === 'Eingehend' ? 'eingehend' : 'ausgehend'}</span>` : ''}${x.outcome ? ' – ' + esc(x.outcome) : ''}${x.summary ? `<div class="s">${esc(x.summary)}</div>` : ''}` });
    if (C.isDate(x.fuDate)) ev.push({ at: x.at, who: x.loggedBy, cls: 'fu', html: `Follow-up geplant für ${esc(C.displayDate(x.fuDate))}${x.assignedTo ? ' (' + esc(x.assignedTo) + ')' : ''}` });
    if (!C.isEmpty(x.fuDone)) ev.push({ at: x.fuDone, who: '', cls: 'done', html: `Follow-up vom ${esc(C.displayDate(x.fuDate))} erledigt` });
  }
  if (C.isDate(v.procStart)) ev.push({ at: v.procStart + 'T00:00', who: '', cls: 'proc', html: 'Prozess gestartet' });
  if (C.isDate(v.procClosed)) ev.push({ at: v.procClosed + 'T23:59', who: '', cls: 'proc', html: C.stageOf(v) === 'Closed Won' ? 'Prozess gewonnen' : 'Prozess abgeschlossen' });
  if (!C.isEmpty(v.projectCreated)) ev.push({ at: v.projectCreated, who: '', cls: 'proc', html: 'Projekt angelegt' });
  ev.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!ev.length) return '<div class="body muted">Noch keine Ereignisse.</div>';
  return `<ul class="timeline compact ptl">${ev.slice(0, 200).map(e => `<li class="e-${e.cls}"><div class="t">${esc(C.displayDate(e.at))}${e.who ? '<br>' + esc(e.who) : ''}</div><div>${e.html}</div></li>`).join('')}</ul>`;
}

function pmActiveCount() { return visibleContacts().filter(c => C.processStatus(c.v) === 'active').length; }

/* ==========================================================================
 * Mail-Import: .eml-Dateien per Drag & Drop (oder Dateiauswahl) in den Verlauf übernehmen.
 * Kein Mail-Konto, kein Passwort – das CRM liest nur die Datei, die man hineinzieht.
 * ========================================================================== */

const MAIL_MAX = C.SAFE_CELL_TEXT - 400;     // Platz für Betreff/Von/An-Zeilen
function mailType() { return S().activityTypes.find(x => /mail/i.test(x)) || 'E-Mail'; }
function contactsByEmail() {
  const m = new Map();
  for (const c of visibleContacts()) { const e = String(c.v.email || '').trim().toLowerCase(); if (e && !m.has(e)) m.set(e, c); }
  return m;
}
function ownEmails() { return new Set(S().founders.map(f => String(f.email || '').trim().toLowerCase()).filter(Boolean)); }
function splitPersonName(name, email) {
  const n = String(name || '').trim();
  if (!n) return { firstName: '', lastName: '' };
  if (n.includes(',')) { const [l, f] = n.split(',').map(x => x.trim()); return { firstName: f || '', lastName: l || '' }; }
  const p = n.split(/\s+/); return p.length === 1 ? { firstName: '', lastName: p[0] } : { firstName: p.slice(0, -1).join(' '), lastName: p.at(-1) };
}
function fmtAddr(a) { return a ? (a.name ? `${a.name} <${a.email}>` : a.email) : ''; }

/* ----- Dateien entgegennehmen ----- */
async function importMailFiles(files, ctxContactId) {
  if (App.loaded && App.loaded.readOnly) return toast('Nur-lesen-Modus: Die Datei hat Strukturprobleme (siehe Hinweis oben).', { error: true });
  const list = [...files];
  let done = 0;
  for (const f of list) {
    const name = f.name || 'Datei';
    if (/\.msg$/i.test(name)) { toast(`„${name}“: Outlook-.msg-Dateien kann das CRM nicht lesen. In Outlook bitte „Speichern unter“ → .eml wählen.`, { error: true, ms: 10000 }); continue; }
    if (f.size > 25 * 1024 * 1024) { toast(`„${name}“ ist größer als 25 MB – wird nicht übernommen.`, { error: true }); continue; }
    let mail = null;
    try { mail = C.parseEml(new Uint8Array(await f.arrayBuffer())); } catch (e) { mail = null; }
    if (!mail) { toast(`„${name}“ ist keine E-Mail-Datei (.eml).`, { error: true }); continue; }
    const ok = await mailImportDialog(mail, ctxContactId);
    if (ok) done++;
  }
  return done;
}

/* ----- Dialog: Kontakt zuordnen (oder neu anlegen), Richtung prüfen, speichern ----- */

    const byEmail = contactsByEmail(), own = ownEmails();

    const candidates = [...new Set([fromC, ...toMatches].filter(Boolean))];
    const ctx = ctxContactId ? contactById(ctxContactId) : null;
    if (ctx && !candidates.includes(ctx)) candidates.push(ctx);
    // Vorschlag für einen neuen Kontakt: bei eingehender Mail der Absender, sonst der erste Empfänger
    const newAddr = () => (dir === 'Eingehend' ? mail.from : (others.find(a => !own.has(a.email)) || others[0] || mail.from));
    const state = { pick: candidates[0] ? candidates[0].v.id : '__new' };
    const st = S();

    const tooLong = text.length > MAIL_MAX;
    const d = openDlg(`<form method="dialog" novalidate>
      <div class="dlg-head"><h2>E-Mail in den Verlauf übernehmen</h2><p>${esc(mail.subject || '(ohne Betreff)')}</p></div>

          <dt>Datum</dt><dd>${esc(mail.date ? C.displayDate(mail.date) : 'unbekannt – es wird „jetzt“ verwendet')}</dd>
          ${mail.attachments.length ? `<dt>Anhänge</dt><dd>${esc(mail.attachments.join(', '))} <span class="muted">(werden nicht gespeichert, nur vermerkt)</span></dd>` : ''}
        </dl>
        <div class="f"><span>Richtung</span><div class="chips" data-chips="dir"><button type="button" class="chip" data-v="Eingehend">eingehend (Antwort/Mail vom Kontakt)</button><button type="button" class="chip" data-v="Ausgehend">ausgehend (von uns gesendet)</button></div></div>
        <div class="f"><span>Kontakt</span>
          <div class="mail-pick" data-pick>
            ${candidates.map(c => `<label class="check"><input type="radio" name="pick" value="${esc(c.v.id)}"> <b>${esc(C.displayName(c.v))}</b>${c.v.company && C.displayName(c.v) !== c.v.company ? ', ' + esc(c.v.company) : ''} <span class="muted">${esc(c.v.email || '')}${c === fromC ? ' · Absender' : (toMatches.includes(c) ? ' · Empfänger' : ' · geöffneter Kontakt')}</span></label>`).join('')}
            <label class="check"><input type="radio" name="pick" value="__other"> Anderer bestehender Kontakt …</label>
            <div class="cpick-search" data-other hidden><input class="in" name="csearch" autocomplete="off" placeholder="Name, Firma oder E-Mail suchen …"><div class="cpick-res" data-cres></div></div>
            <label class="check"><input type="radio" name="pick" value="__new"> <b>Neuen Kontakt anlegen</b></label>
            <div class="grid2 mail-new" data-new hidden>
              <label class="f"><span>Vorname</span><input class="in" name="nf"></label>
              <label class="f"><span>Nachname</span><input class="in" name="nl"></label>
              <label class="f"><span>Firma</span><input class="in" name="nc"></label>
              <label class="f"><span>E-Mail</span><input class="in" name="ne" type="email"></label>
            </div>
          </div>
        </div>
        <label class="f"><span>Mailtext (wird vollständig gespeichert${tooLong ? ' – <b>gekürzt</b>, weil länger als eine Excel-Zelle fasst' : ''})</span><textarea class="in mail-text" rows="9" readonly>${esc(tooLong ? text.slice(0, MAIL_MAX) : text)}</textarea><span class="hint">${text.length.toLocaleString('de-DE')} Zeichen</span></label>
        <span class="hint err" data-err></span>
      </div>
      <div class="dlg-foot"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn ok" type="submit">In den Verlauf übernehmen</button></div>
    </form>`, { form: true, wide: true, label: 'E-Mail übernehmen', onClose: () => resolve(!!state.saved) });
    const f = $('form', d);
    const fillNew = () => { const a = newAddr(), n = splitPersonName(a.name, a.email); f.elements.nf.value = n.firstName; f.elements.nl.value = n.lastName; f.elements.ne.value = a.email; f.elements.nc.placeholder = (a.email.split('@')[1] || '').replace(/^www\./, ''); };
    const paint = () => {
      $$('[data-chips="dir"] .chip', d).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === dir)));
      const r = [...f.querySelectorAll('input[name="pick"]')]; r.forEach(x => { x.checked = x.value === state.pick || (state.pick !== '__new' && state.pick !== '__other' && x.value === '__other' && !r.some(y => y.value === state.pick)); });
      $('[data-new]', d).hidden = state.pick !== '__new';
      $('[data-other]', d).hidden = !(state.pick === '__other' || (state.pick && !candidates.some(c => c.v.id === state.pick) && state.pick !== '__new'));
    };
    fillNew();

      $$('[data-cid]', box).forEach(b => b.onclick = () => { state.pick = b.dataset.cid; $$('.cpick-hit', box).forEach(x => x.setAttribute('aria-selected', String(x === b))); });
    }, 120));

/* ----- Thermometer ------------------------------------------------------- */
function thermometer({ value, onChange, onCommit, compact }) {
  let val = typeof value === 'number' && Number.isFinite(value) ? value : '';
  const el = h(`<div class="thermo-wrap">
    <div class="thermo${compact ? ' compact' : ''}">
      <div class="thermo-tube" role="slider" tabindex="0" aria-label="Lead-Temperatur" aria-valuemin="0" aria-valuemax="100"><div class="thermo-fill"></div><div class="thermo-knob"></div></div>
      <div class="thermo-scale" aria-hidden="true"></div>
    </div>
    <div class="thermo-read" aria-hidden="true"><span class="big"></span><span class="bandname"></span></div>
    <div class="thermo-ctrl"><button type="button" class="btn sm" data-d="-5" aria-label="Temperatur minus 5">−5</button><input class="in" type="number" min="0" max="100" step="1" aria-label="Temperatur als Zahl" placeholder="–"><button type="button" class="btn sm" data-d="5" aria-label="Temperatur plus 5">+5</button><button type="button" class="btn sm ghost" data-clear>nicht bewertet</button></div>
  </div>`);
  const tube = $('.thermo-tube', el), fill = $('.thermo-fill', el), knob = $('.thermo-knob', el), num = $('input', el);
  const bands = S().bands.filter(b => Number.isFinite(b.min)).sort((a, b) => a.min - b.min);
  $('.thermo-scale', el).innerHTML = bands.map(b => `<span class="tick" style="bottom:${b.min}%">${b.min}</span><span class="band" data-b="${esc(b.name)}" style="bottom:${(b.min + b.max) / 2}%">${esc(b.name)}</span>`).join('') + '<span class="tick" style="bottom:100%">100</span>';
  const commitLater = debounce(() => onCommit && onCommit(val), 900);
  function update() {
    const has = val !== '';
    const tubeH = tube.clientHeight || (compact ? 168 : 240);
    fill.style.height = has ? Math.max(val, 2) + '%' : '0';
    fill.style.background = gradientCss(); fill.style.backgroundSize = `100% ${tubeH}px`; fill.style.backgroundPosition = 'bottom';
    knob.style.bottom = has ? `calc(${val}% - 1.5px)` : '-10px';
    tube.classList.toggle('unrated', !has);
    const b = has ? C.bandFor(val, S().bands) : null;
    $('.big', el).textContent = has ? val : '–';
    $('.bandname', el).textContent = b ? b.name : (has ? '' : 'nicht bewertet');
    $('.bandname', el).style.color = b ? '' : 'var(--muted)';
    $$('.thermo-scale .band', el).forEach(x => x.classList.toggle('on', !!b && x.dataset.b === b.name));
    tube.setAttribute('aria-valuenow', has ? val : 0);
    tube.setAttribute('aria-valuetext', has ? `${val}, ${b ? b.name : ''}` : 'nicht bewertet');
    if (document.activeElement !== num) num.value = has ? val : '';
  }
  function set(v, how) {
    if (v !== '') v = Math.max(0, Math.min(100, Math.round(v)));
    if (v === val) return;
    val = v; update(); onChange && onChange(val);
    if (how === 'now') onCommit && onCommit(val); else if (how === 'later') commitLater();
  }
  const fromY = y => { const r = tube.getBoundingClientRect(); return Math.round(((1 - (y - r.top) / r.height) * 100) / 5) * 5; };
  let dragging = false;
  tube.addEventListener('pointerdown', e => { dragging = true; tube.setPointerCapture(e.pointerId); tube.focus(); set(fromY(e.clientY)); });
  tube.addEventListener('pointermove', e => { if (dragging) set(fromY(e.clientY)); });
  tube.addEventListener('pointerup', () => { if (dragging) { dragging = false; commitLater(); } });
  tube.addEventListener('keydown', e => {
    const cur = val === '' ? null : val;
    const step = (d) => { if (cur === null) return d > 0 ? 5 : 0; return d > 0 ? Math.floor(cur / 5) * 5 + d : Math.ceil(cur / 5) * 5 + d; };
    let nv;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') nv = step(5);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') nv = step(-5);
    else if (e.key === 'PageUp') nv = step(10);
    else if (e.key === 'PageDown') nv = step(-10);
    else if (e.key === 'Home') nv = 0; else if (e.key === 'End') nv = 100;
    else if (e.key === 'Delete' || e.key === 'Backspace') nv = '';
    else return;
    e.preventDefault(); e.stopPropagation(); set(nv, 'later');
  });
  $$('[data-d]', el).forEach(b => b.onclick = () => set(val === '' ? (+b.dataset.d > 0 ? 5 : 0) : val + +b.dataset.d, 'later'));
  $('[data-clear]', el).onclick = () => set('', 'later');
  num.addEventListener('input', () => { const t = num.value.trim(); if (t === '') return; const n = Number(t); if (Number.isInteger(n) && n >= 0 && n <= 100) set(n, 'later'); });
  num.addEventListener('blur', () => update());
  requestAnimationFrame(update); update();
  return { el, get: () => val, set };
}
