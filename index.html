  /** Platzhalter-Liste für Text, der schon gefüllt wurde: {…} und unbekannte {{…}}. */
  function openPlaceholders(text) { return C.openPlaceholders(String(text || '')); }

  /* ---------------------------------------------------------------------------
   * 3. Vorlagen-Bibliothek
   * ------------------------------------------------------------------------- */
  const TPL_PREFIX = 'Vorlage: ';
  function parseStored(raw) { try { const o = JSON.parse(raw); return o && typeof o === 'object' ? o : null; } catch (_) { return null; } }
  function storedTemplates(settings) {
    const out = [], bad = [], kv = (settings && settings.kv) || {};
    for (const k of (settings && settings.kvOrder) || Object.keys(kv)) {
      if (!k.startsWith(TPL_PREFIX)) continue;
      const o = parseStored(kv[k]); const id = k.slice(TPL_PREFIX.length).trim();
      if (!o || !id) { bad.push(k); continue; }
      out.push({ ...o, id });
    }
    return { list: out, bad };
  }
  const clean = t => ({ id: t.id, cat: t.cat || 'Eigene', lang: t.lang === 'en' ? 'en' : 'de', name: S_(t.name) || 'Ohne Namen', subject: String(t.subject || ''), body: String(t.body || ''),
    tags: Array.isArray(t.tags) ? t.tags.map(S_).filter(Boolean) : [], stages: Array.isArray(t.stages) ? t.stages.filter(s => C.STAGES.includes(s)) : [],
    audience: Array.isArray(t.audience) ? t.audience : [], style: S_(t.style), hint: S_(t.hint), segments: Array.isArray(t.segments) ? t.segments : [] });
  /** Alle Vorlagen: eingebaut (ggf. überschrieben/ausgeblendet), Website-Fälle (bisherige Mail-Vorlagen) und eigene. */
  function allTemplates(settings) {
    const st = storedTemplates(settings), byId = new Map(st.list.map(t => [t.id, t]));
    const out = [];
    for (const b of K.TEMPLATES) {
      const o = byId.get(b.id);
      if (o && o.hidden) { out.push({ ...clean(b), source: 'builtin', hidden: true }); continue; }
      if (o) out.push({ ...clean({ ...b, ...o, id: b.id }), source: 'builtin', overridden: true, by: o.by || '', at: o.at || '' });
      else out.push({ ...clean(b), source: 'builtin' });
    }
    for (const t of C.mailTemplates(settings)) {
      out.push({ ...clean({ id: 'web-' + t.index, cat: 'Erstansprache', lang: 'de', name: `Website-Fall ${t.index}: ${t.name}`, subject: t.subject, body: t.body, stages: ['Cold'], tags: ['Website-Fall', t.name], style: 'Beratend', audience: ['Entscheider'],
        hint: 'Deine bisherige Vorlage für die Website-Kategorie „' + t.name + '“. Wird auch in den Einstellungen gepflegt.' }), source: 'legacy', legacyIndex: t.index, webCat: t.name });
    }
    for (const t of st.list) if (!K.TEMPLATES.some(b => b.id === t.id) && !t.hidden) out.push({ ...clean(t), source: 'custom', by: t.by || '', at: t.at || '' });
    const order = K.TEMPLATE_CATEGORIES;
    const ci = c => { const i = order.indexOf(c); return i < 0 ? order.length : i; };
    return out.sort((a, b) => ci(a.cat) - ci(b.cat) || (a.lang === b.lang ? 0 : a.lang === 'de' ? -1 : 1) || a.name.localeCompare(b.name, 'de'));
  }
  function serializeTemplate(t, by, at) {
    const c = clean(t);
    return JSON.stringify({ v: 1, name: c.name, cat: c.cat, lang: c.lang, subject: c.subject, body: c.body, tags: c.tags, stages: c.stages, audience: c.audience, style: c.style, hint: c.hint, by: by || '', at: at || '' });
  }
  function newTemplateId(existing) { const has = new Set(existing || []); let id; do { id = 'u-' + Math.random().toString(36).slice(2, 10); } while (has.has(id)); return id; }

  /* ---------------------------------------------------------------------------
   * Fakten über einen Kontakt (Grundlage für Vorschläge, Priorität, Status)
   * ------------------------------------------------------------------------- */
  function factsOf(v, acts, today, settings) {
    acts = acts || []; today = today || C.todayBerlin();
    const ca = acts.filter(a => C.isContactActivity(a));
    const last = ca[0] || null, lastDay = last ? day(last.v.at) : '';
    const lastIn = ca.find(a => a.v.direction === 'Eingehend') || null;
    const lastOut = ca.find(a => a.v.direction === 'Ausgehend') || null;
    let unanswered = 0; for (const a of ca) { if (a.v.direction === 'Eingehend') break; if (a.v.direction === 'Ausgehend') unanswered++; }
    const awaitingReply = !!(lastIn && (!lastOut || String(lastIn.v.at) > String(lastOut.v.at)));
    const openFu = acts.filter(a => C.isOpenFollowUp(a));
    const overdueFu = openFu.filter(a => a.v.fuDate < today), todayFu = openFu.filter(a => a.v.fuDate === today);
    const openTodos = acts.filter(a => C.isOpenTodo(a));
    const overdueTodos = openTodos.filter(a => C.isDate(day(a.v.todoDue)) && day(a.v.todoDue) < today);
    const stage = C.stageOf(v), idx = C.stageIndex(v), status = C.processStatus(v);
    const enter = acts.find(a => a.v.stageAfter === stage);
    const stageSince = day((enter && enter.v.at) || v.procStart || v.created);
    const d90 = C.addDays(today, -90);
    const stalledDays = C.settingNum(settings, 'Process stalled days', 7);
    const ref = [lastDay, stageSince].filter(C.isDate).sort().pop() || '';
    const sinceMove = ref ? C.daysBetween(ref, today) : null;
    const maxOverdue = [...overdueFu.map(a => a.v.fuDate), ...overdueTodos.map(a => day(a.v.todoDue))].sort()[0];
    return {
      stage, idx, status, last, lastDay, daysSince: lastDay ? C.daysBetween(lastDay, today) : null, lastIn, lastOut, unanswered, awaitingReply,
      daysSinceIn: lastIn ? C.daysBetween(day(lastIn.v.at), today) : null,
      openFu, overdueFu, todayFu, openTodos, overdueTodos, maxOverdueDays: maxOverdue ? C.daysBetween(maxOverdue, today) : 0,
      stageSince, daysInStage: C.isDate(stageSince) ? C.daysBetween(stageSince, today) : null, sinceMove, stalled: status === 'active' && sinceMove !== null && sinceMove >= stalledDays, stalledDays,
      interactions90: ca.filter(a => day(a.v.at) >= d90).length, inbound90: ca.filter(a => a.v.direction === 'Eingehend' && day(a.v.at) >= d90).length,
      contactCount: ca.length, dnc: C.isFlagYes(v.dnc), hasPhone: !!S_(v.phone), hasEmail: !!S_(v.email),
      meetingDay: C.isDate(day(v.meetingAt)) ? day(v.meetingAt) : '', createdDay: day(v.created),
    };
  }

  /* ---------------------------------------------------------------------------
   * 4. Vorschläge
   * ------------------------------------------------------------------------- */
  function suggestTemplates(list, v, acts, today, settings) {
    const f = factsOf(v, acts, today, settings), out = [];
    const add = (id, reason, w) => { const t = list.find(x => x.id === id && !x.hidden); if (t && !out.some(o => o.t.id === id)) out.push({ t, reason, w }); };
    const lastOutcome = f.last ? S_(f.last.v.outcome) : '';
    if (f.last && f.last.v.type === 'Anruf' && /nicht erreicht|mailbox/i.test(lastOutcome) && f.daysSince !== null && f.daysSince <= 2) add('de-verpasst', 'Letzter Anruf: ' + lastOutcome, 9);
    if (f.stage === 'Cold' && !f.contactCount) {
      const web = list.find(t => t.source === 'legacy' && t.webCat && t.webCat === S_(v.webCat));
      if (web) out.push({ t: web, reason: 'Passt zur Website-Kategorie „' + v.webCat + '“', w: 10 });
      if ((K.VALUE_PROPS && S_(v.category) === 'Finanzvertrieb')) add('de-kalt-gf', 'Kategorie Finanzvertrieb', 8);
      add('de-kalt-direkt', 'Erstkontakt', 7);
    }
    if (f.stage === 'Contact Made' && !f.awaitingReply) {
      if (f.unanswered <= 1) add('de-fu1', `${f.unanswered || 1} Nachricht ohne Antwort`, 8);
      else if (f.unanswered === 2) add('de-fu2', '2 Nachrichten ohne Antwort', 8);
      else add('de-fu-final', `${f.unanswered} Nachrichten ohne Antwort`, 8);
    }
    if (f.daysSince !== null && f.daysSince > 90 && f.status !== 'won') add('de-reengage', `Letzter Kontakt vor ${f.daysSince} Tagen`, 6);
    for (const t of list) if (!t.hidden && t.lang === 'de' && t.stages.includes(f.stage)) add(t.id, 'Empfohlen für Phase „' + f.stage + '“', 3);
    return out.sort((a, b) => b.w - a.w).slice(0, 4);
  }
  function suggestPlaybook(v, acts, today, settings) {
    const f = factsOf(v, acts, today, settings), pos = S_(v.position).toLowerCase();
    if (/assist|sekret|zentrale|empfang|office/.test(pos)) return { id: 'gatekeeper', reason: 'Position: ' + v.position };
    if (f.status === 'won') return { id: 'bestandskunde', reason: 'Bestandskunde' };
    if (f.stage === 'Closed Lost') return { id: 'reaktivierung', reason: 'Verloren – Reaktivierung' };
    if (f.stage === 'Proposal Sent' || f.stage === 'Negotiation') return { id: 'angebot', reason: 'Angebot offen' };
    if (f.stage === 'Drafts Sent') return { id: 'entwuerfe', reason: 'Entwürfe verschickt' };
    if (['Replied / Engaged', 'Qualified', 'Discovery Call Booked', 'Discovery Completed'].includes(f.stage)) return { id: 'qualifizierung', reason: 'Phase „' + f.stage + '“' };
    if (f.daysSince !== null && f.daysSince > 90) return { id: 'reaktivierung', reason: `Letzter Kontakt vor ${f.daysSince} Tagen` };
    if (f.stage === 'Contact Made' && f.lastOut && /mail/i.test(f.lastOut.v.type)) return { id: 'nach-mail', reason: 'Letzte Mail ohne Antwort' };
    if (/geschäftsf|inhaber|vorstand|ceo|leiter|direktor|gf\b/.test(pos)) return { id: 'entscheider', reason: 'Position: ' + v.position };
    return { id: 'kaltakquise', reason: f.contactCount ? 'Noch kein Gespräch' : 'Erstkontakt' };
  }

  /* ---------------------------------------------------------------------------
   * 5. Nächste beste Aktion + Priorität
   * ------------------------------------------------------------------------- */
  /** Gewichte (Punkte). In den Einstellungen überschreibbar: „Prio: <Schlüssel>“. */
  const WEIGHTS = [
    { key: 'reply', label: 'Antwort von ihnen offen', pts: 35 },
    { key: 'meeting', label: 'Termin heute/morgen', pts: 30 },
    { key: 'overdue', label: 'Follow-up oder To-do überfällig', pts: 25 },
    { key: 'proposal', label: 'Angebot ohne Reaktion', pts: 22 },
    { key: 'dueToday', label: 'Follow-up heute fällig', pts: 20 },
    { key: 'drafts', label: 'Entwürfe ohne Feedback', pts: 18 },
    { key: 'stalled', label: 'Prozess im Stillstand', pts: 15 },
    { key: 'noNext', label: 'Aktiver Prozess ohne nächsten Schritt', pts: 12 },
    { key: 'nudge', label: 'Nachfassen fällig (keine Antwort)', pts: 10 },
    { key: 'customer', label: 'Bestandskunde lange ohne Kontakt', pts: 8 },
    { key: 'newLead', label: 'Neuer Lead, noch nicht kontaktiert', pts: 6 },
    { key: 'stageLate', label: 'Späte Phase (Angebot/Verhandlung)', pts: 10 },
    { key: 'stageMid', label: 'Mittlere Phase (Entwürfe bis Discovery)', pts: 5 },
    { key: 'prioHigh', label: 'Prozess-Priorität „Hoch“', pts: 6 },
    { key: 'value', label: 'Auftragswert eingetragen', pts: 3 },
  ];
  function weight(settings, key) { const d = WEIGHTS.find(w => w.key === key); return C.settingNum(settings, 'Prio: ' + key, d ? d.pts : 0); }
  const ACTION = (label, kind, reason, extra) => ({ label, kind, reason, ...(extra || {}) });

  /**
   * Nächste beste Aktion für einen Kontakt. Rückgabe { score, action, factors:[{pts,text}], facts }.
   * action.kind: call | mail | prep | task | edit | none. Gründe sind immer aus erfassten Daten abgeleitet.
   */
  function nextBestAction(v, acts, today, settings) {
    today = today || C.todayBerlin();
    const f = factsOf(v, acts, today, settings), factors = [];
    const W = k => weight(settings, k);
    const push = (k, text, extra) => { const pts = W(k) + (extra || 0); if (pts) factors.push({ key: k, pts, text }); };
    let action = null;
    const contactKind = f.hasPhone ? 'call' : (f.hasEmail ? 'mail' : 'edit');
    if (f.dnc) return { score: 0, action: ACTION('Nicht kontaktieren', 'none', 'Kontakt ist als „Nicht kontaktieren“ markiert.'), factors, facts: f };
    if (f.awaitingReply && f.daysSinceIn !== null && f.daysSinceIn <= 14 && f.status !== 'won') {
      push('reply', `${f.lastIn.v.type} von ihnen am ${C.displayDate(day(f.lastIn.v.at))}, danach nichts von euch`);
      action = action || ACTION('Auf die Antwort reagieren', f.stage === 'Replied / Engaged' ? 'mail' : contactKind, `Eingehende ${f.lastIn.v.type} vom ${C.displayDate(day(f.lastIn.v.at))} ist noch unbeantwortet.`, { tplId: f.stage === 'Replied / Engaged' ? 'de-termin-anfrage' : 'de-nach-telefonat', playbookId: 'qualifizierung' });
    }
    if (f.meetingDay && f.meetingDay >= today && C.daysBetween(today, f.meetingDay) <= 1 && f.stage === 'Discovery Call Booked') {
      push('meeting', `Termin ${f.meetingDay === today ? 'heute' : 'morgen'}`);
      action = action || ACTION('Termin vorbereiten', 'prep', `Discovery Call ${f.meetingDay === today ? 'heute' : 'morgen'} – Briefing ansehen.`, { playbookId: 'qualifizierung' });
    }
    if (f.overdueFu.length || f.overdueTodos.length) {
      const a = f.overdueFu[0] || f.overdueTodos[0];
      push('overdue', `${f.overdueFu.length + f.overdueTodos.length} überfällig, ältestes seit ${f.maxOverdueDays} Tag${f.maxOverdueDays === 1 ? '' : 'en'}`, Math.min(15, f.maxOverdueDays * 2));
      const what = S_(a.v.nextStep) || S_(a.v.summary) || 'Follow-up';
      action = action || ACTION(`Überfällig: ${what.length > 60 ? what.slice(0, 57) + '…' : what}`, contactKind, `Fällig seit ${C.displayDate(f.overdueFu.length ? a.v.fuDate : day(a.v.todoDue))}.`);
    } else if (f.todayFu.length) {
      push('dueToday', 'Follow-up heute fällig');
      action = action || ACTION('Follow-up von heute erledigen', contactKind, S_(f.todayFu[0].v.nextStep) || 'Heute fällig.');
    }
    const propDay = day(v.proposalDate);
    if ((f.stage === 'Proposal Sent' || f.stage === 'Negotiation') && C.isDate(propDay)) {
      const d = C.daysBetween(propDay, today), contactedSince = f.lastDay && f.lastDay > propDay;
      if (d >= 5 && !contactedSince) { push('proposal', `Angebot seit ${d} Tagen ohne Kontakt`); action = action || ACTION('Angebot nachfassen', contactKind, `Angebot vom ${C.displayDate(propDay)}, seitdem kein Kontakt.`, { tplId: 'de-nach-angebot', playbookId: 'angebot' }); }
    }
    const drDay = day(v.draftsSent);
    if (f.stage === 'Drafts Sent' && C.isDate(drDay) && C.isEmpty(v.draftsFeedback)) {
      const d = C.daysBetween(drDay, today), heard = f.lastIn && day(f.lastIn.v.at) > drDay;
      if (d >= 3 && !heard) { push('drafts', `Entwürfe seit ${d} Tagen ohne Feedback`); action = action || ACTION('Feedback zu den Entwürfen einholen', contactKind, `Entwürfe am ${C.displayDate(drDay)} gesendet, noch keine Reaktion.`, { tplId: 'de-nach-entwurf', playbookId: 'entwuerfe' }); }
    }
    if (f.stalled) { push('stalled', `Seit ${f.sinceMove} Tagen keine Bewegung (Grenze ${f.stalledDays})`); action = action || ACTION('Deal wiederbeleben', contactKind, `Seit ${f.sinceMove} Tagen weder Kontakt noch Phasenwechsel. Vorschlag: neuen Anlass nennen (z. B. angepasster Entwurf) oder klar fragen, ob das Thema noch aktuell ist.`, { tplId: f.stage === 'Proposal Sent' ? 'de-nach-angebot-kurz' : 'de-reengage', playbookId: suggestPlaybook(v, acts, today, settings).id }); }
    if (f.status === 'active' && !f.openTodos.length && !f.openFu.length) { push('noNext', 'Kein offenes To-do und kein Follow-up'); action = action || ACTION('Nächsten Schritt festlegen', 'task', 'Aktiver Prozess ohne nächsten Schritt – sonst gerät er in Vergessenheit.'); }
    if (f.stage === 'Contact Made' && !f.awaitingReply && f.unanswered >= 1 && f.daysSince !== null && f.daysSince >= 4 && !f.openFu.length) {
      push('nudge', `${f.unanswered} Kontaktversuch${f.unanswered === 1 ? '' : 'e'} ohne Antwort, letzter vor ${f.daysSince} Tagen`);
      const tpl = f.unanswered <= 1 ? 'de-fu1' : f.unanswered === 2 ? 'de-fu2' : 'de-fu-final';
      action = action || ACTION(f.unanswered >= 3 ? 'Letzter Versuch, dann abschließen' : 'Nachfassen', f.unanswered >= 2 && f.hasPhone ? 'call' : (f.hasEmail ? 'mail' : contactKind), `Letzter Kontaktversuch vor ${f.daysSince} Tagen, keine Antwort.`, { tplId: tpl, playbookId: 'nach-mail' });
    }
    if (f.status === 'won' && f.daysSince !== null && f.daysSince >= 60) { push('customer', `Kunde, letzter Kontakt vor ${f.daysSince} Tagen`); action = action || ACTION('Check-in beim Kunden', contactKind, `Seit ${f.daysSince} Tagen kein Kontakt mit diesem Kunden.`, { tplId: 'de-checkin', playbookId: 'bestandskunde' }); }
    if (f.stage === 'Cold' && !f.contactCount) {
      const isNew = C.isDate(f.createdDay) && C.daysBetween(f.createdDay, today) <= 7;
      if (isNew) push('newLead', 'Neuer Lead (letzte 7 Tage)');
      action = action || ACTION('Erstkontakt aufnehmen', f.hasEmail ? 'mail' : contactKind, 'Noch kein Kontakt erfasst.', { playbookId: 'kaltakquise' });
    }
    if (f.stage === 'Closed Lost' && f.daysSince !== null && f.daysSince >= 180) action = action || ACTION('Reaktivierung prüfen', contactKind, `Verloren, letzter Kontakt vor ${f.daysSince} Tagen.`, { tplId: 'de-reengage', playbookId: 'reaktivierung' });
    if (!f.hasPhone && !f.hasEmail) action = action || ACTION('Kontaktdaten ergänzen', 'edit', 'Weder Telefon noch E-Mail erfasst.');
    // Verstärker (keine eigene Aktion)
    if (factors.length) {
      if (f.stage === 'Proposal Sent' || f.stage === 'Negotiation') push('stageLate', 'Späte Phase');
      else if (['Drafts Sent', 'Qualified', 'Discovery Call Booked', 'Discovery Completed'].includes(f.stage)) push('stageMid', 'Mittlere Phase');
      if (S_(v.procPrio) === 'Hoch' && f.status === 'active') push('prioHigh', 'Priorität „Hoch“');
      const val = [v.dealValue, v.proposalAmount].find(x => typeof x === 'number' && x > 0);
      if (val && f.status === 'active') push('value', 'Auftragswert ' + C.fmtAmount(val));
    }
    const score = factors.reduce((s, x) => s + x.pts, 0);
    return { score, action: action || ACTION('Nichts Dringendes', 'none', 'Keine offenen Signale.'), factors, facts: f };
  }

  /* ---------------------------------------------------------------------------
   * 6. Beziehungsstatus (Fakten + abgeleitete Einschätzung, Regeln offen sichtbar)
   * ------------------------------------------------------------------------- */
  function relationshipHealth(v, acts, today, settings) {
    today = today || C.todayBerlin();
    const f = factsOf(v, acts, today, settings);
    const coldDays = C.settingNum(settings, 'Going cold days', 21);
    const sig = [];
    if (!f.contactCount) return { level: 'none', label: 'Noch kein Kontakt', signals: [{ ok: null, text: 'Noch keine Interaktion erfasst.' }], rule: 'Ohne erfasste Interaktion gibt es keine Einschätzung.' };
    sig.push({ ok: f.daysSince <= coldDays, text: `Letzter Kontakt vor ${f.daysSince} Tag${f.daysSince === 1 ? '' : 'en'} (${C.displayDate(f.lastDay)})` });
    sig.push({ ok: f.interactions90 >= 2, text: `${f.interactions90} Interaktion${f.interactions90 === 1 ? '' : 'en'} in 90 Tagen` });
    if (f.idx >= 2) sig.push({ ok: f.inbound90 >= 1, text: f.inbound90 ? `${f.inbound90} Reaktion${f.inbound90 === 1 ? '' : 'en'} von ihnen in 90 Tagen` : 'Keine Reaktion von ihnen in 90 Tagen' });
    const ov = f.overdueFu.length + f.overdueTodos.length;
    sig.push({ ok: ov === 0, text: ov ? `${ov} Zusage${ov === 1 ? '' : 'n'} überfällig (seit ${f.maxOverdueDays} Tagen)` : 'Keine überfälligen Zusagen' });
    if (f.unanswered >= 2) sig.push({ ok: f.unanswered < 3, text: `${f.unanswered} Kontaktversuche in Folge ohne Antwort` });
    if (f.awaitingReply) sig.push({ ok: f.daysSinceIn <= 2, text: `Ihre letzte Nachricht (${C.displayDate(day(f.lastIn.v.at))}) ist noch unbeantwortet` });
    if (f.status === 'active') sig.push({ ok: !f.stalled, text: f.stalled ? `Seit ${f.sinceMove} Tagen keine Bewegung im Prozess` : `Prozess bewegt sich (seit ${f.daysInStage ?? '?'} Tagen in „${f.stage}“)` });
    const risk = (ov && f.maxOverdueDays > 7) || f.stalled || (f.idx >= 2 && f.status !== 'lost' && f.daysSince > 60) || (f.awaitingReply && f.daysSinceIn > 7);
    const watch = sig.some(s => s.ok === false);
    const level = risk ? 'risk' : watch ? 'watch' : 'good';
    return { level, label: { risk: 'Gefährdet', watch: 'Aufmerksamkeit nötig', good: 'Stabil' }[level], signals: sig,
      rule: `Gefährdet: Zusage über 7 Tage überfällig, Prozess im Stillstand, Antwort über 7 Tage offen oder ab „Replied“ über 60 Tage ohne Kontakt. Aufmerksamkeit: ein Signal ist negativ (z. B. über ${coldDays} Tage ohne Kontakt). Sonst stabil.` };
  }

  /* ---------------------------------------------------------------------------
   * 7. Anruf-Zusammenfassung und Auswertungen
   * ------------------------------------------------------------------------- */
  /** Nur aus Eingaben gebaut – erfindet nichts. Unbeantwortete Fragen tauchen nicht auf. */
  function callSummary(x) {
    const L = [];
    const mins = x.seconds ? Math.max(1, Math.round(x.seconds / 60)) : 0;
    L.push(`Anruf${x.playbook ? ' (Leitfaden: ' + x.playbook + ')' : ''}${mins ? `, ca. ${mins} Min.` : ''}${x.outcome ? '. Ergebnis: ' + x.outcome : ''}.`);
    const notes = S_(x.notes); if (notes) L.push('', notes);
    const qa = (x.answers || []).filter(a => S_(a.a));
    if (qa.length) { L.push('', 'Geklärt:'); for (const a of qa) L.push(`• ${S_(a.q)} – ${S_(a.a)}`); }
    const asked = (x.answers || []).filter(a => !S_(a.a) && a.asked);
    if (asked.length) L.push('', 'Angesprochen: ' + asked.map(a => S_(a.q)).join(' / '));
    if ((x.objections || []).length) L.push('', 'Einwände: ' + x.objections.join(', '));
    if ((x.actions || []).length) { L.push('', 'Vereinbart:'); for (const a of x.actions) L.push('• ' + S_(a)); }
    if (x.meetingAt) L.push('', 'Termin: ' + fmtMeeting(x.meetingAt, 'de'));
    if (x.fuDate) L.push('', 'Follow-up: ' + (WD_LONG[C.weekday(x.fuDate)] || '') + ', ' + C.displayDate(x.fuDate));
    return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  /** Wie oft welcher Einwand vorkam (aus der Spalte „Objections“ der Aktivitäten). */
  function objectionStats(activities, sinceYmd) {
    const map = new Map();
    for (const a of activities || []) {
      const raw = S_(a.v.objections); if (!raw) continue;

/* ----- Abgeleitete Listen ---------------------------------------------- */
function haystack(c) {

    App._hay.set(c, s);

}
function filterContacts() {
  const f = App.ui.filters, q = App.ui.search.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  const bands = S().bands;
  let list = visibleContacts().filter(c => {
    const v = c.v;
    if (f.category && v.category !== f.category) return false;
    if (f.stage) {
      if (f.stage === '__open' ? !C.isActiveStage(v) : C.stageOf(v) !== f.stage) return false;
    }
    const dnc = C.isFlagYes(v.dnc);

    if (f.dnc === 'only' && !dnc) return false;
    if (f.fuFor && v.followUpFor !== f.fuFor) return false;
    if (f.noFu && v.nextFollowUp) return false;
    if (f.owner === '__none' && v.owner) return false;

    if (f.webCat === '__none' && v.webCat) return false;

    if (terms.length) { const s = haystack(c); for (const t of terms) if (!s.includes(t)) return false; }

  });
  const { key, dir } = App.ui.sort;
  const val = c => {

  list.sort((a, b) => { const x = val(a), y = val(b); if (x === y) return 0; if (x === '' || x === -1) return 1; if (y === '' || y === -1) return -1; return (x < y ? -1 : 1) * dir; });

}
/** Offene Follow-ups (Aktivitäten) mit Fälligkeit bis `untilYmd`. */
function openFollowUps(untilYmd, onlyMine) {

function goingCold() {

function duplicatesFor(v, exceptId) {

/* =============================================================================
 * APP – Teil 2: Dateien (Ordnerzugriff, Laden, sicheres Speichern mit Merge,
 *               Abgleich mit Änderungen der anderen, Backups, Konfliktkopien)
 *
 * Ablauf beim Speichern (siehe auch docs/what-can-go-wrong.md):
 *   1. aktuelle Datei von der Platte lesen (kann neuer sein als mein Stand)
 *   2. falls neuer: meine Änderungen per Drei-Wege-Merge darauf anwenden,
 *      echte Konflikte im Dialog klären
 *   3. Backup der Version anlegen, die gleich ersetzt wird (lokaler Backup-Ordner)
 *   4. unmittelbar vor dem Schreiben prüfen, ob sich die Datei inzwischen
 *      wieder geändert hat -> dann von vorn
 *   5. schreiben (Chrome schreibt in eine .crswap-Datei und ersetzt die
 *      Originaldatei erst beim Abschluss – nie halb geschrieben)
 *   6. zurücklesen und vergleichen
 * ===========================================================================*/
const FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';

class UserCancelled extends Error {}
/** Kurzes Ereignisprotokoll (nur im Speicher, für Fehlersuche: CRMDebug.log()). */
const DEBUG_LOG = [];
function debugLog(kind, data) { DEBUG_LOG.push({ t: new Date().toISOString().slice(11, 23), kind, ...data }); if (DEBUG_LOG.length > 300) DEBUG_LOG.shift(); }
function errName(e) { return (e && e.name) || ''; }

function explainFsError(e, what) {
  const n = errName(e);
  if (n === 'NotAllowedError' || n === 'SecurityError') return { text: `Kein Zugriff mehr auf den Ordner (${what}). Bitte den Zugriff erneut erlauben.`, perm: true };
  if (n === 'NoModificationAllowedError') return { text: 'Die Datei ist gesperrt – vermutlich ist sie in Excel geöffnet. Excel schließen, dann erneut auf „Speichern“ klicken.' };
  if (n === 'NotFoundError') return { text: `${DATA_FILE} wurde im CRM-Ordner nicht gefunden. Wurde sie verschoben oder umbenannt?`, notFound: true };
  if (n === 'NotReadableError') return { text: 'Die Datei konnte nicht gelesen werden. Ist sie nur in der Cloud gespeichert (nicht heruntergeladen) oder von einem anderen Programm gesperrt? Im Finder/Explorer „Immer auf diesem Gerät behalten“ wählen.' };
  if (n === 'QuotaExceededError') return { text: 'Auf dem Datenträger ist kein Platz mehr frei.' };
  if (n === 'InvalidStateError') return { text: 'Die Datei hat sich während des Zugriffs verändert. Bitte erneut versuchen.' };
  if (e instanceof C.XlsxError) return { text: e.message };
  return { text: (e && e.message) || String(e) };
}

/* ----- Ordner wählen / Zugriff ------------------------------------------ */
async function hasPermission(handle, ask) {
  if (!handle) return false;

  try {
    if ((await handle.queryPermission(o)) === 'granted') return true;
    if (ask) return (await handle.requestPermission(o)) === 'granted';
  } catch (_) { /* Handle ungültig */ }
  return false;
}
async function pickFolder(id, startIn) {
  try { return await window.showDirectoryPicker({ id, mode: 'readwrite', startIn }); }
  catch (e) { if (errName(e) === 'AbortError') throw new UserCancelled(); throw e; }
}
async function listNames(dir) { const names = []; for await (const [name] of dir.entries()) names.push(name); return names; }
async function scanFolder() {
  if (!App.dir) return App.folderInfo;
  try { App.folderInfo = C.classifyFolder(await listNames(App.dir), DATA_FILE); } catch (_) { /* später erneut */ }
  return App.folderInfo;
}
async function readDataFile() {
  const f = await App.file.getFile();
  const buf = await f.arrayBuffer();
  return { bytes: new Uint8Array(buf), lastModified: f.lastModified, size: f.size };
}
async function writeBytes(handle, bytes) {

  catch (e) { try { await w.abort(); } catch (_) { /* egal */ } throw e; }

/* ----- Laden ------------------------------------------------------------ */
function stateOf(loaded) { return { contacts: loaded.contacts, activities: loaded.activities, settings: loaded.settings }; }
function applyLoaded(loaded, meta) {
  App.loaded = loaded;
  App.base = stateOf(loaded);
  App.work = cloneState(App.base);
  App.meta = meta;
  App.dirty = false;
  App.pendingConflict = false;
  App.readOnlyReasons = loaded.problems.filter(p => p.level === 'fatal');
  reindex();
}

/* ----- Speichern ---------------------------------------------------------- */
const scheduleSave = debounce(() => saveNow(), 700);
function formOpen() { return $$('dialog[open]').some(d => d.dataset.form === '1'); }
function allMine(conflicts) { const r = {}; for (const c of conflicts) r[`${c.coll}|${c.key}|${c.kind === 'field' ? c.field : '*'}`] = 'mine'; return r; }

/**
 * Eigene Speicherungen, die die Synchronisierung "verschluckt" hat, wieder auf `theirs` anwenden.
 * App.journal enthält meine letzten Speicherungen ({ id, P, W }); eine Speicherung gilt als
 * bestätigt, sobald eine Datei auftaucht, deren Versionskette ihre Kennung enthält.
 * Rückgabe: { state, lost } oder null (Nutzer hat den Konflikt-Dialog abgebrochen).
 */
async function reapplyLostWrites(theirs) {
  let state = stateOf(theirs);
  const unacked = C.unackedWrites(App.journal, theirs.settings);
  if (!unacked.length) return { state, lost: 0 };
  for (const e of unacked) {
    const res = {};
    let m = C.mergeAll(e.P, e.W, state, res);
    if (m.conflicts.length) {
      const r = await conflictDialog(m.conflicts, theirs, { lost: true });
      if (!r) return null;
      Object.assign(res, r);
      m = C.mergeAll(e.P, e.W, state, res);
      if (m.conflicts.length) m = C.mergeAll(e.P, e.W, state, Object.assign(res, allMine(m.conflicts)));
    }
    state = { contacts: m.contacts, activities: m.activities, settings: m.settings };
  }
  return { state, lost: unacked.length };
}

async function saveNow(opts) {
  opts = opts || {};
  if (!App.work || !App.dirty) return true;
  if (App.mode === 'fallback') { if (opts.explicit) return saveFallback(); setStatus('dirty'); return false; }
  if (App.loaded && App.loaded.readOnly) { setStatus('readonly'); return false; }
  if (App.saving) { App.saveQueued = true; return false; }
  if (formOpen() && !opts.explicit) { App.saveAfterForm = true; return false; }   // nie speichern, während jemand tippt
  App.saving = true; setStatus('saving');
  const before = App.base;
  try {
    const mine = cloneState(App.work);
    const mutAt = App.mutations;
    const resolutions = {};
    for (let attempt = 0; attempt < 4; attempt++) {
      if (!(await hasPermission(App.dir, !!opts.gesture))) { const e = new Error('perm'); e.name = 'NotAllowedError'; throw e; }
      const disk = await readDataFile();
      const diskHash = await sha256(disk.bytes);
      const unchanged = diskHash === App.meta.hash;
      const theirs = unchanged ? App.loaded : C.loadWorkbook(disk.bytes);
      if (theirs.readOnly) throw new Error('Die Datei auf der Platte hat inzwischen Strukturprobleme (' + theirs.problems.map(p => p.message).join(' ') + ') Deine Änderungen sind nicht gespeichert, bleiben aber hier erhalten.');
      let result, parent = stateOf(theirs), lost = 0;
      if (unchanged) result = mine;
      else {
        // 1) eigene, durch einen Sync-Konflikt verlorene Speicherungen wieder einspielen
        const re = await reapplyLostWrites(theirs);
        if (!re) { App.pendingConflict = true; setStatus('error', 'Nicht gespeichert: Konflikt offen'); return false; }
        parent = re.state; lost = re.lost;
        // 2) meine ungespeicherten Änderungen darauf anwenden
        let m = C.mergeAll(App.base, mine, parent, resolutions);
        if (m.conflicts.length) {
          setStatus('saving', 'Konflikt …');
          const r = await conflictDialog(m.conflicts, theirs);
          if (!r) { App.pendingConflict = true; setStatus('error', 'Nicht gespeichert: Konflikt offen'); return false; }
          Object.assign(resolutions, r);
          m = C.mergeAll(App.base, mine, parent, resolutions);
          if (m.conflicts.length) { Object.assign(resolutions, allMine(m.conflicts)); m = C.mergeAll(App.base, mine, parent, resolutions); }
        }
        result = { contacts: m.contacts, activities: m.activities, settings: m.settings };
      }
      // Excel/LibreOffice hat die Datei auf DIESEM Rechner offen?
      const fi = await scanFolder();
      if (fi.lockFiles.length && !opts.ignoreLock) {
        const go = await confirmDialog({ title: 'Datei ist in Excel geöffnet', danger: false,
          body: `Im CRM-Ordner liegt die Sperrdatei „${esc(fi.lockFiles[0])}“. Die Datei ist also in Excel oder LibreOffice geöffnet. Wenn du jetzt speicherst und danach in Excel speicherst, überschreibt Excel deine Änderungen.<br><br><b>Empfehlung:</b> Excel schließen und dann speichern. (War Excel abgestürzt, kann die Sperrdatei veraltet sein.)`,
          ok: 'Trotzdem speichern', cancel: 'Abbrechen' });
        if (!go) { setStatus('error', 'Nicht gespeichert: Datei in Excel geöffnet'); App.lastError = { text: 'Excel schließen, dann auf „Speichern“ klicken.' }; return false; }
        opts.ignoreLock = true;
      }
      const version = C.nextVersion(theirs.settings);
      result.settings = C.stampVersion(result.settings, version, App.identity, C.nowBerlin());
      C.computeAuto(result.contacts, result.activities);
      const out = C.writeWorkbook(theirs, result);
      // Backup der Fassung, die gleich ersetzt wird – sofern sie nicht ohnehin meine letzte Speicherung ist
      const diskVersion = C.versionInfo(theirs.settings).id;
      if (!App.journal.some(e => e.id === diskVersion)) await makeBackup(disk.bytes, opts, theirs.settings.kv['Last saved by'] || 'unbekannt');
      const again = await App.file.getFile();
      if (again.lastModified !== disk.lastModified || again.size !== disk.size) continue;   // inzwischen geändert -> neu mergen
      await writeBytes(App.file, out.bytes);
      const outHash = await sha256(out.bytes);
      // Backup auch der neuen Fassung: geht sie später in einem Sync-Konflikt unter, liegt sie hier.
      await makeBackup(out.bytes, Object.assign(opts, { quiet: true }), App.identity).catch(() => {});
      const check = await readDataFile();
      const checkHash = await sha256(check.bytes);
      if (checkHash !== outHash) toast('Hinweis: Die Datei wurde direkt nach dem Speichern erneut verändert (vermutlich durch die Synchronisierung). Das Tool gleicht beim nächsten Abruf ab.');
      const written = C.loadWorkbook(out.bytes);
      const changes = unchanged ? [] : C.describeChanges(before, stateOf(theirs));
      // Journal nur gegen FREMDE Fassungen kürzen: Dass meine eigene Folge-Speicherung eine frühere enthält,
      // schützt nicht davor, dass die Synchronisierung beide durch eine Parallelfassung ersetzt.
      const theirsId = C.versionInfo(theirs.settings).id;
      const foreign = !App.journal.some(e => e.id === theirsId);
      App.journal = (foreign ? C.unackedWrites(App.journal, theirs.settings) : App.journal).concat([{ id: version.id, P: parent, W: stateOf(written) }]).slice(-20);
      debugLog('save', { v: version.id, parent: C.versionInfo(theirs.settings).id, unchanged, lost, journal: App.journal.map(e => e.id) });
      App.loaded = written; App.base = stateOf(written);
      App.meta = { lastModified: checkHash === outHash ? check.lastModified : 0, size: checkHash === outHash ? check.size : -1, hash: outHash };
      if (App.mutations === mutAt) { App.work = cloneState(App.base); App.dirty = false; }
      else {                                                          // während des Speicherns weitergearbeitet
        let rb = C.mergeAll(mine, App.work, App.base);
        if (rb.conflicts.length) rb = C.mergeAll(mine, App.work, App.base, allMine(rb.conflicts));
        App.work = { contacts: rb.contacts, activities: rb.activities, settings: rb.settings };
        App.saveQueued = true;
      }
      App.pendingConflict = false; App.lastError = null; App.syncLost = false;
      reindex();
      if (changes.length) recordChanges(changes, theirs);
      if (lost) toast(`Sync-Konflikt erkannt: ${lost === 1 ? 'Eine frühere Speicherung' : lost + ' frühere Speicherungen'} von dir fehlte${lost === 1 ? '' : 'n'} in der Datei und wurde${lost === 1 ? '' : 'n'} wieder eingespielt.`, { ms: 10000 });
      App.lastSavedAt = new Date();
      setStatus(App.dirty ? 'dirty' : 'saved');
      if (out.warnings.length) noteWriteWarnings(out.warnings);
      pruneBackups().catch(() => {});
      renderAll();
      return true;
    }
    throw new Error('Die Datei hat sich während des Speicherns mehrfach verändert (viel Betrieb oder Synchronisierung). Bitte gleich noch einmal speichern.');
  } catch (e) {
    if (e instanceof UserCancelled) { setStatus('error', 'Nicht gespeichert'); return false; }
    const x = explainFsError(e, 'CRM-Ordner');
    App.lastError = x;
    setStatus('error', 'Nicht gespeichert');
    renderBanners();
    console.error(e);
    return false;
  } finally {
    App.saving = false;
    if (App.saveQueued) { App.saveQueued = false; scheduleSave(); }
  }
}
function noteWriteWarnings(ws) {
  const txt = { sharedChild: 'Geteilte Formeln in Zusatzspalten wurden in Werte umgewandelt.', arrayToValue: 'Matrixformeln in Zusatzspalten wurden in Werte umgewandelt.', dataTableToValue: 'Datentabellen-Formeln wurden in Werte umgewandelt.', calcChainRemoved: 'Die Excel-Berechnungskette wurde entfernt (Excel baut sie neu auf).' };
  const msgs = ws.map(w => txt[w]).filter(Boolean);
  if (msgs.length) toast(msgs.join(' '), { ms: 9000 });
}

/* ----- Fallback: Datei öffnen / herunterladen --------------------------- */
async function openFallbackFile(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const loaded = C.loadWorkbook(bytes);
  App.mode = 'fallback'; App.fallbackName = file.name;
  applyLoaded(loaded, { lastModified: file.lastModified, size: file.size, hash: await sha256(bytes) });
  setStatus(loaded.readOnly ? 'readonly' : 'saved', 'Geöffnet ' + hhmm());

}
async function saveFallback() {
  try {
    const result = cloneState(App.work);
    result.settings = C.stampVersion(result.settings, C.nextVersion(App.loaded.settings), App.identity, C.nowBerlin());
    C.computeAuto(result.contacts, result.activities);

    const written = C.loadWorkbook(out.bytes);

    setStatus('saved', 'Heruntergeladen ' + hhmm());
    toast('Excel-Datei heruntergeladen. Jetzt in den CRM-Ordner kopieren und die alte Datei ersetzen.', { ms: 12000 });
    renderAll();
    return true;
  } catch (e) { App.lastError = explainFsError(e, 'Datei'); setStatus('error', 'Nicht gespeichert'); renderBanners(); return false; }
}

/* ----- Änderungen der anderen abholen ----------------------------------- */
function recordChanges(changes, theirs) {
  const who = theirs.settings.kv['Last saved by'] || '';
  const at = theirs.settings.kv['Last saved at'] || '';
  for (const ch of changes) App.changesByOthers.unshift({ ...ch, seenAt: hhmm(), savedBy: who });
  App.changesByOthers = App.changesByOthers.slice(0, 30);
  if (App.dirty || App.saving) { if (!App.saving) setStatus('dirty', `Ungespeichert – neue Daten von ${who || 'anderen'} eingespielt`); return; }
  if (who && who !== App.identity) setStatus('updated', `Aktualisiert von ${who}` + (at ? ' um ' + C.displayDate(at).slice(-5) : ''));
  else setStatus('updated', 'Aktualisiert ' + hhmm());
}
let pollTimer = null, polling = false;
function pollSeconds() { return Math.max(2, Number(qs.get('poll')) || C.settingNum(S(), 'Poll seconds', 20)); }
function startPolling() { clearInterval(pollTimer); pollTimer = setInterval(poll, pollSeconds() * 1000); }
async function poll() {
  if (App.mode !== 'fs' || !App.file || App.saving || polling || window.__CRM_NO_POLL) return;   // __CRM_NO_POLL: nur für automatische Tests
  polling = true;
  try {
    if ((await App.dir.queryPermission({ mode: 'readwrite' })) !== 'granted') { App.lastError = { text: 'Der Zugriff auf den CRM-Ordner ist abgelaufen.', perm: true }; setStatus('error', 'Kein Zugriff'); renderBanners(); return; }
    const prevFolder = JSON.stringify(App.folderInfo);
    await scanFolder();
    if (JSON.stringify(App.folderInfo) !== prevFolder) renderBanners();
    const f = await App.file.getFile();
    if (f.lastModified === App.meta.lastModified && f.size === App.meta.size) return;
    const bytes = new Uint8Array(await f.arrayBuffer());
    const hash = await sha256(bytes);
    if (hash === App.meta.hash) { App.meta.lastModified = f.lastModified; App.meta.size = f.size; return; }
    if (App.saving) return;
    const theirs = C.loadWorkbook(bytes);
    if (theirs.readOnly) { App.lastError = { text: 'Die CRM-Datei wurde von außen verändert und hat jetzt Strukturprobleme: ' + theirs.problems.map(p => p.message).join(' ') + ' Das Tool speichert nicht, bis das behoben ist.' }; setStatus('error', 'Datei beschädigt'); renderBanners(); return; }
    const meta = { lastModified: f.lastModified, size: f.size, hash };
    debugLog('poll', { theirs: C.versionInfo(theirs.settings).id, hist: C.versionInfo(theirs.settings).history.slice(0, 6), unacked: C.unackedWrites(App.journal, theirs.settings).map(e => e.id), dirty: App.dirty });
    if (C.unackedWrites(App.journal, theirs.settings).length) {
      // Die Synchronisierung hat meine letzte Speicherung durch eine parallele Fassung ersetzt.
      // Nicht einfach übernehmen (dann wären meine Einträge weg), sondern beim Speichern zusammenführen.
      App.syncLost = true; App.dirty = true; App.mutations++;
      setStatus('dirty', 'Sync-Konflikt erkannt – wird zusammengeführt');
      scheduleSave();
      return;
    }
    App.journal = [];
    const changes = C.describeChanges(App.base, stateOf(theirs));
    if (!App.dirty) applyLoaded(theirs, meta);
    else {
      const m = C.mergeAll(App.base, App.work, stateOf(theirs));
      if (m.conflicts.length) { App.pendingConflict = true; setStatus('dirty', 'Neue Daten von anderen – Konflikt wird beim Speichern geklärt'); renderBanners(); return; }
      App.loaded = theirs; App.base = stateOf(theirs); App.meta = meta;
      App.work = { contacts: m.contacts, activities: m.activities, settings: m.settings };
      reindex();
    }
    if (App.lastError && App.lastError.external) App.lastError = null;
    recordChanges(changes, theirs);
    renderAll();
  } catch (e) {
    if (errName(e) === 'NotFoundError') { App.lastError = explainFsError(e); setStatus('error', 'Datei fehlt'); renderBanners(); }
    else console.warn('Abgleich fehlgeschlagen', e);
  } finally { polling = false; }
}

/* ----- Backups ------------------------------------------------------------ */
async function makeBackup(bytes, opts, who) {
  opts = opts || {};
  if (!App.backupDir || !(await hasPermission(App.backupDir, !!opts.gesture))) {
    if (opts.skipBackup || opts.quiet) return;
    const go = await confirmDialog({ title: 'Backup nicht möglich', body: 'Auf den Backup-Ordner besteht gerade kein Zugriff. Ohne Backup speichern?<br><br>Empfehlung: Abbrechen, oben auf „Zugriff erlauben“ klicken und erneut speichern.', ok: 'Ohne Backup speichern', cancel: 'Abbrechen' });
    if (!go) throw new UserCancelled();
    opts.skipBackup = true; return;
  }
  let name = C.backupFileName(DATA_FILE, new Date(), who || App.identity);
  for (let i = 2; i < 50; i++) {
    try { await App.backupDir.getFileHandle(name); name = name.replace(/(\.\d+)?\.xlsx$/, `.${i}.xlsx`); } catch (_) { break; }
  }
  const fh = await App.backupDir.getFileHandle(name, { create: true });
  await writeBytes(fh, bytes);
  App.lastBackup = { name, at: hhmm() };
}
async function listBackups() {
  const out = [];
  if (!App.backupDir) return out;
  for await (const [name, handle] of App.backupDir.entries()) {
    if (handle.kind !== 'file') continue;
    const p = C.parseBackupName(name, DATA_FILE); if (!p) continue;
    let size = 0; try { size = (await handle.getFile()).size; } catch (_) { /* ignorieren */ }
    out.push({ ...p, size, handle });
  }
  return out.sort((a, b) => b.stamp.localeCompare(a.stamp));
}
async function pruneBackups() {
  if (!App.backupDir || !(await hasPermission(App.backupDir, false))) return;
  const st = S();
  const list = await listBackups();
  const del = C.selectBackupsToDelete(list, { keep: C.settingNum(st, 'Backups to keep', 30), days: C.settingNum(st, 'Backup days to keep', 14), maxBytes: C.settingNum(st, 'Backup max MB', 500) * 1024 * 1024, today: C.todayBerlin() });
  for (const name of del) { try { await App.backupDir.removeEntry(name); } catch (_) { /* nächstes Mal */ } }
}
async function restoreBackup(entry) {
  const bytes = new Uint8Array(await (await entry.handle.getFile()).arrayBuffer());
  const L = C.loadWorkbook(bytes);
  if (L.readOnly) { await infoDialog('Backup nicht verwendbar', 'Dieses Backup hat Strukturprobleme: ' + esc(L.problems.map(p => p.message).join(' '))); return; }
  const cur = { c: visibleContacts().length, a: App.work.activities.length };
  const ok = await confirmDialog({ title: 'Backup wiederherstellen?', danger: true,
    body: `Backup vom <b>${esc(C.displayDate(entry.stamp))}</b> (${esc(entry.who)}): ${plural(L.contacts.length, 'Kontakt', 'Kontakte')}, ${plural(L.activities.length, 'Aktivität', 'Aktivitäten')}.<br>Aktuell: ${plural(cur.c, 'Kontakt', 'Kontakte')}, ${plural(cur.a, 'Aktivität', 'Aktivitäten')}.<br><br>Die gemeinsame Datei wird durch das Backup ersetzt – <b>für alle drei</b>. Alles, was seitdem gespeichert wurde (auch von den anderen), ist danach nur noch im Backup der aktuellen Version enthalten, das vorher automatisch angelegt wird.` + (App.dirty ? '<br><br><b>Deine ungespeicherten Änderungen gehen verloren.</b>' : ''),
    ok: 'Wiederherstellen', cancel: 'Abbrechen' });
  if (!ok) return;
  try {
    if (!(await hasPermission(App.dir, true))) throw Object.assign(new Error('perm'), { name: 'NotAllowedError' });
    const disk = await readDataFile();
    const cur = C.loadWorkbook(disk.bytes);
    await makeBackup(disk.bytes, { gesture: true }, cur.settings.kv['Last saved by'] || 'unbekannt');
    // Als neue Fassung kennzeichnen, die auf dem aktuellen Stand aufbaut – sonst würden die Tools der
    // anderen ihre letzten Speicherungen als "verloren" erkennen und wieder einspielen.
    const st = stateOf(L);
    st.settings = C.stampVersion(L.settings, C.nextVersion(cur.settings), App.identity, C.nowBerlin());
    await writeBytes(App.file, C.writeWorkbook(L, st).bytes);
    App.journal = [];
    const d = await readDataFile();
    applyLoaded(C.loadWorkbook(d.bytes), { lastModified: d.lastModified, size: d.size, hash: await sha256(d.bytes) });
    setStatus('saved', 'Wiederhergestellt ' + hhmm());
    toast('Backup wiederhergestellt. Die vorherige Version liegt als Backup im Backup-Ordner.');
    renderAll();
  } catch (e) { await infoDialog('Wiederherstellen fehlgeschlagen', esc(explainFsError(e, 'CRM-Ordner').text)); }
}
async function downloadCurrentFile() {
  try { const d = await readDataFile(); download(C.backupFileName(DATA_FILE, new Date(), App.identity), d.bytes); }
  catch (e) { toast(explainFsError(e).text, { error: true }); }
}

/* ----- Konfliktkopien ------------------------------------------------------ */
async function loadCopy(name) {
  const fh = await App.dir.getFileHandle(name);
  const bytes = new Uint8Array(await (await fh.getFile()).arrayBuffer());
  return { bytes, loaded: C.loadWorkbook(bytes), handle: fh };
}
function compareWithCopy(copy) {
  const out = { contactsOnlyCopy: [], contactsDiff: [], activitiesOnlyCopy: [], contactsOnlyMain: 0 };
  const mainC = new Map(App.work.contacts.map(c => [c.key, c]));
  const mainA = new Set(App.work.activities.map(a => a.key));
  const copyC = new Set(copy.contacts.map(c => c.key));
  for (const c of copy.contacts) {
    if (c.ghost || c.dup) continue;
    const m = mainC.get(c.key);
    if (!m) { out.contactsOnlyCopy.push(c); continue; }
    const fields = C.MERGE_FIELDS.contacts.filter(f => !C.valuesEqual(m.v[f], c.v[f]));
    if (fields.length) out.contactsDiff.push({ main: m, copy: c, fields });
  }
  for (const a of copy.activities) if (!a.ghost && !a.dup && !mainA.has(a.key)) out.activitiesOnlyCopy.push(a);
  out.contactsOnlyMain = App.work.contacts.filter(c => !copyC.has(c.key)).length;
  return out;
}
async function archiveCopy(name, bytes) {
  if (!App.backupDir || !(await hasPermission(App.backupDir, true))) throw new Error('Kein Zugriff auf den Backup-Ordner.');
  const fh = await App.backupDir.getFileHandle('konfliktkopie_' + C.backupFileName(DATA_FILE, new Date(), App.identity).replace(/\.xlsx$/, '') + '__' + name.replace(/[^\p{L}\p{N}._ -]+/gu, '_'), { create: true });
  await writeBytes(fh, bytes);
  await App.dir.removeEntry(name);
  await scanFolder();
}

/* ----- Neue Datei aus der eingebetteten Vorlage --------------------------- */
async function createFromTemplate(dir) {
  const b64 = window.__CRM_TEMPLATE_B64__;
  const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const fh = await dir.getFileHandle(DATA_FILE, { create: true });
  await writeBytes(fh, bytes);
  return fh;
}

function contactNav(id) {

  if (i >= 0 && list.length > 1) return { list, i, all: false, scope: 'Reihenfolge wie in der gefilterten Kontaktliste' };
  const f = App.ui.filters, q = App.ui.search;
  App.ui.filters = Object.fromEntries(Object.keys(f).map(k => [k, typeof f[k] === 'boolean' ? false : ''])); App.ui.search = '';
  try { list = filterContacts(); } finally { App.ui.filters = f; App.ui.search = q; }
  return { list, i: list.findIndex(c => c.v.id === id), all: true, scope: 'Reihenfolge wie in der Kontaktliste (ohne Filter)' };
}

    const canRepair = App.readOnlyReasons.every(p => p.code === 'missingColumns') && !App.readOnlyReasons.some(p => /Unbekannte Spalten/.test(p.message));

    out.push(`<div class="banner err"><span class="grow"><b>Nur lesen – die Datei wird nicht überschrieben.</b>${where} ${App.readOnlyReasons.map(p => esc(p.message)).join(' ')}</span>${canRepair && App.mode === 'fs' ? '<button class="btn sm" data-act="repair">Fehlende Spalten ergänzen</button>' : ''}${App.mode === 'fs' ? '<button class="btn sm" data-act="chdir">Anderen Ordner wählen</button>' : ''}</div>`);
  }
  if (App.lastError) out.push(`<div class="banner err"><span class="grow"><b>Nicht gespeichert.</b> ${esc(App.lastError.text)} Deine Änderungen sind noch hier im Tool${App.dirty ? '' : ''} – nicht schließen.</span>${App.lastError.perm ? '<button class="btn sm" data-act="perm">Zugriff erlauben</button>' : ''}<button class="btn sm" data-act="retry">Erneut speichern</button></div>`);
  if (App.pendingConflict && !App.lastError) out.push(`<div class="banner info"><span class="grow">Jemand anderes hat gespeichert, und ihr habt teilweise dieselben Felder geändert. Beim Speichern fragt das Tool, welche Werte gelten.</span><button class="btn sm" data-act="retry">Jetzt speichern</button></div>`);

    const a = b.dataset.act;

function gradientCss() {

function openTodoEditor(el, aid, initial) {

function tickTodo(aid) {
  const a = App.work.activities.find(x => x.key === aid); if (!a) return;
  updateActivity(aid, { todoDone: stamp() });
  toast('To-do erledigt.', { action: { label: 'Rückgängig', run: () => updateActivity(aid, { todoDone: '' }) } });
}
/** Follow-up verschieben: Tage ab heute bzw. ab Fälligkeit, „mon“ = nächster Montag, „m1“ = ein Monat. */
function snoozeTo(aid, x) {
  const a = App.work.activities.find(y => y.key === aid); if (!a) return;
  const today = C.todayBerlin(), from = a.v.fuDate < today ? today : a.v.fuDate;
  let to;
  if (x === 'mon') { to = C.addDays(today, 1); while (C.weekday(to) !== 'Mo') to = C.addDays(to, 1); }
  else if (x === 'm1') to = C.addMonths(from, 1);
  else to = C.addDays(from, Number(x) || 1);
  const old = a.v.fuDate;
  calendarWarn(a);
  updateActivity(aid, { fuDate: to });
  toast(`Verschoben auf ${C.weekday(to)}, ${C.displayDate(to)}.`, { action: { label: 'Rückgängig', run: () => updateActivity(aid, { fuDate: old }) } });
}
function snooze(aid, days) {
  const a = App.work.activities.find(x => x.key === aid); if (!a) return;
  const from = a.v.fuDate < C.todayBerlin() ? C.todayBerlin() : a.v.fuDate;
  calendarWarn(a);
  updateActivity(aid, { fuDate: C.addDays(from, days) });
  toast(`Verschoben auf ${C.displayDate(C.addDays(from, days))}.`);
}

function renderCheck(el) {
  const issues = currentIssues();

  const fatal = App.readOnlyReasons;
  const lvlName = { error: 'Fehler', warn: 'Warnung', info: 'Info' };
  const contactOf = i => {
    if (i.sheet === 'Contacts') { const c = App.work.contacts.find(x => x.key === i.key); return c && !c.ghost && !c.dup ? c.v.id : null; }
    if (i.sheet === 'Activities') { const a = App.work.activities.find(x => x.key === i.key); return a && contactById(a.v.contactId) ? a.v.contactId : null; }
    return null;
  };
  el.innerHTML = `<div class="view-head"><div><h1>Datencheck</h1><p>Prüft die Datei auf Probleme, die meist durch Bearbeiten von Hand entstehen. Nichts wird automatisch „repariert“.</p></div>

  ${fatal.length ? `<div class="alert err" style="margin-bottom:16px"><b>Strukturprobleme – Speichern gesperrt:</b> ${fatal.map(p => esc(p.message)).join(' ')}</div>` : ''}

/* Backups */
async function renderBackups(el) {
  el.innerHTML = `<div class="view-head"><div><h1>Backups</h1><p>Vor jedem Speichern legt das Tool die bisherige Datei im lokalen Backup-Ordner ab. Behalten werden die letzten ${C.settingNum(S(), 'Backups to keep', 30)} sowie je Tag das letzte der vergangenen ${C.settingNum(S(), 'Backup days to keep', 14)} Tage.</p></div>
    <div class="actions">${App.mode === 'fs' ? '<button class="btn" id="dlcur">Aktuelle Datei herunterladen</button><button class="btn" id="chbk">Backup-Ordner ändern</button>' : ''}</div></div>
    <div id="bklist" class="muted">Lade Liste …</div>
    <p class="hint" style="margin-top:16px;max-width:80ch">Zweites Sicherheitsnetz: der Versionsverlauf von SharePoint/OneDrive bzw. Google Drive. Dort lassen sich frühere Fassungen der crm-data.xlsx wiederherstellen (Anleitung, Abschnitt „Backup und Wiederherstellung“).</p>`;
  if (App.mode !== 'fs') { $('#bklist').innerHTML = '<div class="alert">Im eingeschränkten Modus gibt es keine automatischen Backups.</div>'; return; }
  $('#dlcur').onclick = downloadCurrentFile;
  $('#chbk').onclick = async () => { try { const d = await pickFolder('crm-backup'); if (await validateBackupFolder(d)) { App.backupDir = d; await IDB.set('backupDir', d); renderBackups(el); toast('Backup-Ordner geändert.'); } } catch (e) { if (!(e instanceof UserCancelled)) toast(explainFsError(e).text, { error: true }); } };
  let list = [];
  try { if (!(await hasPermission(App.backupDir, false))) throw Object.assign(new Error('x'), { name: 'NotAllowedError' }); list = await listBackups(); }
  catch (e) { $('#bklist').innerHTML = `<div class="alert err">${esc(explainFsError(e, 'Backup-Ordner').text)} <button class="btn sm" id="bkperm">Zugriff erlauben</button></div>`; $('#bkperm').onclick = async () => { if (await hasPermission(App.backupDir, true)) renderBackups(el); }; return; }
  const box = $('#bklist'); if (!box) return;
  box.className = '';
  if (!list.length) { box.innerHTML = `<div class="empty"><div><h2>Noch keine Backups</h2><p>Das erste Backup entsteht beim ersten Speichern. Ordner: „${esc(App.backupDir.name)}“.</p></div></div>`; return; }
  box.innerHTML = `<div class="panel"><table class="plain"><thead><tr><th>Zeitpunkt</th><th>Gespeichert von</th><th>Größe</th><th></th></tr></thead><tbody>${list.map((b, i) => `<tr><td>${esc(C.displayDate(b.stamp))}</td><td>${esc(b.who)}</td><td>${fmtBytes(b.size)}</td>
    <td style="text-align:right"><button class="btn sm" data-dl="${i}">Herunterladen</button> <button class="btn sm" data-restore="${i}">Wiederherstellen</button></td></tr>`).join('')}</tbody></table></div>
    <p class="hint">Ordner: „${esc(App.backupDir.name)}“, ${plural(list.length, 'Backup', 'Backups')}, zusammen ${fmtBytes(list.reduce((s, b) => s + b.size, 0))}.</p>`;
  $$('[data-dl]', box).forEach(b => b.onclick = async () => { const e = list[+b.dataset.dl]; download(e.name, await e.handle.getFile()); });
  $$('[data-restore]', box).forEach(b => b.onclick = () => restoreBackup(list[+b.dataset.restore]));
}

/* Konfliktkopien */
async function renderConflictCopies(el) {
  const copies = App.folderInfo.conflictCopies;
  el.innerHTML = `<div class="view-head"><div><h1>Konfliktkopien</h1><p>Wenn zwei Personen fast gleichzeitig speichern, legt die Synchronisierung manchmal eine zweite Datei an (z. B. mit Gerätenamen im Namen). Hier vergleichst du sie mit der Hauptdatei und übernimmst, was fehlt.</p></div></div><div id="cc"></div>`;
  const box = $('#cc');
  if (!copies.length) { box.innerHTML = '<div class="empty"><div><h2>Keine Konfliktkopien</h2><p>Im CRM-Ordner liegt nur die Hauptdatei.</p></div></div>'; return; }
  box.innerHTML = copies.map((n, i) => `<section class="panel"><h2><span class="grow">${esc(n)}</span><button class="btn sm" data-cmp="${i}">Vergleichen</button></h2><div class="body" id="cmp${i}"></div></section>`).join('');
  $$('[data-cmp]', box).forEach(b => b.onclick = async () => {
    const name = copies[+b.dataset.cmp], slot = $('#cmp' + b.dataset.cmp);
    App.ui.cmpOpen = name;     // nach Übernahmen (Neuzeichnen) wieder aufklappen
    let copy;
    try { copy = await loadCopy(name); } catch (e) { slot.innerHTML = `<div class="alert err">${esc(explainFsError(e).text)}</div>`; return; }
    if (copy.loaded.readOnly) { slot.innerHTML = `<div class="alert err">Die Kopie hat Strukturprobleme: ${esc(copy.loaded.problems.map(p => p.message).join(' '))}</div>`; return; }
    const d = compareWithCopy(copy.loaded);
    const nothing = !d.contactsOnlyCopy.length && !d.contactsDiff.length && !d.activitiesOnlyCopy.length;
    slot.innerHTML = `<p>${nothing ? '<b>Die Kopie enthält nichts, was in der Hauptdatei fehlt.</b> Du kannst sie wegräumen.' : 'Folgendes steht nur in der Kopie oder weicht ab:'}</p>
      ${d.contactsOnlyCopy.length ? `<h3>Kontakte nur in der Kopie (${d.contactsOnlyCopy.length})</h3><ul>${d.contactsOnlyCopy.map((c, i) => `<li>${esc(C.displayName(c.v))} ${esc(c.v.company)} <button class="btn sm" data-addc="${i}">Übernehmen</button></li>`).join('')}</ul>` : ''}
      ${d.contactsDiff.length ? `<h3>Abweichende Kontakte (${d.contactsDiff.length})</h3><ul>${d.contactsDiff.map((x, i) => `<li><b>${esc(C.displayName(x.main.v))}</b>: ${x.fields.map(f => `${esc(C.FIELD_LABELS[f] || f)}: Hauptdatei „${esc(String(x.main.v[f] ?? ''))}“, Kopie „${esc(String(x.copy.v[f] ?? ''))}“`).join('; ')} <button class="btn sm" data-takec="${i}">Werte der Kopie übernehmen</button></li>`).join('')}</ul>` : ''}
      ${d.activitiesOnlyCopy.length ? `<h3>Aktivitäten nur in der Kopie (${d.activitiesOnlyCopy.length})</h3><ul>${d.activitiesOnlyCopy.map((a, i) => `<li>${esc(C.displayDate(a.v.at))} ${esc(a.v.type)} – ${esc((contactById(a.v.contactId) || d.contactsOnlyCopy.find(c => c.v.id === a.v.contactId) || { v: {} }).v.lastName || a.v.contactId)}: ${esc(String(a.v.summary || '').slice(0, 80))} <button class="btn sm" data-adda="${i}">Übernehmen</button></li>`).join('')}</ul>` : ''}
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-archive>Kopie in den Backup-Ordner verschieben</button></div>`;
    $$('[data-addc]', slot).forEach(x => x.onclick = () => { const c = d.contactsOnlyCopy[+x.dataset.addc]; if (contactById(c.v.id)) return; App.work.contacts.push({ key: c.key, v: { ...c.v }, src: null }); for (const a of copy.loaded.activities) if (a.v.contactId === c.v.id && !App.work.activities.some(y => y.key === a.key)) App.work.activities.push({ key: a.key, v: { ...a.v }, src: null }); touch('aus Kopie'); x.disabled = true; x.textContent = 'Übernommen'; });
    $$('[data-takec]', slot).forEach(x => x.onclick = () => { const it = d.contactsDiff[+x.dataset.takec]; updateContact(it.main.v.id, Object.fromEntries(it.fields.map(f => [f, it.copy.v[f]]))); x.disabled = true; x.textContent = 'Übernommen'; });
    $$('[data-adda]', slot).forEach(x => x.onclick = () => { const a = d.activitiesOnlyCopy[+x.dataset.adda]; if (!contactById(a.v.contactId)) { toast('Erst den Kontakt übernehmen.', { error: true }); return; } App.work.activities.push({ key: a.key, v: { ...a.v }, src: null }); touch('aus Kopie'); x.disabled = true; x.textContent = 'Übernommen'; });
    $('[data-archive]', slot).onclick = async () => {
      if (App.dirty) { const ok = await saveNow({ explicit: true, gesture: true }); if (!ok) return; }
      if (!(await confirmDialog({ title: 'Kopie wegräumen?', body: `„${esc(name)}“ wird in den Backup-Ordner verschoben und aus dem CRM-Ordner entfernt (für alle drei, da der Ordner synchronisiert wird).`, ok: 'Verschieben' }))) return;
      try { await archiveCopy(name, copy.bytes); App.ui.cmpOpen = null; toast('Konfliktkopie weggeräumt.'); renderAll(); } catch (e) { toast(explainFsError(e).text, { error: true }); }
    };
  });
  const reopen = copies.indexOf(App.ui.cmpOpen);
  if (reopen >= 0) $(`[data-cmp="${reopen}"]`, box).click();
}

/* Einstellungen */
