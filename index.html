            <div class="grid3" style="margin-top:8px">
              <label class="f"><span>Datum</span><input class="in" name="fuDate" type="date" value="${esc(state.fuDate)}"></label>
              <label class="f"><span>Uhrzeit (optional)</span><input class="in" name="fuTime" type="time" step="300" value="${esc(state.fuTime)}"></label>
              <label class="f"><span>Zuständig</span><select class="in" name="assignee">${fnames.map(n => `<option${n === state.assignee ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
            </div>
            <span class="hint" data-fuhint></span>
          </div>
          ${others.length ? `<label class="check"><input type="checkbox" name="closeOpen"${edit ? '' : ' checked'}> ${others.length === 1 ? 'Offenes Follow-up' : others.length + ' offene Follow-ups'} (${others.map(a => esc(C.displayDate(a.v.fuDate)) + (a.v.assignedTo ? ', ' + esc(a.v.assignedTo) : '')).join('; ')}) als erledigt markieren</label>` : ''}
        </div>
        <div>${edit ? (init.stageAfter ? `<div class="f"><span>Phase</span></div><p class="muted">Bei dieser Aktivität: ${esc(init.stageBefore || '–')} → ${esc(init.stageAfter)}. Ändern auf der Kontaktseite.</p>` : '') : `<label class="f"><span>Phase jetzt</span><select class="in" name="stage">${stageOptions(C.stageOf(c.v))}</select></label><p class="hint">Nur ändern, wenn das Gespräch den Lead weitergebracht hat.</p>`}</div>
      </div>
    </div>
    <div class="dlg-foot"><span class="left"><kbd>Enter</kbd> speichert, <kbd>Shift</kbd>+<kbd>Enter</kbd> neue Zeile, <kbd>1</kbd>–<kbd>${Math.min(9, st.outcomes.length)}</kbd> Ergebnis</span>
      ${edit ? '<button class="btn danger-soft" type="button" data-delact>Löschen</button>' : ''}<button class="btn" type="button" data-x>Abbrechen</button><button class="btn ok" type="submit">Speichern</button></div>
  </form>`, { form: true, wide: true, label: 'Aktivität' });
  const f = $('form', d);
  const paint = () => {
    $('[data-priorow]', d).hidden = !f.elements.nextStep.value.trim();
    for (const k of ['type', 'direction', 'outcome', 'prio']) $$(`[data-chips="${k}"] .chip`, d).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[k])));
    const fd = f.elements.fuDate.value, ft = f.elements.fuTime.value;
    $$('[data-fuq] .chip', d).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === 'none' ? !fd : fd && fd === quickDate(b.dataset.q))));
    $('[data-fuhint]', d).textContent = (fd ? `Follow-up ${C.weekday(fd)}, ${C.displayDate(fd)}${ft ? ' um ' + ft : ' (ganztägig)'} für ${f.elements.assignee.value}.` : 'Kein Follow-up.') + (f.elements.nextStep.value.trim() ? ` To-do für ${f.elements.assignee.value}.` : '');
    const cw = $('[data-calwarn]', d);
    if (cw) cw.hidden = !(fd !== (init.fuDate || '') || (ft || '') !== (C.isTime(init.fuTime) ? init.fuTime.slice(0, 5) : '') || f.elements.assignee.value !== (init.assignedTo || App.identity));
  };
  const quickDate = q => q === 'm1' ? C.addMonths(C.todayBerlin(), 1) : C.addDays(C.todayBerlin(), +q);
  $$('[data-chips]', d).forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const k = g.dataset.chips;
    state[k] = (k === 'outcome' && state.outcome === b.dataset.v) ? '' : b.dataset.v;
    if (k === 'type' && !edit) state.direction = /notiz/i.test(state.type) ? '' : (state.direction || 'Ausgehend');
    paint();
  }));
  $('[data-fuq]', d).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.q === 'none') { f.elements.fuDate.value = ''; f.elements.fuTime.value = ''; } else f.elements.fuDate.value = quickDate(b.dataset.q);
    paint();
  });
  ['fuDate', 'fuTime', 'assignee', 'nextStep'].forEach(n => f.elements[n].addEventListener('input', paint));
  $('[data-x]', d).onclick = () => d.close();
  const del = $('[data-delact]', d);
  if (del) del.onclick = async () => { if (await confirmDialog({ title: 'Aktivität löschen?', body: 'Die Aktivität wird für alle gelöscht.' + (edit.v.calendarOpenedAt ? ' Einen Kalendereintrag dazu musst du selbst löschen.' : ''), ok: 'Löschen', danger: true })) { d.close(); deleteActivity(edit.key); } };
  f.elements.summary.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
  d.addEventListener('keydown', e => {
    if (isTyping(e.target) && e.target.type !== 'checkbox') return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9 && st.outcomes[n - 1]) { e.preventDefault(); state.outcome = state.outcome === st.outcomes[n - 1] ? '' : st.outcomes[n - 1]; paint(); }
  });
  paint();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const atV = f.elements.at.value;
    const fuDate = f.elements.fuDate.value, fuTime = f.elements.fuTime.value;
    const summary = C.normalizeNewlines(f.elements.summary.value.trim());
    if (!C.isDateTime(atV)) { toast('Bitte Datum und Uhrzeit angeben.', { error: true }); f.elements.at.focus(); return; }
    if (fuTime && !fuDate) { toast('Uhrzeit ohne Follow-up-Datum – bitte ein Datum wählen.', { error: true }); return; }
    if (summary.length > C.SAFE_CELL_TEXT) { toast('Zusammenfassung ist zu lang.', { error: true }); return; }
    const fields = { link: (f.elements.link.value || '').trim(), contactId: c.v.id, at: atV, type: state.type, direction: state.direction, outcome: state.outcome, summary, nextStep: f.elements.nextStep.value.trim(), todoPrio: edit && C.todoPrio(edit) === Number(state.prio) ? edit.v.todoPrio : (f.elements.nextStep.value.trim() ? Number(state.prio) : (edit ? edit.v.todoPrio : '')), fuDate, fuTime, assignedTo: (fuDate || f.elements.nextStep.value.trim()) ? f.elements.assignee.value : '' };
    if (!edit && dnc && state.direction === 'Ausgehend') {
      if (!(await confirmDialog({ title: 'Kontakt ist gesperrt', body: `<b>${esc(C.displayName(c.v))}</b> ist als „Nicht kontaktieren“ markiert. Trotzdem eine ausgehende Aktivität loggen?`, ok: 'Trotzdem loggen', danger: true }))) return;
    }
    if (edit) {
      const changed = {};
      for (const [k, x] of Object.entries(fields)) {
        let before = init[k];
        if (k === 'fuTime') before = C.isTime(init.fuTime) ? init.fuTime.slice(0, 5) : (init.fuTime || '');
        if (k === 'at') before = C.isDateTime(init.at) ? init.at.slice(0, 16) : init.at;
        if (!C.valuesEqual(before, x)) changed[k] = x;
      }
      if (f.elements.closeOpen && f.elements.closeOpen.checked) completeFollowUps(c.v.id, others.map(a => a.key));
      const fuChanged = ['fuDate', 'fuTime', 'assignedTo'].some(k => k in changed);
      if (Object.keys(changed).length) updateActivity(edit.key, changed); else if (f.elements.closeOpen && f.elements.closeOpen.checked) touch('Follow-ups erledigt');
      d.close();
      if (fuChanged && edit.v.calendarOpenedAt && fuDate) calendarPrompt(edit.key, { changed: true });
      return;
    }
    if (f.elements.closeOpen && f.elements.closeOpen.checked) completeFollowUps(c.v.id, others.map(a => a.key));
    const stg = f.elements.stage.value, stFrom = C.stageOf(c.v);
    let stCreated = null;
    if (stg !== stFrom) {
      fields.stageBefore = stFrom; fields.stageAfter = stg;
      c.v.stage = stg; c.v.updated = stamp(); c.v.updatedBy = App.identity;
      stCreated = applyStageEffects(c, stFrom, stg);
    }
    fields.loggedBy = App.identity;
    LS.set('lastType', state.type);
    const aid = addActivity(fields);
    d.close();
    if (stCreated) stageToast(c, stg, stCreated); else toast('Aktivität gespeichert.');
    if (fuDate) calendarPrompt(aid, { fresh: true });
  });
  setTimeout(() => f.elements.summary.focus(), 0);
}

/* ----- Kalender ------------------------------------------------------------ */
function calendarPrompt(aid, opts) {
  opts = opts || {};
  const a = App.work.activities.find(x => x.key === aid); if (!a || !C.isDate(a.v.fuDate)) return;
  const c = contactById(a.v.contactId); if (!c) return;
  const st = S();
  const { title, details } = C.eventText(c.v, a.v, st);
  const dur = C.settingNum(st, 'Default follow-up minutes', 15);
  const forOther = a.v.assignedTo && a.v.assignedTo !== App.identity;
  const mail = forOther ? founderEmail(a.v.assignedTo) : '';
  const when = `${C.weekday(a.v.fuDate)}, ${C.displayDate(a.v.fuDate)}` + (C.isTime(a.v.fuTime) ? `, ${a.v.fuTime.slice(0, 5)} Uhr (${dur} Min.)` : ', ganztägig');
  const d = openDlg(`<div class="dlg"><div class="dlg-head"><h2>${opts.changed ? 'Follow-up geändert – Kalender anpassen' : 'Follow-up in den Kalender eintragen'}</h2><p>${esc(when)}, zuständig: ${esc(a.v.assignedTo || App.identity)}</p></div>
    <div class="dlg-body">
      ${a.v.calendarOpenedAt ? `<div class="alert">Am ${esc(C.displayDate(a.v.calendarOpenedAt))} wurde für dieses Follow-up schon ein Kalendereintrag geöffnet. Ein neuer Eintrag ersetzt den alten <b>nicht</b> – den alten bitte im Kalender löschen.</div>` : ''}
      ${forOther ? (mail ? `<div class="alert info">${esc(a.v.assignedTo)} wird als Gast eingeladen (${esc(mail)}). Im Google Kalender auf „Speichern“ klicken und bei der Frage nach Einladungen „Senden“ wählen.</div>` : `<div class="alert err">Für ${esc(a.v.assignedTo)} ist keine E-Mail hinterlegt – der Termin landet nur in deinem Kalender, ohne Einladung. E-Mail unter Einstellungen › Gründer eintragen.</div>`)
        : '<div class="alert info">Der Termin landet in deinem Kalender. Die Erinnerung kommt über deine Google-Kalender-Benachrichtigungen (einmalig einrichten, siehe Anleitung).</div>'}
      <div><div class="hint">Das geht an den Kalender:</div><div style="font-weight:600;margin-top:4px">${esc(title)}</div><div class="muted" style="white-space:pre-wrap">${esc(details)}</div></div>
    </div>
    <div class="dlg-foot"><span class="left">Das Tool kann einen Kalendereintrag später nicht ändern oder löschen.</span><button class="btn" data-later>Später</button><button class="btn" data-ics>.ics-Datei</button><button class="btn primary" data-g>Google Kalender öffnen</button></div></div>`, { label: 'Kalender' });
  $('[data-later]', d).onclick = () => d.close();
  $('[data-g]', d).onclick = () => {
    const { url, truncated } = C.googleCalendarUrl({ title, details, fuDate: a.v.fuDate, fuTime: a.v.fuTime, durationMin: dur, guests: mail ? [mail] : [] });
    window.open(url, '_blank', 'noopener');
    d.close();
    updateActivity(a.key, { calendarOpenedAt: stamp() });
    if (truncated) toast('Die Beschreibung war zu lang für den Link und wurde gekürzt.');
  };
  $('[data-ics]', d).onclick = () => {
    const ics = C.buildIcs({ uid: a.v.id + '@n3-crm', title, details, fuDate: a.v.fuDate, fuTime: a.v.fuTime, durationMin: dur, reminderMin: C.settingNum(st, 'Reminder minutes before', 30) });
    download(`Follow-up ${C.displayName(c.v).replace(/[\\/:*?"<>|]+/g, '')} ${a.v.fuDate}.ics`, ics, 'text/calendar;charset=utf-8');
    d.close();
    updateActivity(a.key, { calendarOpenedAt: stamp() });
    toast(forOther ? 'Die .ics-Datei trägt den Termin nur in DEINEN Kalender ein – ohne Einladung. Für Einladungen den Google-Link nutzen.' : '.ics-Datei heruntergeladen. Doppelklick öffnet sie im Kalender.', { ms: 9000 });
  };
  $('[data-g]', d).focus();
}

/* ----- Konflikt-Dialog ------------------------------------------------------ */
function conflictDialog(conflicts, theirs, opts) {
  opts = opts || {};
  const who = theirs.settings.kv['Last saved by'] || 'jemand anderes';
  const fmtVal = (f, x) => { if (C.isEmpty(x)) return '<span class="muted">(leer)</span>'; if (/^\[|^\{/.test(String(x))) { try { const j = JSON.parse(x); return esc(Array.isArray(j) ? j.map(y => typeof y === 'object' ? (y.name || JSON.stringify(y)) : y).join(', ') : String(x)); } catch (_) { /* weiter */ } } return esc(['created', 'updated', 'at', 'fuDate', 'consentDate', 'calendarOpenedAt', 'fuDone'].includes(f) ? C.displayDate(x) : String(x)); };
  const nameOf = cf => {
    if (cf.coll === 'settings') return 'Einstellungen';
    // Bei Feldkonflikten stehen in cf.mine/cf.theirs nur die Feldwerte, der Datensatz in cf.rec
    const rec = cf.kind === 'field' ? ((cf.rec && (cf.rec.mine || cf.rec.theirs)) || {}) : (cf.mine || cf.theirs || cf.base || {});
    if (cf.coll === 'contacts') return C.displayName(rec);
    const av = rec;
    const cv = (contactById(av.contactId) || {}).v || cf.contactBase || cf.contactTheirs || {};
    return `${C.displayName(cv)} – ${av.type || 'Aktivität'} vom ${C.displayDate(av.at)}`;
  };
  const keyOf = cf => `${cf.coll}|${cf.key}|${cf.kind === 'field' ? cf.field : '*'}`;
  const block = (cf, i) => {
    const opt = (v, label, body) => `<label class="opt"><span><input type="radio" name="c${i}" value="${v}"> <b>${label}</b></span>${body ? `<span class="v">${body}</span>` : ''}</label>`;
    const fl = f => esc(C.FIELD_LABELS[f] || f.replace(/^kv:/, ''));
    if (cf.kind === 'field') return `<div class="conflict"><div><b>${esc(nameOf(cf))}</b> – ${fl(cf.field)} <span class="muted">(vorher: ${fmtVal(cf.field, cf.base)})</span></div><div class="vals">${opt('mine', 'Mein Wert', fmtVal(cf.field, cf.mine))}${opt('theirs', `Wert von ${esc(who)}`, fmtVal(cf.field, cf.theirs))}</div></div>`;
    if (cf.kind === 'deletedByMe') return `<div class="conflict"><div>Du hast <b>${esc(nameOf(cf))}</b> gelöscht, ${esc(who)} hat inzwischen ${(cf.fields || []).map(fl).join(', ')} geändert.</div><div class="vals">${opt('mine', 'Trotzdem löschen')}${opt('theirs', 'Behalten (mit den Änderungen)')}</div></div>`;
    if (cf.kind === 'deletedByThem') return `<div class="conflict"><div>${esc(who)} hat <b>${esc(nameOf(cf))}</b> gelöscht, du hast ${(cf.fields || []).map(fl).join(', ')} geändert.</div><div class="vals">${opt('mine', 'Wiederherstellen mit meinen Änderungen')}${opt('theirs', 'Löschung übernehmen')}</div></div>`;
    if (cf.kind === 'orphanAfterMyDelete') return `<div class="conflict"><div>Du hast <b>${esc(C.displayName(cf.contactTheirs || {}))}</b> gelöscht, ${esc(who)} hat inzwischen eine Aktivität erfasst${cf.theirs && cf.theirs.summary ? ': „' + esc(String(cf.theirs.summary).slice(0, 120)) + '“' : ''}.</div><div class="vals">${opt('mine', 'Alles löschen (auch diese Aktivität)')}${opt('theirs', 'Kontakt doch behalten')}</div></div>`;
    if (cf.kind === 'orphanAfterTheirDelete') return `<div class="conflict"><div>${esc(who)} hat <b>${esc(C.displayName(cf.contactBase || {}))}</b> gelöscht, du hast eine Aktivität dazu erfasst${cf.mine && cf.mine.summary ? ': „' + esc(String(cf.mine.summary).slice(0, 120)) + '“' : ''}.</div><div class="vals">${opt('mine', 'Kontakt wiederherstellen, Aktivität behalten')}${opt('theirs', 'Löschung übernehmen, meine Aktivität verwerfen')}</div></div>`;
    return `<div class="conflict"><div>Gleiche ID auf beiden Seiten: <b>${esc(cf.key)}</b></div><div class="vals">${opt('mine', 'Meine Fassung')}${opt('theirs', 'Fassung von ' + esc(who))}</div></div>`;
  };
  return new Promise(res => {
    let done = false;
    const intro = opts.lost
      ? `Die Synchronisierung hat eine deiner letzten Speicherungen durch eine parallele Fassung von ${esc(who)} ersetzt. Das Tool spielt deine Änderungen wieder ein; ${conflicts.length === 1 ? 'ein Punkt wurde' : conflicts.length + ' Punkte wurden'} aber auch von ${esc(who)} geändert.`
      : `Seit deinem letzten Laden hat ${esc(who)} gespeichert. ${conflicts.length === 1 ? 'Ein Punkt wurde' : conflicts.length + ' Punkte wurden'} auf beiden Seiten unterschiedlich geändert. Alles andere wird automatisch zusammengeführt.`;
    const d = openDlg(`<div class="dlg"><div class="dlg-head"><h2>Gleichzeitige Änderungen</h2><p>${intro}</p></div>
      <div class="dlg-body">${conflicts.map(block).join('')}</div>
      <div class="dlg-foot"><span class="left"><button class="btn sm ghost" type="button" data-allm>Überall meins</button> <button class="btn sm ghost" type="button" data-allt>Überall von ${esc(who)}</button></span>
        <button class="btn" type="button" data-x>Abbrechen</button><button class="btn ok" type="button" data-ok disabled>Übernehmen und speichern</button></div></div>`,
    { wide: true, label: 'Konflikte', onClose: () => { if (!done) res(null); } });
    const okBtn = $('[data-ok]', d);
    const sync = () => { okBtn.disabled = conflicts.some((_, i) => !$(`input[name="c${i}"]:checked`, d)); };
    d.addEventListener('change', sync);
    const all = v => { conflicts.forEach((_, i) => { const r = $(`input[name="c${i}"][value="${v}"]`, d); if (r) r.checked = true; }); sync(); };
    $('[data-allm]', d).onclick = () => all('mine');
    $('[data-allt]', d).onclick = () => all('theirs');
    $('[data-x]', d).onclick = () => d.close();
    okBtn.onclick = () => { const r = {}; conflicts.forEach((cf, i) => { r[keyOf(cf)] = $(`input[name="c${i}"]:checked`, d).value; }); done = true; d.close(); res(r); };
  });
}

/* ----- Löschen, Export ------------------------------------------------------ */
async function deleteContactDialog(id) {
  const c = contactById(id); if (!c) return;
  const n = App.work.activities.filter(a => a.v.contactId === id).length;
  const cal = App.work.activities.some(a => a.v.contactId === id && a.v.calendarOpenedAt);
  const ok = await confirmDialog({ title: 'Kontakt löschen?', danger: true,
    body: `<b>${esc(C.displayName(c.v))}</b> und ${plural(n, 'zugehörige Aktivität', 'zugehörige Aktivitäten')} werden gelöscht – für alle drei.<br><br><span class="muted">In den lokalen Backups und im Versionsverlauf des Cloud-Ordners bleiben ältere Fassungen erhalten, bis sie ablaufen.${cal ? ' Kalendereinträge zu diesem Kontakt musst du selbst löschen.' : ''}</span>`,
    ok: `Kontakt und ${plural(n, 'Aktivität', 'Aktivitäten')} löschen` });

  $('[data-x]', d).onclick = () => d.close();

  const f = $('form', d);

  const paint = () => {
    $$('[data-chips="prio"] .chip', d).forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === state.prio)));
    const c = state.contactId ? contactById(state.contactId) : null;

  const search = () => {
    const q = f.elements.csearch.value.trim().toLowerCase(), box = $('[data-cres]', d);

    box.innerHTML = hits.length ? hits.map((c, i) => `<button type="button" class="cpick-hit" data-cid="${esc(c.v.id)}"${i === 0 ? ' aria-selected="true"' : ''}><b>${esc(C.displayName(c.v))}</b>${c.v.company && C.displayName(c.v) !== c.v.company ? ' · ' + esc(c.v.company) : ''}</button>`).join('') : '<div class="muted" style="padding:6px 2px">Kein Kontakt gefunden – das To-do kann auch ohne Kontakt angelegt werden.</div>';
    $$('[data-cid]', box).forEach(b => b.onclick = () => { state.contactId = b.dataset.cid; f.elements.csearch.value = ''; box.innerHTML = ''; paint(); f.elements.text.focus(); });
  };
  f.elements.csearch.addEventListener('input', debounce(search, 120));
  f.elements.csearch.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const first = $('[data-cres] [data-cid]', d); if (first) first.click(); }
  });
  f.addEventListener('submit', e => {
    e.preventDefault();

    if (!text) { toast('Bitte eintragen, was zu tun ist.', { error: true }); f.elements.text.focus(); return; }
    const due = f.elements.due.value;
    if (due && !C.isDate(due)) { toast('Ungültiges Fälligkeitsdatum.', { error: true }); return; }
    addTodo({ text, contactId: state.contactId, assignedTo: f.elements.assignee.value, prio: state.prio, desc: C.normalizeNewlines(f.elements.desc.value.trim()).slice(0, 2000), due, status: f.elements.status.value });
    d.close();

  });
  paint();
  setTimeout(() => f.elements.text.focus(), 0);
}

const SL = window.CRMSales;

function readOnlyBlocked() {

/** Einstellungen (Blatt „Settings“) gezielt ändern: { Schlüssel: Wert | null (= löschen) }. */
function setKv(changes) {
  const next = JSON.parse(JSON.stringify(App.work.settings));
  for (const [k, v] of Object.entries(changes)) {
    if (v === null || v === undefined) { delete next.kv[k]; next.kvOrder = next.kvOrder.filter(x => x !== k); }
    else { if (!next.kvOrder.includes(k)) next.kvOrder.push(k); next.kv[k] = String(v); }
  }

}
function templates() { return SL.allTemplates(S()); }

function rememberRecent(id) { LS.set('recentContacts', [id, ...LS.get('recentContacts', []).filter(x => x !== id)].slice(0, 12)); }
function recentContacts() { return LS.get('recentContacts', []).map(contactById).filter(c => c && !c.ghost); }
function toneFor(contactId) { return LS.get('tone:' + contactId, LS.get('tplTone', 'sie')); }
function setToneFor(contactId, tone) { if (contactId) LS.set('tone:' + contactId, tone); LS.set('tplTone', tone); }
function varsFor(contactId, extra) { const c = contactById(contactId); return SL.buildVars({ v: c ? c.v : {}, acts: c ? activitiesOf(c.v.id) : [], settings: S(), identity: App.identity, today: C.todayBerlin(), extra }); }
function senderMissing() { const kv = S().kv; return !String(kv['Absender: ' + App.identity] || '').trim(); }
/** Text mit hervorgehobenen Platzhaltern {…} als HTML. */
function markPlaceholders(text) { return esc(text).replace(/\{\{?[^{}\n]*\}?\}/g, m => `<mark class="ph">${m}</mark>`); }
function nbaFor(c) { return SL.nextBestAction(c.v, activitiesOf(c.v.id), C.todayBerlin(), S()); }

function stageFieldsFor(c, to) {

  c.v.stage = to; c.v.updated = stamp(); c.v.updatedBy = App.identity;

/** Primäre Aktion (z. B. aus „Nächste beste Aktion“) ausführen. */
function runAction(c, action) {
  if (!c || !action) return;

function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss'); }
/** Aus einem gefüllten Text wieder eine Vorlage machen: Namen/Firma/Domain des Kontakts werden zu Variablen. Wird vor dem Speichern angezeigt. */
function depersonalize(text, vals, tone, tpl) {
  let t = String(text || '');
  const sal = SL.salutationFor(vals, tone, (tpl && tpl.lang) || 'de');
  if (sal && t.startsWith(sal)) t = '{{salutation}}' + t.slice(sal.length);
  const rep = [['signature', vals.signature], ['companyName', vals.companyName], ['fullName', vals.fullName], ['lastNameWithTitle', vals.lastNameWithTitle], ['domain', vals.domain], ['firstName', vals.firstName], ['lastName', vals.lastName]]
    .filter(([, x]) => x && String(x).trim().length >= 3).sort((a, b) => String(b[1]).length - String(a[1]).length);
  for (const [k, x] of rep) t = t.split(String(x)).join(`{{${k}}}`);
  return t;
}
/** Nach dem Öffnen im Mailprogramm: fragen, ob gesendet – dann vermerken, optional Follow-up und Phase. */
async function logSentMail(c, tpl, subject) {
  const v = c.v, others = activitiesOf(v.id).filter(a => C.isOpenFollowUp(a));
  const from = C.stageOf(v);
  const suggestStage = /^(de-angebot|en-proposal)$/.test(tpl.id) ? 'Proposal Sent' : (from === 'Cold' ? 'Contact Made' : '');
  const fuDays = tpl.cat === 'Erstansprache' || tpl.cat === 'Nachfassen' ? 4 : (tpl.id === 'de-angebot' ? 5 : 0);
  const fuDefault = fuDays ? SL.addBusinessDays(C.todayBerlin(), Math.min(fuDays, 5)) : '';
  const res = await new Promise(resolve => {
    const d = openDlg(`<form method="dialog" class="dlg" novalidate><div class="dlg-head"><h2>Mail gesendet?</h2><p>${esc(C.displayName(v))} · „${esc(tpl.name)}“</p></div>
      <div class="dlg-body">
        <p>Hast du die Mail in deinem Mailprogramm abgeschickt? Dann wird sie im Verlauf vermerkt.</p>
        <div class="f"><span>Follow-up</span><div class="chips" data-fu><button type="button" class="chip" data-d="">keins</button><button type="button" class="chip" data-d="${C.addDays(C.todayBerlin(), 2)}">in 2 Tagen</button><button type="button" class="chip" data-d="${SL.addBusinessDays(C.todayBerlin(), 4)}">in 4 Werktagen</button><button type="button" class="chip" data-d="${C.addDays(C.todayBerlin(), 7)}">in 1 Woche</button></div>
          <input class="in" type="date" name="fu" value="${esc(fuDefault)}" style="max-width:180px;margin-top:6px"></div>
        ${suggestStage ? `<label class="check"><input type="checkbox" name="stage" checked> Phase auf „${esc(suggestStage)}“ setzen (bisher „${esc(from)}“)</label>` : ''}
        ${others.length ? `<label class="check"><input type="checkbox" name="close" checked> ${others.length === 1 ? 'Offenes Follow-up' : others.length + ' offene Follow-ups'} als erledigt markieren</label>` : ''}
      </div>
      <div class="dlg-foot"><button class="btn" type="button" data-no>Nein, nicht gesendet</button><button class="btn ok" type="submit">Ja, gesendet</button></div></form>`, { form: true, label: 'Mail gesendet?', onClose: val => resolve(val === 'yes' ? { fu: f.elements.fu.value, stage: f.elements.stage ? f.elements.stage.checked : false, close: f.elements.close ? f.elements.close.checked : false } : null) });
    const f = $('form', d);
    const paint = () => $$('[data-fu] .chip', d).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === f.elements.fu.value)));
    $$('[data-fu] .chip', d).forEach(b => b.onclick = () => { f.elements.fu.value = b.dataset.d; paint(); });
    f.elements.fu.addEventListener('input', paint); paint();
    $('[data-no]', d).onclick = () => d.close('no');
    f.addEventListener('submit', e => { e.preventDefault(); d.close('yes'); });
  });
  if (!res) return;
  if (readOnlyBlocked()) return;
  if (res.close) completeFollowUps(v.id, others.map(a => a.key));
  const st = res.stage ? stageFieldsFor(c, suggestStage) : { fields: {}, created: null };
  if (res.stage && suggestStage === 'Proposal Sent' && C.isEmpty(v.proposalDate)) v.proposalDate = C.todayBerlin();
  addActivity({ contactId: v.id, at: C.nowBerlin(), loggedBy: App.identity, type: mailActType(), direction: 'Ausgehend', summary: `Mail „${tpl.name}“ gesendet. Betreff: ${subject}`,
    tplId: tpl.id, fuDate: res.fu || '', assignedTo: res.fu ? App.identity : '', ...st.fields });
  if (st.created) stageToast(c, suggestStage, st.created); else toast('Mail im Verlauf vermerkt' + (res.fu ? `, Follow-up ${C.displayDate(res.fu)}.` : '.'));
}

    const f = $('form', d);
    $('[data-x]', d).onclick = () => d.close();
    f.addEventListener('submit', e => {
      e.preventDefault(); if (readOnlyBlocked()) return;
      const n = f.elements.name.value.trim();
      if (!n) { toast('Bitte deinen Namen eintragen.', { error: true }); f.elements.name.focus(); return; }
      setKv({ ['Absender: ' + me]: n, ['Telefon: ' + me]: f.elements.tel.value.trim() || null, ['Signatur: ' + me]: C.normalizeNewlines(f.elements.sig.value.trim()) || null });
      toast('Absender gespeichert.'); d.close('ok');
    });
    setTimeout(() => f.elements.name.focus(), 0);
  });
}

/* ----- Vorlagen-Editor -------------------------------------------------------- */
/**
 * Neue, eigene oder eingebaute Vorlage bearbeiten. Eingebaute Vorlagen werden nicht verändert, sondern überschrieben
 * (Zurücksetzen jederzeit möglich). Website-Fall-Vorlagen schreiben in die bisherigen Einstellungen.
 */
function templateEditor(tpl, opts) {
  if (readOnlyBlocked()) return;
  opts = opts || {};
  const isNew = !tpl, t = tpl ? { ...tpl } : { name: '', cat: 'Eigene', lang: 'de', subject: '', body: '{{salutation}}\n\n\n\nHerzliche Grüße\n{{signature}}', tags: [], stages: [], ...(opts.draft || {}) };
  const legacy = t.source === 'legacy';
  const sample = opts.previewContact || (recentContacts()[0] && recentContacts()[0].v.id) || '';
  let tone = 'sie', lastFocus = null;
  const d = openDlg(`<form method="dialog" class="dlg tpl-edit" novalidate>
    <div class="dlg-head"><h2>${isNew ? 'Neue Vorlage' : t.source === 'builtin' ? 'Eingebaute Vorlage anpassen' : 'Vorlage bearbeiten'}</h2>
      <p>${t.source === 'builtin' ? 'Das Original bleibt erhalten – „Zurücksetzen“ stellt es wieder her.' : legacy ? 'Website-Fall-Vorlage: wird wie bisher in den Einstellungen gespeichert.' : 'Wird für alle drei im Blatt „Settings“ gespeichert.'}</p></div>
    <div class="dlg-body tpl-edit-grid">
      <div class="tpl-edit-form">
        <div class="grid2">
          <label class="f"><span>Name</span><input class="in" name="name" value="${esc(t.name)}" maxlength="90" ${legacy ? 'readonly title="Name = Website-Kategorie, in den Einstellungen änderbar"' : ''}></label>
          <label class="f"><span>Kategorie</span><select class="in" name="cat" ${legacy ? 'disabled' : ''}>${[...new Set([...KC.TEMPLATE_CATEGORIES, t.cat])].map(x => `<option${x === t.cat ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        </div>
        <div class="grid3">
          <label class="f"><span>Sprache</span><select class="in" name="lang" ${legacy ? 'disabled' : ''}><option value="de"${t.lang !== 'en' ? ' selected' : ''}>Deutsch</option><option value="en"${t.lang === 'en' ? ' selected' : ''}>Englisch</option></select></label>
          <label class="f"><span>Stil</span><input class="in" name="style" value="${esc(t.style || '')}" placeholder="z. B. Kurz, Beratend" maxlength="30" ${legacy ? 'readonly' : ''}></label>
          <label class="f"><span>Schlagworte</span><input class="in" name="tags" value="${esc((t.tags || []).join(', '))}" placeholder="kommagetrennt" maxlength="200" ${legacy ? 'readonly' : ''}></label>
        </div>
        <div class="f"><span>Empfohlen in Phase</span><div class="chips sm" data-stages>${C.STAGES.map(s => `<button type="button" class="chip" data-s="${esc(s)}" aria-pressed="${(t.stages || []).includes(s)}" ${legacy ? 'disabled' : ''}>${esc(s)}</button>`).join('')}</div></div>
        <label class="f"><span>Hinweis (wann verwenden?)</span><input class="in" name="hint" value="${esc(t.hint || '')}" maxlength="200" ${legacy ? 'readonly' : ''}></label>
        <label class="f"><span>Betreff</span><input class="in" name="subject" value="${esc(t.subject)}" maxlength="200"></label>
        <label class="f"><span>Text</span><textarea class="in mono" name="body" rows="13">${esc(t.body)}</textarea></label>
        <div class="f"><span>Variable einfügen (an der Cursor-Position)</span><div class="chips sm vars">${SL.VARS.map(x => `<button type="button" class="chip" data-var="${esc(x.key)}" title="${esc(x.hint || '{{' + x.key + '}}')}">${esc(x.label)}</button>`).join('')}</div>
          <span class="hint">Eigene Lücken in einfachen Klammern, z. B. {Stadt} – die füllst du beim Schreiben. Sie/Du-Varianten: [[Ihnen|dir]].</span></div>
      </div>
      <div class="tpl-edit-prev">
        <div class="prev-bar"><label class="f"><span>Vorschau mit</span><select class="in" name="pc"><option value="">Beispiel (Anna Beispiel)</option>${recentContacts().map(c => `<option value="${esc(c.v.id)}"${c.v.id === sample ? ' selected' : ''}>${esc(C.displayName(c.v))}</option>`).join('')}</select></label>
          <div class="chips sm" data-tone><button type="button" class="chip" data-t="sie">Sie</button><button type="button" class="chip" data-t="du">Du</button></div></div>
        <div class="prev-mail"><div class="prev-subj" data-ps></div><div class="prev-body" data-pb></div></div>
        <div data-pwarn></div>
      </div>
    </div>
    <div class="dlg-foot"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn ok" type="submit">Speichern</button></div></form>`, { form: true, wide: true, label: 'Vorlage bearbeiten' });
  d.classList.add('xwide');
  const f = $('form', d), stages = new Set(t.stages || []);
  const sampleVals = () => {
    const id = f.elements.pc.value;
    if (id) return varsFor(id);
    return SL.buildVars({ v: { firstName: 'Anna', lastName: 'Beispiel', company: 'Beispiel Finanz GmbH', category: 'Finanzberater', website: 'beispiel-finanz.de', position: 'Inhaberin' }, acts: [], settings: S(), identity: App.identity, today: C.todayBerlin() });
  };
  const preview = () => {
    const r = SL.renderTemplate({ subject: f.elements.subject.value, body: f.elements.body.value, lang: f.elements.lang.value }, sampleVals(), { tone });
    $('[data-ps]', d).innerHTML = markPlaceholders(r.subject) || '<span class="muted">(kein Betreff)</span>';
    $('[data-pb]', d).innerHTML = markPlaceholders(r.body);
    $('[data-pwarn]', d).innerHTML = r.unknown.length ? `<div class="alert err">Unbekannte Variable: ${r.unknown.map(x => '<code>{{' + esc(x) + '}}</code>').join(', ')}. Bitte aus der Liste wählen.</div>` : '';
    $$('[data-tone] .chip', d).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === tone)));
  };
  ['subject', 'body'].forEach(n => { f.elements[n].addEventListener('input', preview); f.elements[n].addEventListener('focus', () => { lastFocus = f.elements[n]; }); });
  f.elements.pc.onchange = preview; f.elements.lang.onchange = preview;
  $$('[data-tone] .chip', d).forEach(b => b.onclick = () => { tone = b.dataset.t; preview(); });
  $$('[data-stages] .chip', d).forEach(b => b.onclick = () => { const s = b.dataset.s; if (stages.has(s)) stages.delete(s); else stages.add(s); b.setAttribute('aria-pressed', String(stages.has(s))); });
  $$('[data-var]', d).forEach(b => b.onclick = () => {
    const el = lastFocus || f.elements.body, ins = `{{${b.dataset.var}}}`;
    const s0 = el.selectionStart ?? el.value.length, s1 = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, s0) + ins + el.value.slice(s1); el.focus(); el.setSelectionRange(s0 + ins.length, s0 + ins.length); preview();
  });
  $('[data-x]', d).onclick = () => d.close();
  f.addEventListener('submit', e => {
    e.preventDefault();
    const name = f.elements.name.value.trim(), subject = f.elements.subject.value.trim(), body = C.normalizeNewlines(f.elements.body.value.replace(/\s+$/, ''));
    if (!name) { toast('Bitte einen Namen vergeben.', { error: true }); f.elements.name.focus(); return; }
    if (!body.trim()) { toast('Der Text ist leer.', { error: true }); f.elements.body.focus(); return; }
    const r = SL.renderTemplate({ subject, body }, sampleVals(), {});
    if (r.unknown.length) { toast('Unbekannte Variable: {{' + r.unknown[0] + '}}', { error: true }); return; }
    if (legacy) {
      setKv({ ['Mail ' + t.legacyIndex + ' subject']: subject, ['Mail ' + t.legacyIndex + ' body']: body });
      toast('Website-Fall-Vorlage gespeichert.'); d.close(); return;
    }
    const data = { name, cat: f.elements.cat.value, lang: f.elements.lang.value, style: f.elements.style.value.trim(), tags: f.elements.tags.value.split(',').map(x => x.trim()).filter(Boolean),
      stages: [...stages], hint: f.elements.hint.value.trim(), subject, body, audience: t.audience || [] };
    const id = isNew || t.source === 'legacy' ? SL.newTemplateId(templates().map(x => x.id)) : t.id;
    const json = SL.serializeTemplate(data, App.identity, C.nowBerlin());
    if (json.length > C.SAFE_CELL_TEXT) { toast('Die Vorlage ist zu lang für eine Excel-Zelle.', { error: true }); return; }
    setKv({ [SL.TPL_PREFIX + id]: json });
    toast(isNew ? 'Vorlage angelegt.' : 'Vorlage gespeichert.');
    App.ui.tplSel = id;
    d.close();
    if (opts.onSaved) opts.onSaved(id);
  });
  preview();
  setTimeout(() => (isNew && !t.name ? f.elements.name : f.elements.body).focus(), 0);
}
async function deleteTemplate(t) {
  if (readOnlyBlocked() || t.source !== 'custom') return;
  if (!(await confirmDialog({ title: 'Vorlage löschen?', body: `„${esc(t.name)}“ wird für alle drei gelöscht.`, ok: 'Löschen', danger: true }))) return;
  setKv({ [SL.TPL_PREFIX + t.id]: null }); App.ui.tplSel = null; toast('Vorlage gelöscht.');
}
async function resetTemplate(t) {
  if (readOnlyBlocked() || !t.overridden) return;
  if (!(await confirmDialog({ title: 'Auf Original zurücksetzen?', body: `Deine Änderungen an „${esc(t.name)}“ gehen verloren.`, ok: 'Zurücksetzen', danger: true }))) return;
  setKv({ [SL.TPL_PREFIX + t.id]: null }); toast('Vorlage zurückgesetzt.');
}
function hideTemplate(t, hide) {
  if (readOnlyBlocked() || t.source !== 'builtin') return;
  setKv({ [SL.TPL_PREFIX + t.id]: hide ? JSON.stringify({ hidden: true, by: App.identity, at: C.nowBerlin() }) : null });
  toast(hide ? 'Vorlage ausgeblendet. Unter „Ausgeblendete zeigen“ wieder einblenden.' : 'Vorlage wieder eingeblendet.');
}
function duplicateTemplate(t) {
  templateEditor(null, { draft: { name: t.name + ' (Kopie)', cat: t.source === 'legacy' ? 'Erstansprache' : t.cat, lang: t.lang, style: t.style, tags: t.tags, stages: t.stages, hint: t.hint, subject: t.subject, body: t.body } });
}

/* =============================================================================
 * APP – Teil 4c: Ansicht „Vorlagen & Leitfäden“

const TPL_TABS = { mail: 'E-Mail-Vorlagen', calls: 'Telefonleitfäden', objections: 'Einwände', segments: 'Zielgruppen & Absender' };

function renderTemplates(el) {
  const tab = TPL_TABS[App.ui.tplTab] ? App.ui.tplTab : 'mail';
  el.innerHTML = `<div class="view-head"><div><h1>Vorlagen &amp; Leitfäden</h1><p>Mails, Telefonleitfäden und Antworten auf Einwände – für alle drei gleich, gespeichert in der Excel-Datei.</p></div>
    <div class="actions">${tab === 'mail' ? '<button class="btn ok" type="button" data-newtpl>+ Neue Vorlage</button>' : ''}</div></div>
    <div class="pm-tabs" role="tablist">${Object.entries(TPL_TABS).map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join('')}</div>
    <div data-tabbody></div>`;
  $$('[data-tab]', el).forEach(b => b.onclick = () => { App.ui.tplTab = b.dataset.tab; renderTemplates(el); });
  $$('[data-newtpl]', el).forEach(b => b.onclick = () => templateEditor(null, { onSaved: () => renderAll() }));
  const body = $('[data-tabbody]', el);
  if (tab === 'mail') return renderTplMail(body);
  if (tab === 'calls') return renderTplCalls(body);
  if (tab === 'objections') return renderTplObjections(body);
  return renderTplSegments(body);
}

/* ----- E-Mail-Vorlagen ----- */
function renderTplMail(el) {
  const f = App.ui.tplFilter || (App.ui.tplFilter = { q: '', cat: '', lang: '', only: '', hidden: false });
  const all = templates(), favs = tplFavs(), recent = tplRecent();
  const stats = SL.templateStats(App.work.activities, App.index);
  const nq = norm(f.q);
  const list = all.filter(t => (f.hidden || !t.hidden) && (!f.cat || t.cat === f.cat) && (!f.lang || t.lang === f.lang)
    && (!f.only || (f.only === 'fav' ? favs.includes(t.id) : f.only === 'recent' ? recent.includes(t.id) : f.only === 'own' ? (t.source === 'custom' || t.overridden) : true))
    && (!nq || norm([t.name, t.subject, t.body, t.tags.join(' '), t.cat, t.style].join(' ')).includes(nq)));
  if (f.only === 'recent') list.sort((a, b) => recent.indexOf(a.id) - recent.indexOf(b.id));
  let sel = list.find(t => t.id === App.ui.tplSel) || list[0] || null;
  const cats = [...new Set(all.map(t => t.cat))];
  const badge = t => t.source === 'custom' ? '<span class="tag xs own">Eigene</span>' : t.overridden ? '<span class="tag xs own">Angepasst</span>' : t.source === 'legacy' ? '<span class="tag xs">Website-Fall</span>' : '';
  el.innerHTML = `<div class="tpl-lib">
    <aside class="tpl-side panel">
      <div class="body" style="display:grid;gap:8px">
        <input class="in" type="search" data-f="q" placeholder="Suchen in Name, Betreff, Text …" value="${esc(f.q)}" aria-label="Vorlagen durchsuchen">
        <div class="grid2"><select class="in" data-f="cat" aria-label="Kategorie"><option value="">Alle Kategorien</option>${cats.map(c => `<option${c === f.cat ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
          <select class="in" data-f="lang" aria-label="Sprache"><option value="">Alle Sprachen</option><option value="de"${f.lang === 'de' ? ' selected' : ''}>Deutsch</option><option value="en"${f.lang === 'en' ? ' selected' : ''}>Englisch</option></select></div>
        <div class="chips sm" role="group" aria-label="Auswahl">${[['', 'Alle'], ['fav', '★ Favoriten'], ['recent', 'Zuletzt verwendet'], ['own', 'Eigene & angepasste']].map(([k, l]) => `<button type="button" class="chip" data-only="${k}" aria-pressed="${f.only === k}">${l}</button>`).join('')}</div>
        <label class="check small"><input type="checkbox" data-f="hidden"${f.hidden ? ' checked' : ''}> Ausgeblendete zeigen</label>
      </div>
      <div class="tpl-items" role="listbox" aria-label="Vorlagen">${list.length ? list.map(t => `<div class="tpl-item${sel && t.id === sel.id ? ' cur' : ''}${t.hidden ? ' hid' : ''}" role="option" aria-selected="${!!(sel && t.id === sel.id)}" data-id="${esc(t.id)}" tabindex="0">
          <button type="button" class="star${favs.includes(t.id) ? ' on' : ''}" data-fav="${esc(t.id)}" aria-label="${favs.includes(t.id) ? 'Favorit entfernen' : 'Als Favorit markieren'}" title="Favorit">★</button>
          <div><div class="nm">${esc(t.name)} ${t.lang === 'en' ? '<span class="tag xs">EN</span>' : ''}${badge(t)}${t.hidden ? '<span class="tag xs">ausgeblendet</span>' : ''}</div>
          <div class="sub">${esc(t.cat)}${t.style ? ' · ' + esc(t.style) : ''}${stats[t.id] ? ` · ${stats[t.id].sent}× gesendet` : ''}</div></div></div>`).join('') : '<div class="empty small"><div><p>Keine Vorlage passt zu Suche oder Filter.</p></div></div>'}</div>
    </aside>
    <section class="tpl-detail" data-detail></section></div>`;
  const detail = $('[data-detail]', el);
  const paintDetail = () => {
    if (!sel) { detail.innerHTML = '<div class="empty"><div><h2>Keine Vorlage ausgewählt</h2><p>Links eine Vorlage wählen oder mit „+ Neue Vorlage“ eine eigene anlegen.</p></div></div>'; return; }
    const t = sel, st = stats[t.id];
    const pcs = recentContacts();
    const pcId = App.ui.tplPreviewContact && contactById(App.ui.tplPreviewContact) ? App.ui.tplPreviewContact : '';
    const tone = App.ui.tplTone || 'sie';
    const vals = pcId ? varsFor(pcId) : SL.buildVars({ v: { firstName: 'Anna', lastName: 'Beispiel', company: 'Beispiel Finanz GmbH', category: 'Finanzberater', website: 'beispiel-finanz.de' }, acts: [], settings: S(), identity: App.identity, today: C.todayBerlin() });
    const r = SL.renderTemplate(t, vals, { tone });
    const stagesTxt = t.stages.length ? t.stages.join(', ') : '–';
    detail.innerHTML = `<section class="panel"><h2><span class="grow">${esc(t.name)}</span>${badge(t)}</h2><div class="body">
      ${t.hint ? `<p class="tpl-hint">${esc(t.hint)}</p>` : ''}
      <dl class="facts compact"><dt>Kategorie</dt><dd>${esc(t.cat)}${t.style ? ' · ' + esc(t.style) : ''} · ${t.lang === 'en' ? 'Englisch' : 'Deutsch'}</dd><dt>Empfohlen in</dt><dd>${esc(stagesTxt)}</dd>
        ${t.tags.length ? `<dt>Schlagworte</dt><dd>${t.tags.map(x => `<span class="tag xs">${esc(x)}</span>`).join(' ')}</dd>` : ''}
        <dt>Nutzung</dt><dd>${st ? `${st.sent}× gesendet, ${st.replied} mit Reaktion innerhalb von 14 Tagen (zuletzt ${esc(C.displayDate(st.last))})` : 'Noch nicht über das CRM gesendet'}<span class="hint"> Reaktion = eingehende Aktivität im CRM – nur so gut wie das Loggen.</span></dd>
        ${t.by ? `<dt>Geändert</dt><dd>${esc(t.by)}${t.at ? ', ' + esc(C.displayDate(t.at)) : ''}</dd>` : ''}</dl>
      <div class="prev-bar"><label class="f"><span>Vorschau mit</span><select class="in" data-pc><option value="">Beispiel (Anna Beispiel)</option>${pcs.map(c => `<option value="${esc(c.v.id)}"${c.v.id === pcId ? ' selected' : ''}>${esc(C.displayName(c.v))}</option>`).join('')}</select></label>
        <div class="chips sm" role="group" aria-label="Ton"><button type="button" class="chip" data-tone="sie" aria-pressed="${tone === 'sie'}">Sie</button><button type="button" class="chip" data-tone="du" aria-pressed="${tone === 'du'}">Du</button></div></div>
      ${!pcs.length ? '<p class="hint">Tipp: Öffne einen Kontakt, dann kannst du die Vorschau mit seinen echten Daten sehen.</p>' : ''}
      <div class="prev-mail"><div class="prev-subj">${markPlaceholders(r.subject) || '<span class="muted">(kein Betreff)</span>'}</div><div class="prev-body">${markPlaceholders(r.body)}</div></div>
      ${r.missing.length ? `<p class="hint">Für diesen Kontakt fehlen: ${r.missing.map(k => esc((SL.VARS.find(x => x.key === k) || {}).label || k)).join(', ')}.${r.missing.some(k => ['salesRepName', 'signature', 'senderPhone'].includes(k)) ? ' <button type="button" class="linkish" data-sender>Absender einrichten</button>' : ''}</p>` : ''}
      <div class="tpl-actions">
        ${pcId ? `<button class="btn ok" type="button" data-use>Für ${esc(C.displayName(contactById(pcId).v))} verwenden</button>` : ''}
        <button class="btn" type="button" data-edit>Bearbeiten</button>
        <button class="btn" type="button" data-dup>Duplizieren</button>
        <button class="btn ghost" type="button" data-copyraw title="Vorlagentext mit Variablen kopieren">Rohtext kopieren</button>

      </div></div></section>`;
    $('[data-pc]', detail).onchange = e => { App.ui.tplPreviewContact = e.target.value; paintDetail(); };
    $$('[data-tone]', detail).forEach(b => b.onclick = () => { App.ui.tplTone = b.dataset.tone; paintDetail(); });

    $('[data-edit]', detail).onclick = () => templateEditor(t, { previewContact: pcId });
    $('[data-dup]', detail).onclick = () => duplicateTemplate(t);
    $('[data-copyraw]', detail).onclick = () => copyText(`Betreff: ${t.subject}\n\n${t.body}`);
    $$('[data-del]', detail).forEach(b => b.onclick = () => deleteTemplate(t));
    $$('[data-reset]', detail).forEach(b => b.onclick = () => resetTemplate(t));
    $$('[data-hide]', detail).forEach(b => b.onclick = () => hideTemplate(t, !t.hidden));

  $$('[data-only]', el).forEach(b => b.onclick = () => { f.only = b.dataset.only; renderTplMail(el); });
  $$('.tpl-item', el).forEach(r => {
    const pick = () => { App.ui.tplSel = r.dataset.id; sel = list.find(t => t.id === r.dataset.id); $$('.tpl-item', el).forEach(x => { x.classList.toggle('cur', x === r); x.setAttribute('aria-selected', String(x === r)); }); paintDetail(); };
    r.addEventListener('click', e => { if (!e.target.closest('[data-fav]')) pick(); });

  });
  $$('[data-fav]', el).forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); renderTplMail(el); });
}

function objectionCard(o, vals) {
  if (!o) return '';

}

/* ----- Einwände: Bibliothek + Auswertung ----- */

  const days = App.ui.objDays || 90;
  const since = days ? C.addDays(C.todayBerlin(), -days) : '';
  const stats = SL.objectionStats(App.work.activities, since);
  const calls = App.work.activities.filter(a => a.v.type === callActType() && (!since || String(a.v.at).slice(0, 10) >= since));
  const withObj = calls.filter(a => String(a.v.objections || '').trim()).length;
  const max = Math.max(1, ...stats.map(s => s.count));
  el.innerHTML = `<div class="obj-wrap">
    <section class="panel"><h2><span class="grow">Welche Einwände hören wir?</span>
      <select class="in sm" data-days aria-label="Zeitraum">${[[30, 'Letzte 30 Tage'], [90, 'Letzte 90 Tage'], [365, 'Letzte 12 Monate'], [0, 'Gesamt']].map(([d, l]) => `<option value="${d}"${d === days ? ' selected' : ''}>${l}</option>`).join('')}</select></h2>
      <div class="body">${stats.length ? `<p class="hint">${plural(calls.length, 'Anruf', 'Anrufe')} erfasst, davon ${withObj} mit Einwand. Gezählt wird, was im Anruf-Modus als Einwand markiert wurde.</p>
        <div class="obj-stats">${stats.map(s => `<div class="obj-row"><span class="lbl">${esc(s.label)}</span><span class="bar"><i style="width:${Math.round(s.count / max * 100)}%"></i></span><span class="num">${s.count}</span>
          <span class="muted small">${Object.entries(s.outcomes).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([o, n]) => `${esc(o)} ${n}`).join(' · ')}</span></div>`).join('')}</div>`
        : '<div class="empty small"><div><p>Noch keine Einwände erfasst. Im Anruf-Modus markierst du sie mit einem Klick – hier siehst du dann, was am häufigsten kommt.</p></div></div>'}</div></section>
    <section class="panel"><h2>Antworten auf Einwände</h2><div class="body"><p class="hint">Aufbau nach einer Gong-Auswertung von Kaltakquise-Gesprächen: erst zustimmen, dann ins Gespräch kommen, dann einen kleinen, risikoarmen Schritt anbieten – bei uns meist der kostenlose Entwurf.</p>
      ${KC.OBJECTIONS.map(o => objectionCard(o)).join('')}</div></section></div>`;
  $('[data-days]', el).onchange = e => { App.ui.objDays = Number(e.target.value); renderTplObjections(el); };

/* =============================================================================
 * APP – Teil 4d: Anruf-Modus (Briefing, Leitfaden, Notizen, Ergebnis, Speichern)
 * Ziel: Dokumentation nach dem Gespräch in unter einer Minute. Nichts wird automatisch gesendet.
 * ===========================================================================*/
function newCallState(cid) {
  const c = contactById(cid);
  const s = c ? SL.suggestPlaybook(c.v, activitiesOf(cid), C.todayBerlin(), S()) : { id: 'kaltakquise', reason: '' };
  return { v: 1, cid, pb: s.id, pbReason: s.reason, started: 0, elapsed: 0, running: false, startAt: '', answers: {}, objections: [], openObj: '', showAllObj: false,
    notes: '', outcome: '', fuDate: '', fuTime: '', fuAuto: true, actions: [], meetingAt: '', stageTo: '', stageAuto: true, summary: '', summaryAuto: true, closeOpen: true, saved: false };
}
function callState(cid) {
  App.ui.calls = App.ui.calls || {};
  if (!App.ui.calls[cid]) { const d = LS.get('callDraft:' + cid, null); App.ui.calls[cid] = d && d.v === 1 && !d.saved ? { ...d, running: false } : newCallState(cid); }
  return App.ui.calls[cid];
}
function callDirty(st) { return !!(st.notes.trim() || st.outcome || st.objections.length || st.actions.length || Object.values(st.answers).some(a => a.asked || (a.a || '').trim())); }
const persistCall = debounce(st => { try { if (st.saved || !callDirty(st)) localStorage.removeItem('crm.callDraft:' + st.cid); else LS.set('callDraft:' + st.cid, st); } catch (_) { /* privat/blockiert */ } }, 300);
function callSeconds(st) { return Math.round(st.elapsed + (st.running && st.started ? (Date.now() - st.started) / 1000 : 0)); }
function fmtClock(sec) { return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

/** Anruf-Modus öffnen. opts.playbookId wählt den Leitfaden, solange noch nichts notiert ist. */
function openCall(cid, opts) {
  const c = contactById(cid); if (!c) return toast('Kontakt nicht gefunden.', { error: true });
  const st = callState(cid);
  if (st.saved) App.ui.calls[cid] = newCallState(cid);
  const s2 = callState(cid);
  if (opts && opts.playbookId && playbookById(opts.playbookId) && !callDirty(s2)) { s2.pb = opts.playbookId; s2.pbReason = 'aus „Nächste beste Aktion“'; }
  go('call', cid);
}
function leaveCall() { clearInterval(App._callTimer); App._callTimer = null; }
function startCallQueue(ids, label) {
  const list = ids.filter(id => contactById(id)); if (!list.length) return toast('Keine Kontakte mit Telefonnummer in der Liste.', { error: true });
  App.ui.callQueue = { ids: list, label: label || 'Anrufliste' };
  toast(`${label || 'Anrufliste'}: ${list.length} Kontakt${list.length === 1 ? '' : 'e'}.`);
  openCall(list[0]);
}
function queueStep(cid, d) {
  const q = App.ui.callQueue; if (!q) return;
  const i = q.ids.indexOf(cid), j = i + d;
  if (j < 0 || j >= q.ids.length) { App.ui.callQueue = null; toast('Anrufliste abgeschlossen.'); go('today'); return; }
  openCall(q.ids[j]);
}
function callSummaryText(st, pb) {
  const oc = KC.CALL_OUTCOMES.find(o => o.id === st.outcome);
  const qs2 = callQuestions(pb);
  return SL.callSummary({ playbook: pb ? pb.name : '', outcome: oc ? oc.label : '', seconds: callSeconds(st), notes: st.notes,
    answers: qs2.map(q => ({ q: SL.applyTone(q.q, 'sie'), a: (st.answers[q.key] || {}).a || '', asked: !!(st.answers[q.key] || {}).asked })),
    objections: st.objections.map(id => (KC.OBJECTIONS.find(o => o.id === id) || {}).label).filter(Boolean), actions: st.actions.map(a => a.text), fuDate: st.fuDate, meetingAt: st.meetingAt });
}
function callQuestions(pb) {
  if (!pb) return [];
  return [...pb.questions.map(k => ({ key: k, ...KC.QUESTIONS[k] })), ...(pb.customQuestions || []).map((q, i) => ({ key: 'c' + i, ...q }))];
}
/** Vorschläge aus dem Ergebnis übernehmen – nur, solange die Felder nicht von Hand geändert wurden. */
function applyOutcomeDefaults(st, c) {
  const oc = KC.CALL_OUTCOMES.find(o => o.id === st.outcome);
  const today = C.todayBerlin();
  if (st.fuAuto) { st.fuDate = oc && oc.fuDays ? (oc.fuDays <= 5 ? SL.addBusinessDays(today, oc.fuDays) : C.addDays(today, oc.fuDays)) : ''; st.fuTime = ''; }
  if (st.stageAuto) {
    const cur = C.stageIndex(c.v);
    let to = '';
    if (oc && oc.stage && C.STAGES.indexOf(oc.stage) > cur && C.stageOf(c.v) !== 'Closed Won') to = oc.stage;
    if (oc && oc.lost && C.processStatus(c.v) === 'active') to = 'Closed Lost';
    st.stageTo = to;
  }
  for (const o of KC.CALL_OUTCOMES) if (o.todo && o.id !== st.outcome) st.actions = st.actions.filter(a => !(a.auto && a.text === o.todo));
  if (oc && oc.todo && !st.actions.some(a => a.text === oc.todo)) st.actions.push({ text: oc.todo, prio: 2, auto: true });
}

async function saveCall(c, st, pb) {
  if (readOnlyBlocked()) return;
  const v = c.v, oc = KC.CALL_OUTCOMES.find(o => o.id === st.outcome);
  if (!oc && !st.notes.trim()) { toast('Bitte ein Ergebnis wählen oder eine Notiz schreiben.', { error: true }); return; }
  if (st.fuTime && !st.fuDate) { toast('Uhrzeit ohne Follow-up-Datum – bitte ein Datum wählen.', { error: true }); return; }
  if (oc && oc.meeting && !C.isDateTime(st.meetingAt) && !(await confirmDialog({ title: 'Termin ohne Datum?', body: 'Für „Termin vereinbart“ fehlt das Datum. Trotzdem speichern? (Das Datum kannst du später im Process Management eintragen.)', ok: 'Trotzdem speichern' }))) return;
  if (C.isFlagYes(v.dnc) && !(await confirmDialog({ title: 'Kontakt ist gesperrt', body: `<b>${esc(C.displayName(v))}</b> ist als „Nicht kontaktieren“ markiert. Trotzdem einen Anruf loggen?`, ok: 'Trotzdem loggen', danger: true }))) return;
  if (st.running) { st.elapsed = callSeconds(st); st.running = false; st.started = 0; leaveCall(); }
  const summary = C.normalizeNewlines((st.summary || '').trim() || callSummaryText(st, pb));
  if (summary.length > C.SAFE_CELL_TEXT) { toast('Die Zusammenfassung ist zu lang für eine Excel-Zelle. Bitte kürzen.', { error: true }); return; }
  const openF = activitiesOf(v.id).filter(a => C.isOpenFollowUp(a));
  if (st.closeOpen && openF.length) completeFollowUps(v.id, openF.map(a => a.key));
  if (C.isDateTime(st.meetingAt) && st.meetingAt !== v.meetingAt) { v.meetingAt = st.meetingAt; v.updated = stamp(); v.updatedBy = App.identity; }
  const sf = stageFieldsFor(c, st.stageTo);
  const objLabels = st.objections.map(id => (KC.OBJECTIONS.find(o => o.id === id) || {}).label).filter(Boolean);
  const aid = addActivity({ contactId: v.id, at: C.isDateTime(st.startAt) ? st.startAt : C.nowBerlin(), loggedBy: App.identity, type: callActType(), direction: 'Ausgehend', outcome: oc ? oc.label : '', summary,
    tplId: pb ? pb.id : '', objections: objLabels.join(', '), fuDate: st.fuDate || '', fuTime: st.fuDate && st.fuTime ? st.fuTime : '', assignedTo: st.fuDate ? App.identity : '', ...sf.fields });
  for (const a of st.actions) addTodo({ text: a.text, contactId: v.id, assignedTo: App.identity, prio: a.prio || 2 });
  // Für die Follow-up-Mail: nur, was der Kunde lesen soll (Notizen + geklärte Punkte), nicht die interne Kopfzeile
  const qa = callQuestions(pb).map(x => ({ q: SL.applyTone(x.q, 'sie'), a: (st.answers[x.key] || {}).a })).filter(x => (x.a || '').trim());
  st.mail = { tpl: (oc && oc.mailTpl) || 'de-nach-telefonat', topic: [st.notes.trim(), ...qa.map(x => `• ${x.q} – ${x.a.trim()}`)].filter(Boolean).join('\n'),
    next: st.actions.map(a => a.text).join('; ') || (st.fuDate ? `Ich melde mich am ${SL.WD_LONG[C.weekday(st.fuDate)] || ''}, ${C.displayDate(st.fuDate)}.` : '') };
  st.saved = true; st.savedAt = C.nowBerlin(); st.savedInfo = { outcome: oc ? oc.label : '', fu: st.fuDate, todos: st.actions.length, stage: sf.fields.stageAfter || '', aid };
  persistCall(st);
  if (sf.created) stageToast(c, sf.fields.stageAfter, sf.created); else toast('Anruf gespeichert.');
  renderAll();
  const to = sf.fields.stageAfter;
  if (to === 'Closed Won' || to === 'Closed Lost') closeDialog(v.id, to);
  else if (st.fuDate) calendarPrompt(aid, { fresh: true });
}

}
function paletteSearch(query) {
  const nq = norm(query).trim(), toks = nq.split(/\s+/).filter(Boolean);
  const hit = s => { const h = norm(s); return toks.every(t => h.includes(t)); };
  const groups = [];
  const acts = paletteActions().filter(a => !toks.length || hit(a.label));
  let quick = null;
  if (query.trim()) {
    const cur = (App.ui.view === 'contact' || App.ui.view === 'call') ? contactById(App.ui.contactId) : null;
    quick = { label: `Neues To-do: „${query.trim()}“${cur ? ' für ' + C.displayName(cur.v) : ''}`, quick: true, run: () => { if (readOnlyBlocked()) return; addTodo({ text: query.trim().slice(0, 500), contactId: cur ? cur.v.id : '', assignedTo: App.identity, prio: 2 }); toast('To-do angelegt.'); } };
  }
  if (acts.length) groups.push({ title: 'Aktionen', items: acts.slice(0, toks.length ? 6 : 14) });
  if (!toks.length) {
    const rc = recentContacts().slice(0, 6);
    if (rc.length) groups.push({ title: 'Zuletzt geöffnet', items: rc.map(c => ({ label: C.displayName(c.v), sub: [c.v.company !== C.displayName(c.v) ? c.v.company : '', C.stageOf(c.v)].filter(Boolean).join(' · '), run: () => openContact(c.v.id) })) });
    return groups;
  }
  const cs = [];
  for (const c of visibleContacts()) { if (hit(haystack(c))) { cs.push(c); if (cs.length >= 8) break; } }
  if (cs.length) groups.push({ title: 'Kontakte', items: cs.map(c => ({ label: C.displayName(c.v), sub: [c.v.position, c.v.company !== C.displayName(c.v) ? c.v.company : '', C.stageOf(c.v), c.v.phone].filter(Boolean).join(' · '), run: () => openContact(c.v.id), alt: { label: 'Anruf', run: () => openCall(c.v.id) } })) });
  const todos = [], hist = [];
  for (const a of App.work.activities) {
    if (C.isOpenTodo(a) && todos.length < 5 && hit(a.v.nextStep + ' ' + (a.v.summary || ''))) todos.push(a);
    else if (hist.length < 5 && a.v.summary && a.v.type !== C.TODO_TYPE && hit(a.v.summary)) hist.push(a);
  }
  const who = a => { const c = contactById(a.v.contactId); return c ? C.displayName(c.v) : 'ohne Kontakt'; };
  if (todos.length) groups.push({ title: 'Offene To-dos', items: todos.map(a => ({ label: a.v.nextStep, sub: who(a), run: () => a.v.contactId && contactById(a.v.contactId) ? openContact(a.v.contactId) : go('today') })) });
  if (hist.length) groups.push({ title: 'Verlauf', items: hist.map(a => ({ label: String(a.v.summary).split('\n')[0].slice(0, 120), sub: `${who(a)} · ${a.v.type} · ${C.displayDate(String(a.v.at).slice(0, 10))}`, run: () => contactById(a.v.contactId) ? openContact(a.v.contactId) : go('today') })) });
  const tp = templates().filter(t => !t.hidden && hit(t.name + ' ' + t.subject + ' ' + t.tags.join(' '))).slice(0, 5);
  if (tp.length) groups.push({ title: 'Mail-Vorlagen', items: tp.map(t => ({ label: t.name, sub: t.cat + (t.lang === 'en' ? ' · EN' : ''), run: () => { App.ui.tplTab = 'mail'; App.ui.tplSel = t.id; App.ui.tplFilter = null; go('templates'); } })) });
  const pbs = KC.PLAYBOOKS.filter(p => hit(p.name + ' ' + p.goal)).slice(0, 3);
  if (pbs.length) groups.push({ title: 'Telefonleitfäden', items: pbs.map(p => ({ label: p.name, sub: p.goal, run: () => { App.ui.tplTab = 'calls'; App.ui.pbSel = p.id; go('templates'); } })) });
  if (quick) groups.push({ title: 'Schnell anlegen', items: [quick] });
  return groups;
}

  const paint = () => {
    const groups = paletteSearch(inp.value); flat = [];
    res.innerHTML = groups.map(g => `<div class="pal-grp">${esc(g.title)}</div>` + g.items.map(it => { const i = flat.push(it) - 1; return `<div class="pal-it${i === sel ? ' sel' : ''}" role="option" aria-selected="${i === sel}" data-i="${i}"><span class="l">${esc(it.label)}</span>${it.sub ? `<span class="s">${esc(it.sub)}</span>` : ''}${it.hint ? `<kbd>${esc(it.hint)}</kbd>` : ''}${it.alt ? `<button type="button" class="btn sm ghost" data-alt="${i}">${esc(it.alt.label)}</button>` : ''}</div>`; }).join('')).join('')
      || '<div class="muted" style="padding:14px">Nichts gefunden.</div>';
    $$('.pal-it', res).forEach(r => { r.onmousemove = () => { if (sel !== +r.dataset.i) { sel = +r.dataset.i; mark(); } }; r.onclick = e => { if (e.target.closest('[data-alt]')) return; run(+r.dataset.i, false); }; });
    $$('[data-alt]', res).forEach(b => b.onclick = () => run(+b.dataset.alt, true));
  };
  const mark = () => $$('.pal-it', res).forEach(r => { const on = +r.dataset.i === sel; r.classList.toggle('sel', on); r.setAttribute('aria-selected', String(on)); if (on) r.scrollIntoView({ block: 'nearest' }); });
  const run = (i, alt) => { const it = flat[i]; if (!it) return; d.close(); const fn = alt && it.alt ? it.alt.run : it.run; setTimeout(fn, 0); };
  inp.addEventListener('input', () => { sel = 0; paint(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(flat.length - 1, sel + 1); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel, e.shiftKey); }
  });
  paint(); inp.focus();
}

/* ----- Liste „Nächste beste Aktionen“ (Heute) ----- */
function nbaList(onlyMine) {
  const today = C.todayBerlin(), st = S(), out = [];
  for (const c of visibleContacts()) {
    if (onlyMine && c.v.owner && c.v.owner !== App.identity) continue;
    const r = SL.nextBestAction(c.v, activitiesOf(c.v.id), today, st);
    if (r.score > 0 && r.action.kind !== 'none') out.push({ c, r });
  }
  return out.sort((a, b) => b.r.score - a.r.score || C.displayName(a.c.v).localeCompare(C.displayName(b.c.v), 'de'));
}

      <p class="hint">Sortiert nach Punkten aus festen Regeln (Zahl antippen bzw. darüberfahren zeigt die Gründe). Gewichte: Einstellungen › Prioritätsregeln.</p></div>`}</section>`;

function applyTheme() {
  const t = LS.get('theme', 'auto');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

/* ----- Start ---------------------------------------------------------------- */
async function boot() {
  applyTheme();
  try { if (qs.get('as')) sessionStorage.setItem('crm.as', qs.get('as')); } catch (_) { /* egal */ }
  let asOverride = null; try { asOverride = sessionStorage.getItem('crm.as'); } catch (_) { /* egal */ }
  App.identity = asOverride || LS.get('identity', null);
  if (!FS_SUPPORTED) return renderFallbackStart();
  const dir = await IDB.get('crmDir'), bak = await IDB.get('backupDir');
  DATA_FILE = (await IDB.get('dataFile')) || C.SCHEMA.dataFile;
  if (!App.identity || !dir || !bak) return renderSetup({ dir, bak });
  App.dir = dir; App.backupDir = bak;
  if ((await hasPermission(dir, false)) && (await hasPermission(bak, false))) return connect();
  renderReconnect();
}
async function connect() {
  try {
    App.mode = 'fs';
    App.file = await App.dir.getFileHandle(DATA_FILE);
    await loadFromDisk();
    startApp();
  } catch (e) {
    const x = explainFsError(e, 'CRM-Ordner');
    renderSetup({ dir: App.dir, bak: App.backupDir, error: x.text });
  }
}
function startApp() {
  // Umbenannte Gründer: alte, in diesem Browser gespeicherte Namen auf den neuen Namen umstellen.
  const RENAMED = { Linkert: 'Linker' };
  const names = (S().founders || []).map(f => f.name);
  if (RENAMED[App.identity] && names.includes(RENAMED[App.identity]) && !names.includes(App.identity)) {
    App.identity = RENAMED[App.identity];
    try { if (sessionStorage.getItem('crm.as')) sessionStorage.setItem('crm.as', App.identity); else LS.set('identity', App.identity); } catch (_) { LS.set('identity', App.identity); }
  }
  renderShell();
  renderAll();
  if (App.mode === 'fs') startPolling();
  clearInterval(App._dueTimer); App._dueTimer = setInterval(checkDue, 60000); setTimeout(checkDue, 1500);
  setTimeout(() => { App._issueCount = currentIssues().filter(i => i.level !== 'info').length; renderNav(); }, 300);
  const q = $('#q'); if (q && App.ui.view !== 'today') q.focus();
}

/** Prüft, ob eine .xlsx im Ordner überhaupt eine CRM-Datei ist (Blätter Contacts/Activities/Settings). */
async function checkCrmFile(dir, name) {
  try {
    const f = await (await dir.getFileHandle(name)).getFile();
    const L = C.loadWorkbook(new Uint8Array(await f.arrayBuffer()));
    const missingSheets = L.problems.filter(p => /Das Blatt/.test(p.message));
    if (missingSheets.length >= 2) return { ok: false, text: `„${name}“ ist keine CRM-Datei – es fehlen die Blätter Contacts, Activities und Settings (gefunden: ${L.book.sheets.map(x => x.name).join(', ') || 'keine'}). Bitte den Ordner wählen, in dem crm-data.xlsx liegt.` };
    return { ok: true };
  } catch (e) { return { ok: false, text: `„${name}“ lässt sich nicht als Excel-Datei lesen: ${explainFsError(e).text}` }; }
}
function pickXlsxDialog(folder, names) {
  return new Promise(res => {
    let chosen = null;
    const d = openDlg(`<div class="dlg"><div class="dlg-head"><h2>Keine crm-data.xlsx gefunden</h2><p>Im Ordner „${esc(folder)}“ liegen andere Excel-Dateien. Welche ist die CRM-Datenbank?</p></div>
      <div class="dlg-body"><div class="chips">${names.map((n, i) => `<button type="button" class="chip" data-i="${i}">${esc(n)}</button>`).join('')}</div>
      <div class="alert">Konfliktkopien (z. B. mit Gerätenamen im Namen) sind nicht die richtige Datei. Für den Echtbetrieb sollte die Datei crm-data.xlsx heißen.</div></div>
      <div class="dlg-foot"><button class="btn" data-x>Abbrechen</button></div></div>`, { onClose: () => res(chosen) });
    $$('[data-i]', d).forEach(b => b.onclick = () => { chosen = names[+b.dataset.i]; d.close(); });
    $('[data-x]', d).onclick = () => d.close();
  });
}
async function checkBackupFolder(bak, crm) {
  if (crm) {
    if (await bak.isSameEntry(crm)) return { error: 'Der Backup-Ordner darf nicht der CRM-Ordner sein. Bitte einen lokalen Ordner außerhalb des synchronisierten Ordners wählen.' };
    try { if (await crm.resolve(bak)) return { error: 'Der Backup-Ordner liegt im CRM-Ordner und würde mitsynchronisiert. Bitte einen Ordner außerhalb wählen.' }; } catch (_) { /* nicht enthalten */ }
    try { if (await bak.resolve(crm)) return { warn: 'Der CRM-Ordner liegt in diesem Backup-Ordner. Falls dieser Ordner selbst synchronisiert wird, landen die Backups in der Cloud. Besser einen eigenen Ordner wie „CRM-Backups“ anlegen.' }; } catch (_) { /* egal */ }
  }
  const names = await listNames(bak);
  if (names.some(n => /\.(xlsx|docx|pdf)$/i.test(n) && !C.parseBackupName(n, DATA_FILE)) && names.length > 20) return { warn: 'In diesem Ordner liegen viele andere Dateien. Ein eigener Ordner „CRM-Backups“ ist übersichtlicher.' };
  return {};
}
async function validateBackupFolder(d) {
  const v = await checkBackupFolder(d, App.dir);
  if (v.error) { await infoDialog('Ungeeigneter Backup-Ordner', esc(v.error)); return false; }
  if (v.warn) toast(v.warn, { ms: 9000 });
  return true;
}
async function changeCrmFolder() {
  if (App.dirty && !(await saveNow({ explicit: true, gesture: true }))) { toast('Erst speichern, dann den Ordner wechseln.', { error: true }); return; }
  try {
    const d = await pickFolder('crm-folder');
    let name = C.SCHEMA.dataFile;
    let fh = await d.getFileHandle(name).catch(() => null);
    if (!fh) {
      const cls = C.classifyFolder(await listNames(d), name);
      const others = [...cls.otherXlsx, ...cls.conflictCopies];
      if (!others.length) { await infoDialog('Keine CRM-Datei', `Im Ordner „${esc(d.name)}“ liegt keine Excel-Datei.`); return; }
      name = await pickXlsxDialog(d.name, others); if (!name) return;
      const chk = await checkCrmFile(d, name);
      if (!chk.ok) { await infoDialog('Keine CRM-Datei', esc(chk.text)); return; }
      fh = await d.getFileHandle(name);
    }
    DATA_FILE = name;
    App.dir = d; App.file = fh; await IDB.set('crmDir', d); await IDB.set('dataFile', name);
    await loadFromDisk(); startPolling(); toast('CRM-Ordner gewechselt.');
  } catch (e) { if (!(e instanceof UserCancelled)) toast(explainFsError(e).text, { error: true }); }
}

/* ----- Tastatur ----------------------------------------------------------------- */
document.addEventListener('keydown', e => {
  if (!App.work || !$('#nav')) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (App.mode === 'fallback') saveFallback(); else saveNow({ explicit: true, gesture: true }); return; }
  if ($('dialog[open]')) return;
  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (App.ui.view === 'call') return;   // Anruf-Modus hat eigene Tasten (1–9 Ergebnis)
  const k = e.key;
  if (k === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (k === 'n' || k === 'N') { e.preventDefault(); contactForm(); return; }
  if (k === 'l' || k === 'L') { const id = selectedContactId(); if (id) { e.preventDefault(); activityForm(id); } return; }
  if ((k === 'e' || k === 'E') && App.ui.view === 'contact') { e.preventDefault(); contactForm(App.ui.contactId); return; }
  if (k === 'a' || k === 'A') { const id = App.ui.view === 'contact' ? App.ui.contactId : selectedContactId(); if (id) { e.preventDefault(); openCall(id); } return; }
  if (k === 'm' || k === 'M') { const id = App.ui.view === 'contact' ? App.ui.contactId : selectedContactId(); if (id) { e.preventDefault(); composeMail({ contactId: id }); } return; }
  if (k === 'v' || k === 'V') return go('templates');
  if (k === 't' || k === 'T') return go('today');
  if (k === 'k' || k === 'K') return go('contacts');
  if (k === 'g' || k === 'G') return go('cold');
  if (k === '?') return go('help');
  if ((k === 'ArrowLeft' || k === 'ArrowRight') && App.ui.view === 'contact' && !(e.target.closest && e.target.closest('.thermo, .thermo-tube, [role="slider"]'))) { e.preventDefault(); stepContact(k === 'ArrowRight' ? 1 : -1); return; }
  if (k === 'ArrowDown') { e.preventDefault(); moveSel(1); return; }
  if (k === 'ArrowUp') { e.preventDefault(); moveSel(-1); return; }
  if (k === 'Enter') { const id = selectedContactId(); if (id && App.ui.view !== 'contact') { e.preventDefault(); openContact(id); } return; }
  if (k === 'Escape') { const p = $('#statuspop'); if (p) { p.remove(); return; } if (App.ui.view === 'contact') go('contacts'); }
});

/* ----- Fällige Follow-ups (nur solange das Tool offen ist) ------------------------ */
function checkDue() {
  if (!App.work) return;
  let seen = []; try { seen = JSON.parse(sessionStorage.getItem('crm.notified') || '[]'); } catch (_) { /* egal */ }
  const due = openFollowUps(C.todayBerlin(), true).filter(x => isDue(x.a) && !seen.includes(x.a.key + '|' + C.followUpKey(x.a)));
  for (const { a, c } of due.slice(0, 3)) {
    const when = C.isTime(a.v.fuTime) ? a.v.fuTime.slice(0, 5) : 'heute';
    toast(`Fällig (${when}): ${C.displayName(c.v)}${a.v.nextStep ? ' – ' + a.v.nextStep : ''}`, { ms: 15000, action: { label: 'Öffnen', run: () => openContact(c.v.id) } });
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      try { const n = new Notification('Follow-up fällig: ' + C.displayName(c.v), { body: a.v.nextStep || '', tag: a.key }); n.onclick = () => { window.focus(); openContact(c.v.id); }; } catch (_) { /* egal */ }
    }
  }
  seen.push(...due.map(x => x.a.key + '|' + C.followUpKey(x.a)));
  try { sessionStorage.setItem('crm.notified', JSON.stringify(seen.slice(-500))); } catch (_) { /* egal */ }
  renderNav();
  const n = openFollowUps(C.todayBerlin(), true).filter(x => isDue(x.a)).length;
  document.title = (n ? `(${n}) ` : '') + 'CRM – N3 Digital';
}

// Nur lesender Einblick für automatische Tests und Fehlersuche in der Browser-Konsole.
window.CRMDebug = { state: () => ({ dirty: App.dirty, saving: App.saving, status: App.status.s, text: App.status.text, mode: App.mode, identity: App.identity }), log: () => DEBUG_LOG.slice() };
window.addEventListener('beforeunload', e => { if (App.dirty || App.saving) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && App.mode === 'fs') poll(); });
window.addEventListener('error', e => console.error('Fehler:', e.error || e.message));
boot().catch(e => { $('#root').innerHTML = `<div class="setup"><div class="setup-card"><h1>Start fehlgeschlagen</h1><div class="alert err">${esc(e && e.message || String(e))}</div></div></div>`; });

})();
