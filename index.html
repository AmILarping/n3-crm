  --ink: #111C2D;
  --ink-2: #33415A;
  --muted: #5E6B80;
  --line: #DCE3EC;
  --line-2: #EAEFF5;
  --accent: #2563EB;
  --accent-hover: #1D4FD8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EDFF;
  --ok-solid: #16A34A;
  --ok-solid-hover: #12873D;
  --danger-solid: #DC2626;
  --danger-solid-hover: #B91C1C;
  --mail: #7C3AED;
  --mail-hover: #6D28D9;
  --danger: #C81E1E;
  --danger-soft: #FDECEC;
  --warn: #8A5A00;
  --warn-soft: #FFF6D6;
  --ok: #157F3B;
  --ok-soft: #E4F7EA;
  --focus: #2563EB;
  --shadow: 0 1px 2px rgba(17, 28, 45, .05), 0 10px 28px rgba(17, 28, 45, .08);
  --serif: "Iowan Old Style", "Charter", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-s: 5px;
  --r-m: 8px;
  --row-h: 40px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171A; --surface: #182024; --surface-2: #1D262B; --surface-3: #243036;
    --ink: #E4EBED; --ink-2: #C3CED2; --muted: #8E9EA5; --line: #2C383E; --line-2: #243036;
    --accent: #7DBBD0; --accent-hover: #98CADB; --accent-ink: #0E1A1F; --accent-soft: #1E3A44;
    --danger: #F2877C; --danger-soft: #3A1E1B; --warn: #F0C463; --warn-soft: #3A2F14; --ok: #7FD1A4; --ok-soft: #173326;
    --focus: #8CCBE0; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --ok-solid: #22A55A; --ok-solid-hover: #2FBF6A; --danger-solid: #E5484D; --danger-solid-hover: #F06065; --mail: #8B5CF6; --mail-hover: #9D74F7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171A; --surface: #182024; --surface-2: #1D262B; --surface-3: #243036;
  --ink: #E4EBED; --ink-2: #C3CED2; --muted: #8E9EA5; --line: #2C383E; --line-2: #243036;
  --accent: #7DBBD0; --accent-hover: #98CADB; --accent-ink: #0E1A1F; --accent-soft: #1E3A44;
  --danger: #F2877C; --danger-soft: #3A1E1B; --warn: #F0C463; --warn-soft: #3A2F14; --ok: #7FD1A4; --ok-soft: #173326;
  --focus: #8CCBE0; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --ok-solid: #22A55A; --ok-solid-hover: #2FBF6A; --danger-solid: #E5484D; --danger-solid-hover: #F06065; --mail: #8B5CF6; --mail-hover: #9D74F7;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--sans); font-feature-settings: "tnum" 1, "lnum" 1;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ----- Grundgerüst ----------------------------------------------------- */
.app { display: grid; grid-template-columns: 208px 1fr; height: 100vh; }
.side {
  border-right: 1px solid var(--line); background: var(--surface-2);
  display: flex; flex-direction: column; padding: 16px 10px 12px; gap: 2px; min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 16px; }
.brand .logo { flex: none; width: 36px; height: 36px; border-radius: 7px; background: var(--logo) center / contain no-repeat; box-shadow: 0 0 0 1px var(--line); }
.brand b { display: block; font: 600 16px/1.1 var(--serif); letter-spacing: .01em; }
.brand span { display: block; color: var(--muted); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.nav button {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px;
  border: 0; background: none; padding: 7px 10px; border-radius: var(--r-s); cursor: pointer; text-align: left; color: var(--ink-2);
}
.nav button:hover { background: var(--surface-3); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav .count { font-size: 12px; color: var(--muted); font-weight: 500; }
.nav .count.due { color: var(--danger); font-weight: 600; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.side-foot strong { color: var(--ink); font-weight: 600; }
.side-foot button { justify-self: start; border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top {
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.search { position: relative; flex: 1; max-width: 520px; }
.search input {
  width: 100%; height: 34px; padding: 0 12px 0 30px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-2);
}
.search input:focus { background: var(--surface); }
.search svg { position: absolute; left: 10px; top: 10px; width: 14px; height: 14px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 7px; }
kbd {
  font: 11px/18px var(--sans); padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface);
}
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.status {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 11px 4px 9px; background: var(--surface); cursor: pointer; font-size: 12.5px; color: var(--ink-2); white-space: nowrap;
}
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-s="saved"] i, .status[data-s="updated"] i { background: var(--ok); }
.status[data-s="dirty"] i, .status[data-s="saving"] i { background: #D29A1E; }
.status[data-s="error"] { border-color: var(--danger); color: var(--danger); }
.status[data-s="error"] i { background: var(--danger); }
.status[data-s="readonly"] i { background: var(--danger); }

.banners { display: grid; gap: 0; }
.banner {
  display: flex; gap: 12px; align-items: center; padding: 9px 20px; border-bottom: 1px solid var(--line); font-size: 13px;
  background: var(--warn-soft); color: var(--ink);
}
.banner.err { background: var(--danger-soft); }
.banner.info { background: var(--accent-soft); }
.banner .grow { flex: 1; }
.banner b { font-weight: 600; }

.content { flex: 1; min-height: 0; overflow: auto; padding: 22px 28px 40px; }
.content.flush { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.view-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.view-head h1 { margin: 0; font: 600 21px/1.2 var(--sans); letter-spacing: -.005em; }
.view-head p { margin: 4px 0 0; color: var(--muted); }
.view-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ----- Buttons & Felder ------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); cursor: pointer; white-space: nowrap; color: var(--ink);
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; font-weight: 600; }
.btn.danger.solid:hover { background: var(--danger-solid-hover); }
/* Entscheidungsfarben: Grün = positiv/bestätigen, Rot = entfernen/verwerfen, Blau = Hauptaktion, Violett = E-Mail */
.btn.ok { background: var(--ok-solid); border-color: var(--ok-solid); color: #fff; font-weight: 600; }
.btn.ok:hover { background: var(--ok-solid-hover); border-color: var(--ok-solid-hover); }
.btn.ok-soft { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; }
.btn.ok-soft:hover { border-color: var(--ok-solid); background: var(--ok-soft); }
.btn.danger-soft { background: var(--danger-soft); border-color: transparent; color: var(--danger); font-weight: 600; }
.btn.danger-soft:hover { border-color: var(--danger-solid); background: var(--danger-soft); }
.btn.mail { background: var(--mail); border-color: var(--mail); color: #fff; font-weight: 600; }
.btn.mail:hover { background: var(--mail-hover); }
.btn.ok[disabled], .btn.mail[disabled] { background: var(--surface-3); border-color: var(--line); color: var(--muted); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn kbd { margin-left: 2px; }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
label.f > span { color: var(--ink-2); font-weight: 500; }
input.in, select.in, textarea.in {
  height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: var(--ink); width: 100%; font-size: 14px;
}
textarea.in { height: auto; min-height: 64px; padding: 7px 9px; resize: vertical; line-height: 1.45; }
input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.in.warn { border-color: #D29A1E; }
.hint { font-size: 12px; color: var(--muted); }
.hint.warn { color: var(--warn); }
.hint.err { color: var(--danger); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
.span2 { grid-column: span 2; }
.span3 { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; color: var(--ink-2);
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip small { color: inherit; opacity: .55; margin-right: 4px; font-size: 11px; }

/* ----- Tabelle (virtuell) ---------------------------------------------- */
.filters { display: flex; gap: 8px; align-items: center; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.filters select.in { width: auto; height: 30px; font-size: 13px; }
.filters .counts { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.vt { flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--surface); }
.vt-head, .vt-row { display: grid; align-items: center; column-gap: 12px; padding: 0 28px; }
.vt-head {
  position: sticky; top: 0; z-index: 2; height: 34px; background: var(--surface-2); border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--muted); font-weight: 600;
}
.vt-head button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; display: inline-flex; gap: 4px; align-items: center; }
.vt-head button[aria-sort="ascending"]::after { content: "▲"; font-size: 8px; }
.vt-head button[aria-sort="descending"]::after { content: "▼"; font-size: 8px; }
.vt-row { position: absolute; left: 0; right: 0; height: var(--row-h); border-bottom: 1px solid var(--line-2); cursor: pointer; font-size: 13.5px; }
.vt-row:hover { background: var(--surface-2); }
.vt-row[aria-selected="true"] { background: var(--accent-soft); }
.vt-row > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vt-row .name { font-weight: 600; }
.vt-row .sub { color: var(--muted); }
.cell-dnc { color: var(--danger); font-weight: 600; font-size: 12px; }
.overdue { color: var(--danger); font-weight: 600; }
.empty {
  display: grid; place-items: center; text-align: center; padding: 64px 24px; color: var(--muted);
}
.empty h2 { margin: 0 0 6px; font: 600 17px/1.3 var(--sans); color: var(--ink); }
.empty p { margin: 0 0 14px; max-width: 46ch; }

/* ----- Temperatur ------------------------------------------------------- */
.tbar { display: inline-flex; align-items: center; gap: 8px; }
.tbar .track { display: block; width: 56px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.tbar .fill { display: block; height: 100%; border-radius: 3px; }
.tbar .n { width: 22px; text-align: right; font-weight: 600; font-size: 13px; }
.tbar.none .n { color: var(--muted); font-weight: 400; }

.thermo { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: stretch; user-select: none; }
.thermo-tube {
  position: relative; width: 30px; height: 240px; border-radius: 15px; background: var(--surface-3);
  border: 1px solid var(--line); cursor: ns-resize; touch-action: none; overflow: hidden;
}
.thermo-tube:focus-visible { outline-offset: 3px; }
.thermo-fill { position: absolute; left: 0; right: 0; bottom: 0; transition: height .18s ease; }
.thermo-tube.unrated { background: repeating-linear-gradient(-45deg, var(--surface-3) 0 6px, var(--surface-2) 6px 12px); }
.thermo-knob { position: absolute; left: -3px; right: -3px; height: 3px; background: var(--ink); border-radius: 2px; }
.thermo-scale { position: relative; height: 240px; font-size: 12px; line-height: 14px; color: var(--muted); min-width: 104px; }
.thermo-scale .tick { position: absolute; left: 0; width: 30px; transform: translateY(50%); display: flex; justify-content: flex-end; align-items: center; gap: 4px; white-space: nowrap; font-size: 11px; }
.thermo-scale .tick::after { content: ""; width: 5px; height: 1px; background: var(--muted); opacity: .6; }
.thermo-scale .band { position: absolute; left: 38px; transform: translateY(50%); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.thermo-scale .band.on { color: var(--ink); font-weight: 700; }
.thermo-read { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
.thermo-read .big { font: 600 34px/1 var(--serif); }
.thermo-read .bandname { font-weight: 600; }
.thermo-ctrl { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.thermo-ctrl input { width: 64px; text-align: center; }
.thermo.compact .thermo-tube, .thermo.compact .thermo-scale { height: 168px; }
.thermo.compact .thermo-read .big { font-size: 26px; }
.thermo.compact .thermo-scale .band { font-size: 11.5px; }

/* ----- Kontaktseite ----------------------------------------------------- */
.crumbs { margin-bottom: 14px; font-size: 13px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
.contact { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; max-width: 1180px; }
.contact h1 { margin: 0; font: 600 31px/1.15 var(--serif); letter-spacing: -.005em; }
.contact .company { font-size: 16px; color: var(--ink-2); margin-top: 4px; }
.contact .meta { color: var(--muted); font-size: 13px; margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
.dnc {
  margin: 14px 0 0; padding: 10px 14px; border-radius: var(--r-m); background: var(--danger-soft); color: var(--danger); font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
}
.c-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0 22px; }
.c-actions .spacer { flex: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); }
.panel + .panel { margin-top: 16px; }
.panel h2 { margin: 0; padding: 12px 16px; font: 600 14px/1.3 var(--sans); border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 8px; }
.panel h2 .grow { flex: 1; }
.panel .body { padding: 14px 16px; }
.lastint { border-left: 3px solid var(--accent); }
.lastint .when { color: var(--muted); font-size: 12.5px; }
.lastint .what { font-size: 15px; margin-top: 4px; white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: 92px 1fr; gap: 7px 12px; margin: 0; font-size: 13.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.copy { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 12px; }
.copy:hover { color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.timeline li:last-child { border-bottom: 0; }
.timeline .t { color: var(--muted); font-size: 12.5px; }
.timeline .h { font-weight: 600; }
.timeline .h .o { font-weight: 400; color: var(--ink-2); }
.timeline .s { white-space: pre-wrap; margin-top: 2px; overflow-wrap: anywhere; }
.timeline .fu { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); font-size: 12px; color: var(--ink-2); }
.tag.open { background: var(--accent-soft); color: var(--ink); }
.tag.done { text-decoration: line-through; opacity: .7; }
.tag.late { background: var(--danger-soft); color: var(--danger); }

/* ----- Heute ------------------------------------------------------------ */
.today-group { margin-bottom: 26px; max-width: 1100px; }
.today-group h2 { margin: 0 0 8px; font: 600 13px/1.3 var(--sans); color: var(--muted); }
.today-group h2.late { color: var(--danger); }
.fu-item {
  display: grid; grid-template-columns: 92px minmax(0, 1.2fr) minmax(0, 1.4fr) 92px auto; gap: 14px; align-items: center;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 6px;
}
.fu-item .when { font-weight: 600; }
.fu-item .who { min-width: 0; }
.fu-item .who button { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; color: var(--ink); text-align: left; }
.fu-item .who button:hover { color: var(--accent); text-decoration: underline; }
.fu-item .who .sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fu-item .step { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fu-item .acts { display: flex; gap: 4px; }
.fu-item[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* ----- Dialoge ---------------------------------------------------------- */
dialog {
  border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
}
dialog.wide { width: min(920px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(17, 23, 26, .42); }
dialog form, dialog .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line-2); }
.dlg-head h2 { margin: 0; font: 600 17px/1.3 var(--sans); }
.dlg-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.dlg-body { padding: 16px 20px; overflow: auto; display: grid; gap: 14px; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 10px 10px; }
.dlg-foot .left { margin-right: auto; color: var(--muted); font-size: 12px; }
.alert { padding: 10px 12px; border-radius: var(--r-s); font-size: 13px; background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.alert.err { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.alert.info { background: var(--accent-soft); border-color: transparent; }
.log-grid { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; }
.fu-quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.conflict { border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; display: grid; gap: 8px; }
.conflict .vals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.conflict label.opt { border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; display: grid; gap: 4px; cursor: pointer; font-size: 13px; }
.conflict label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.conflict .v { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }

/* ----- Einstellungen & Listen ------------------------------------------ */
.settings { max-width: 980px; display: grid; gap: 16px; }
.settings .panel .body { display: grid; gap: 14px; }
.rows { display: grid; gap: 6px; }
.rows .r { display: grid; gap: 8px; align-items: center; }
.issues { list-style: none; padding: 0; margin: 0; }
.issues li { display: grid; grid-template-columns: 76px 110px 1fr auto; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line-2); align-items: center; font-size: 13.5px; }
.lvl { font-size: 12px; font-weight: 600; }
.lvl.error { color: var(--danger); } .lvl.warn { color: var(--warn); } .lvl.info { color: var(--muted); }
table.plain { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.plain th, table.plain td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.plain th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }

/* ----- Ersteinrichtung -------------------------------------------------- */
.setup { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
.setup-card { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 30px 32px; }
.setup-card h1 { margin: 0 0 6px; font: 600 26px/1.2 var(--serif); }
.setup-card::before { content: ""; display: block; width: 64px; height: 64px; margin-bottom: 18px; border-radius: 12px; background: var(--logo) center / contain no-repeat; box-shadow: 0 0 0 1px var(--line); }
.setup-card .lead { margin: 0 0 22px; color: var(--ink-2); }
.steps { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; counter-increment: s; }
.steps li::before {
  content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600;
  background: var(--surface-3); color: var(--ink-2);
}
.steps li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
.steps li.cur::before { background: var(--accent); color: var(--accent-ink); }
.steps h3 { margin: 2px 0 2px; font-size: 14.5px; }
.steps p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.who-pick { display: flex; gap: 8px; flex-wrap: wrap; }

/* ----- Toasts ----------------------------------------------------------- */
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 50; width: min(380px, calc(100vw - 36px)); }
.toast {
  background: var(--ink); color: var(--surface); border-radius: var(--r-m); padding: 10px 12px 10px 14px; box-shadow: var(--shadow);
  display: flex; gap: 10px; align-items: center; font-size: 13.5px;
}
.toast .grow { flex: 1; }
.toast button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 600; padding: 2px 4px; }
.toast.err { background: var(--danger); color: #fff; }

.help { max-width: 760px; }
.help h2 { font: 600 16px/1.3 var(--sans); margin: 24px 0 8px; }
.help p, .help li { color: var(--ink-2); }
.help table td:first-child { white-space: nowrap; }
.pop { position: absolute; z-index: 40; right: 20px; top: 52px; width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; font-size: 13px; }
.pop h3 { margin: 0 0 6px; font-size: 13.5px; }
.pop ul { margin: 6px 0 0; padding-left: 18px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .contact { grid-template-columns: 1fr; }
  .fu-item { grid-template-columns: 80px 1fr; }
  .fu-item .step, .fu-item .acts { grid-column: 2; }
  .log-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .side, .top, .banners, .filters { display: none; } }
.content:focus { outline: none; }

.alert.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.tag.ph { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.tag.webcat { background: #F3E8FF; color: #6B21A8; }
:root[data-theme="dark"] .tag.webcat { background: #2E1F47; color: #D8B4FE; }
.tpl { border-top: 1px solid var(--line-2); padding-top: 12px; display: grid; gap: 10px; }
.tpl:first-of-type { border-top: 0; padding-top: 0; }
textarea.in.warn, input.in.warn { border-color: #E3B341; background: #FFFDF3; }
.nav button[aria-current="page"] { box-shadow: inset 3px 0 0 var(--accent); color: var(--accent); }
.side { background: var(--surface); }
.top { box-shadow: 0 1px 0 var(--line-2); }

/* Kategorien hinzufügen/entfernen */
.addrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.f > .addrow:first-of-type { margin-top: 0; }
.addrow .in { flex: 1; min-width: 0; }
.addrow[hidden] { display: none; }
.chip.cat { display: inline-flex; align-items: center; gap: 4px; padding-right: 4px; cursor: default; }
.chip.cat small { margin: 0 0 0 2px; }
.chip.cat .x { border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 999px; cursor: pointer; }
.chip.cat .x:hover { background: var(--danger-soft); color: var(--danger-solid); }
#catpanel .chips { margin-bottom: 8px; }
.tag.owner { background: var(--accent-soft, #E8EFFD); color: var(--accent); }

/* ----- Heute: links To-dos, rechts Follow-ups --------------------------- */
.today-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 24px; align-items: start; max-width: 1400px; }
.today-col { min-width: 0; }
.today-col .today-group { max-width: none; }
.col-h { margin: 0 0 12px; font: 650 15px/1.3 var(--sans); color: var(--ink); display: flex; align-items: center; gap: 8px; }
.col-h .count { font: 600 12px/1 var(--sans); background: var(--surface-3); color: var(--ink-2); padding: 3px 8px; border-radius: 999px; }
.today-col .fu-item { grid-template-columns: 74px minmax(0, 1fr) auto; grid-template-areas: "when who tag" ". step step" ". acts acts"; row-gap: 6px; }
.today-col .fu-item .when { grid-area: when; }
.today-col .fu-item .who { grid-area: who; }
.today-col .fu-item > div:nth-child(4) { grid-area: tag; }
.today-col .fu-item .step { grid-area: step; white-space: normal; }
.today-col .fu-item .acts { grid-area: acts; flex-wrap: wrap; }
.todo-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 6px; }
.todo-list .todo-item { padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; background: none; }
.todo-list .todo-item:last-child { border-bottom: 0; }
.todo-tick { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--ok-solid); background: var(--surface); cursor: pointer; position: relative; padding: 0; }
.todo-tick:hover { background: var(--ok-soft); }
.todo-tick:hover::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--ok-solid); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.todo-main { min-width: 0; flex: 1; }
.todo-text { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.todo-item .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.todo-item .sub button { border: 0; background: none; padding: 0; text-align: left; display: inline; color: var(--ink-2); cursor: pointer; font: inherit; }
.todo-item .sub button:hover { color: var(--accent); text-decoration: underline; }
.empty.small { padding: 18px; min-height: 0; }
@media (max-width: 1100px) { .today-cols { grid-template-columns: 1fr; } }

/* To-do-Priorität: 1 = hoch (rot), 2 = mittel (gelb), 3 = niedrig (grau) */
.todo-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.prio { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.prio button { border: 0; background: var(--surface); color: var(--muted); font: 600 12px/1 var(--sans); width: 24px; height: 22px; cursor: pointer; padding: 0; }
.prio button + button { border-left: 1px solid var(--line); }
.prio button:hover { background: var(--surface-3); color: var(--ink); }
.prio button.p1[aria-pressed="true"] { background: var(--danger-solid); color: #fff; }
.prio button.p2[aria-pressed="true"] { background: #F59E0B; color: #fff; }
.prio button.p3[aria-pressed="true"] { background: #94A3B8; color: #fff; }
.todo-item.pr1 { border-left: 4px solid var(--danger-solid); }
.todo-item.pr2 { border-left: 4px solid #F59E0B; }
.todo-item.pr3 { border-left: 4px solid #CBD5E1; }
.todo-list .todo-item.pr1, .todo-list .todo-item.pr2, .todo-list .todo-item.pr3 { border-left: 0; }
[data-chips="prio"] .chip[data-v="1"][aria-pressed="true"] { background: var(--danger-solid); border-color: var(--danger-solid); }
[data-chips="prio"] .chip[data-v="2"][aria-pressed="true"] { background: #F59E0B; border-color: #F59E0B; }
[data-chips="prio"] .chip[data-v="3"][aria-pressed="true"] { background: #94A3B8; border-color: #94A3B8; }
[data-priorow][hidden] { display: none; }
.tl-acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

/* To-dos bearbeiten und zurückholen */
.todo-tools { display: inline-flex; gap: 6px; align-items: center; flex: none; }
.btn.icon { width: 26px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
.todo-text[data-edit-todo] { cursor: text; border-radius: 4px; }
.todo-text[data-edit-todo]:hover { background: var(--surface-3); }
.todo-edit { display: flex; gap: 6px; flex: 1; min-width: 0; }
.todo-edit .in { flex: 1; min-width: 0; height: 30px; }
.todo-done { margin-top: 14px; }
.todo-done summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
.todo-done summary:hover { color: var(--ink); }
.done-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.done-row:last-child { border-bottom: 0; }
.done-row .done-text { color: var(--muted); text-decoration: line-through; overflow-wrap: anywhere; }
.done-row .sub { grid-column: 1; color: var(--muted); font-size: 12px; }
.done-row .btn { grid-column: 2; grid-row: 1 / span 2; }

/* Kontaktseite: Blättern */
.crumbs { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.c-nav { display: inline-flex; align-items: center; gap: 8px; }
.c-pos { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.c-nav .btn[disabled] { opacity: .45; cursor: default; }

.crumbs .c-nav .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; font-weight: 600; }
.crumbs .c-nav .btn:not([disabled]):hover { border-color: var(--accent); color: var(--accent); }
.btn.linkedin { color: #0A66C2; border-color: #BFD7F0; }
.btn.linkedin:hover { background: #EAF3FC; }

/* Neues To-do: Kontakt wählen */
.cpick-search[hidden] { display: none; }
.cpick-res { display: grid; gap: 2px; margin-top: 4px; max-height: 240px; overflow: auto; }
.cpick-hit { text-align: left; border: 1px solid transparent; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font: inherit; }
.cpick-hit:hover, .cpick-hit[aria-selected="true"] { background: var(--surface-3); border-color: var(--line); }
.cpick-sel { font-size: 13px; padding: 4px 6px 4px 10px; }
.cpick-sel button { border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--muted); padding: 0 4px; }
.cpick-sel button:hover { color: var(--danger-solid); }

/* ----- Vertriebsphasen ---------------------------------------------------- */
.stage { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.s-cold { background: #EEF2F7; color: #475569; }
.s-early { background: #E0ECFF; color: #1D4ED8; }
.s-mid { background: #EDE7FE; color: #6D28D9; }
.s-late { background: #FFF1DB; color: #B45309; }
.s-won { background: #DCFCE7; color: #15803D; }
.s-lost { background: #FEE2E2; color: #B91C1C; }
:root[data-theme="dark"] .s-cold { background: #273142; color: #CBD5E1; }
:root[data-theme="dark"] .s-early { background: #1E2F55; color: #93C5FD; }
:root[data-theme="dark"] .s-mid { background: #2E2350; color: #C4B5FD; }
:root[data-theme="dark"] .s-late { background: #3A2A12; color: #FCD34D; }
:root[data-theme="dark"] .s-won { background: #14361F; color: #86EFAC; }
:root[data-theme="dark"] .s-lost { background: #3B1717; color: #FCA5A5; }
.stage-sel { width: 100%; font-weight: 600; }
.stage-steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; counter-reset: st; }
.stage-steps li { counter-increment: st; font-size: 12.5px; color: var(--muted); padding: 3px 8px; border-radius: 6px; display: flex; gap: 8px; }
.stage-steps li::before { content: counter(st); width: 16px; text-align: right; opacity: .6; }
.stage-steps li.past { color: var(--ink-2); }
.stage-steps li.past::before { content: "✓"; opacity: 1; color: var(--ok-solid); }
.stage-steps li.cur { font-weight: 700; }
.due-today { color: #B45309; font-weight: 600; }
.tag.tstat { background: #FFF1DB; color: #92400E; }

/* ===== Process Management ===================================================== */
.small { font-size: 12.5px; }
.btn.pm { background: #EEF2FF; color: #3730A3; border-color: #C7D2FE; }
.btn.pm:hover { background: #E0E7FF; }
.pm-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; flex-wrap: wrap; }
.pm-tabs button { border: 0; background: none; padding: 9px 14px; font: 600 13.5px/1 var(--sans); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.pm-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.pm-tabs .count { font-size: 11.5px; background: var(--surface-3); color: var(--ink-2); padding: 2px 7px; border-radius: 999px; }
.pm-filters { flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.pm-filters input[type="search"] { min-width: 220px; flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.kpi { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; font: inherit; color: var(--ink); }
.kpi:hover { border-color: var(--accent); }
.kpi.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.kpi .n { font: 700 24px/1.1 var(--sans); }
.kpi .l { font-size: 12.5px; color: var(--ink-2); }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.warn .n { color: #B45309; }
.kpi.bad .n { color: var(--danger-solid); }
.kpi.good .n { color: var(--ok-solid); }
.stage-bars { display: grid; gap: 4px; }
.sbar { display: grid; grid-template-columns: 190px 1fr 36px; align-items: center; gap: 10px; border: 0; background: none; padding: 3px 4px; border-radius: 6px; cursor: pointer; font: inherit; color: var(--ink); text-align: left; }
.sbar:hover, .sbar[aria-pressed="true"] { background: var(--surface-3); }
.sbar .bar { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.sbar .bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; min-width: 2px; }
.sbar .num { text-align: right; font-weight: 600; }
.pm-table-wrap { overflow-x: auto; }
.pm-table tbody tr { cursor: pointer; }
.pm-table tbody tr:hover { background: var(--surface-3); }
.pm-table td { vertical-align: top; }
.pm-val { font-weight: 600; color: var(--ink); white-space: nowrap; }
.flag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin: 3px 4px 0 0; white-space: nowrap; }
.flag.late { background: #FEE2E2; color: #B91C1C; }
.flag.stall { background: #FEF3C7; color: #92400E; }
.flag.wait { background: #E0F2FE; color: #075985; }
.tag.pst-active { background: #DBEAFE; color: #1D4ED8; }
.tag.pst-won { background: #DCFCE7; color: #15803D; }
.tag.pst-lost { background: #FEE2E2; color: #B91C1C; }
.tag.pst-inactive, .tag.pst-none { background: var(--surface-3); color: var(--muted); }
/* Kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.kcol { background: var(--surface-3); border-radius: var(--r-m); padding: 8px; min-height: 160px; border: 2px dashed transparent; transition: border-color .1s, background .1s; }
.kcol.over { border-color: var(--accent); background: #EEF4FF; }
.kcol header { display: flex; align-items: center; gap: 6px; padding: 2px 2px 8px; flex-wrap: wrap; }
.kcol header .cnt { font-weight: 700; font-size: 12.5px; color: var(--ink-2); }
.kcol header .sum { margin-left: auto; font-size: 12px; color: var(--muted); }
.kcards { display: grid; gap: 8px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; cursor: grab; display: grid; gap: 4px; font-size: 13px; }
.kcard:hover { border-color: var(--accent); }
.kcard:focus-visible { outline: 2px solid var(--accent); }
.kcard.dragging { opacity: .45; }
.kcard.late { border-left: 3px solid var(--danger-solid); }
.kcard.stall { border-left: 3px solid #F59E0B; }
.kc-top { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
.kc-top .flag { margin: 0; }
.kc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kc-next { color: var(--ink-2); font-size: 12.5px; }
.kc-foot { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
/* Aufgaben */
.task-desc { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; white-space: pre-wrap; }
.task-ctl { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
.task-ctl label { display: inline-flex; gap: 6px; align-items: center; }
.in.sm { height: 28px; padding: 2px 8px; font-size: 12.5px; width: auto; }
/* Prozessseite */
.stage-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pm-more > summary { list-style: none; cursor: pointer; }
.pm-more > summary::-webkit-details-marker { display: none; }
.pm-more > summary h2::after { content: " ▸"; color: var(--muted); }
.pm-more[open] > summary h2::after { content: " ▾"; }
.in.dirty { border-color: #F59E0B; background: #FFFBEB; }
.pm-savebar { position: sticky; bottom: 12px; z-index: 5; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid #F59E0B; box-shadow: 0 6px 24px rgba(15, 23, 42, .12); border-radius: var(--r-m); padding: 10px 14px; margin: 0 0 16px; flex-wrap: wrap; }
.pm-savebar > span:first-child { font-weight: 600; flex: 1; }
.pm-savebar[hidden] { display: none; }
.timeline.compact li { padding-top: 8px; padding-bottom: 8px; }
.ptl li.e-stage .t, .ptl li.e-proc .t { color: var(--accent); }
.ptl li.e-done > div:last-child { color: var(--muted); }
.ptl li.e-chg > div:last-child { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 900px) { .sbar { grid-template-columns: 140px 1fr 30px; } .kanban { grid-auto-columns: minmax(210px, 80vw); } }
.board-wrap { position: relative; }
.dropbar { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; padding: 8px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: 0 6px 20px rgba(15, 23, 42, .10); }
.dropbar[hidden] { display: none; }
.dropbar .dz { border: 2px dashed var(--line); border-radius: 8px; padding: 10px 6px; display: flex; justify-content: center; align-items: center; min-height: 44px; }
.dropbar .dz.over { border-color: var(--accent); background: #EEF4FF; }

/* Mail-Import */
.maildrop { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: rgba(37, 99, 235, .10); border: 3px dashed var(--accent); display: flex; align-items: center; justify-content: center; }
.maildrop > div { background: var(--surface); border-radius: 12px; padding: 18px 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, .18); display: grid; gap: 4px; text-align: center; }
.maildrop b { font-size: 17px; }
.maildrop span { color: var(--muted); font-size: 13px; }
.mail-facts { margin-bottom: 8px; }
.mail-pick { display: grid; gap: 6px; }
.mail-pick .check { align-items: baseline; }
.mail-new { margin: 4px 0 4px 24px; }
.cpick-search[hidden], .mail-new[hidden] { display: none; }
.mail-text { font-size: 12.5px; line-height: 1.45; background: var(--surface-2); }

/* =============================================================================
 * v3: Vorlagen, Mail-Composer, Anruf-Modus, Nächste beste Aktionen, Befehlspalette
 * ===========================================================================*/
dialog.xwide { width: min(1180px, calc(100vw - 32px)); }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.warn-t { color: var(--warn); font-weight: 600; }
mark.ph { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 2px; font-weight: 600; }
.tag.xs { font-size: 11px; padding: 0 6px; }
.tag.own { background: var(--ok-soft); color: var(--ok); }
.chips.sm .chip { padding: 3px 9px; font-size: 12px; }
.in.mono, textarea.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.star { border: 0; background: none; color: var(--line); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px; }
.star.on, .star:hover { color: #E0A100; }
span.star { cursor: default; font-size: 12px; }

/* Composer */
.compose-grid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.tpl-pick { display: grid; gap: 8px; position: sticky; top: 0; }
.tpl-list { max-height: min(56vh, 560px); overflow: auto; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface-2); }
.tpl-list .grp { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 10px 4px; }
.tpl-row { display: grid; gap: 1px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; cursor: pointer; font: 13px/1.3 var(--sans); color: var(--ink); border-left: 3px solid transparent; }
.tpl-row:hover { background: var(--surface-3); }
.tpl-row.cur { background: var(--accent-soft); border-left-color: var(--accent); }
.tpl-row .why { font-size: 11.5px; color: var(--muted); }
.compose-main { display: grid; gap: 10px; min-width: 0; }
.compose-bar { display: flex; gap: 12px; align-items: center; }
.compose-main textarea { min-height: 300px; line-height: 1.5; }

/* Vorlagen-Editor */
.tpl-edit-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.tpl-edit-form { display: grid; gap: 10px; }
.chips.vars { max-height: 96px; overflow: auto; }
.prev-bar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 8px; }
.prev-bar .f { flex: 1; min-width: 180px; }
.prev-mail { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.prev-subj { padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-weight: 600; }
.prev-body { padding: 12px 14px; white-space: pre-wrap; line-height: 1.55; font-size: 13.5px; max-height: 52vh; overflow: auto; }

/* Ansicht Vorlagen & Leitfäden */
.tpl-lib { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; max-width: 1400px; }
.tpl-side { position: sticky; top: 0; }
.tpl-items { max-height: calc(100vh - 290px); overflow: auto; border-top: 1px solid var(--line-2); }
.tpl-item { display: flex; gap: 6px; align-items: flex-start; padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent; border-bottom: 1px solid var(--line-2); }
.tpl-item:hover { background: var(--surface-2); }
.tpl-item.cur { background: var(--accent-soft); border-left-color: var(--accent); }
.tpl-item.hid { opacity: .55; }
.tpl-item .nm { font-weight: 600; font-size: 13.5px; }
.tpl-item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tpl-hint { margin: 0 0 12px; padding: 8px 12px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: var(--r-s); }
.facts.compact { grid-template-columns: 110px 1fr; font-size: 13px; margin-bottom: 14px; }
.facts.compact .hint { display: block; }
.tpl-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.pb-view h3, .call-guide h3 { font: 600 12px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
.pb-view h3:first-of-type { margin-top: 8px; }
.pb-view ul, .pb-view ol, .call-guide ul, .call-guide ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.qgrp { margin: 6px 0 10px; }
.qgrp > b, .qg { font-size: 12.5px; color: var(--ink-2); }
.obj-card { border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; margin: 8px 0; background: var(--surface); }
.obj-card ol { margin: 6px 0; padding-left: 20px; display: grid; gap: 4px; }
.obj-h { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.obj-ask { font-size: 13px; }
.obj-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; max-width: 1400px; }
.obj-wrap .panel + .panel { margin-top: 0; }
.obj-stats { display: grid; gap: 8px; }
.obj-row { display: grid; grid-template-columns: 180px minmax(60px, 1fr) 34px; gap: 4px 10px; align-items: center; font-size: 13px; }
.obj-row .bar { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.obj-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.obj-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.obj-row .muted { grid-column: 1 / -1; padding-left: 0; }

/* Nächste beste Aktionen */
.nba-panel { margin-bottom: 20px; max-width: 1400px; }
.nba-row { display: grid; grid-template-columns: 40px minmax(160px, 1fr) minmax(200px, 2fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.nba-row:last-of-type { border-bottom: 0; }
.nba-row .score { display: inline-grid; place-items: center; width: 34px; height: 26px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 700 12.5px/1 var(--sans); cursor: help; }
.nba-row .who button { border: 0; background: none; padding: 0; font: 600 13.5px/1.3 var(--sans); color: var(--ink); cursor: pointer; text-align: left; }
.nba-row .who button:hover { color: var(--accent); text-decoration: underline; }
.nba-row .sub { color: var(--muted); font-size: 12.5px; }
.nba-row .acts { display: flex; gap: 6px; justify-content: flex-end; }
.nba-c .nba-line { display: flex; gap: 12px; align-items: center; }
.nba-c .lbl { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--ok); background: var(--ok-soft); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.nba-c .factors { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.nba-c { border-color: color-mix(in srgb, var(--ok-solid) 35%, var(--line)); }

/* Beziehungsstatus */
.health { display: inline-block; font: 600 13px/1 var(--sans); padding: 6px 10px; border-radius: 999px; margin-bottom: 8px; }
.h-good { background: var(--ok-soft); color: var(--ok); }
.h-watch { background: var(--warn-soft); color: var(--warn); }
.h-risk { background: var(--danger-soft); color: var(--danger); }
.h-none { background: var(--surface-3); color: var(--muted); }
.tag.health { font-weight: 600; }
ul.sig { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
ul.sig li { padding-left: 20px; position: relative; }
ul.sig li::before { content: "•"; position: absolute; left: 6px; color: var(--muted); }
ul.sig li.good::before { content: "✓"; color: var(--ok); left: 3px; }
ul.sig li.bad::before { content: "!"; color: var(--danger); font-weight: 700; left: 6px; }
details.rule { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
details.rule summary { cursor: pointer; color: var(--muted); }
.tl-filter { padding: 10px 16px 0; }

/* Anruf-Modus */
.call-head { display: flex; gap: 20px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; max-width: 1500px; }
.call-head h1 { margin: 0; font: 600 24px/1.2 var(--serif); }
.call-head .company { color: var(--ink-2); margin-top: 2px; }
.call-head .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; font-size: 13px; }
.call-dial { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn.big { height: 40px; padding: 0 18px; font-size: 15px; font-weight: 600; }
.timer { display: flex; gap: 8px; align-items: center; padding: 4px 4px 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.timer [data-clock] { font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; min-width: 48px; }
.call-grid { display: grid; grid-template-columns: minmax(250px, .9fr) minmax(0, 1.35fr) minmax(300px, 1.1fr); gap: 16px; align-items: start; max-width: 1500px; }
.call-grid .panel + .panel { margin-top: 0; }
.call-grid .panel .body { max-height: calc(100vh - 230px); overflow: auto; }
.call-brief .bq { margin-bottom: 14px; }
.call-brief .bq > b { display: block; font: 600 12px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
.call-brief .bq p { margin: 0; }
.call-brief .bq ul { margin: 0; padding-left: 18px; }
.call-brief .links { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-tl { list-style: none; padding: 0 !important; display: grid; gap: 8px; font-size: 13px; }
.mini-tl li > span { font-size: 12px; }
.openings li { padding: 6px 8px; background: var(--surface-2); border-radius: var(--r-s); }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 38%); gap: 8px; align-items: center; padding: 4px 6px; border-radius: var(--r-s); }
.qrow.asked { background: var(--ok-soft); }
.qrow .check { font-size: 13.5px; align-items: flex-start; }
.qrow .in.sm { width: 100%; }
.qg { margin-top: 8px; font-weight: 600; }
.call-notes .body { display: grid; gap: 12px; align-content: start; }
.chip.raised { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); }
.chip.raised[aria-pressed="true"] { background: var(--danger-soft); color: var(--danger); }
.chip.ghost { border-style: dashed; }
.chip.outcome[aria-pressed="true"] { background: var(--ok-solid); border-color: var(--ok-solid); color: #fff; }
.chip.outcome.nc[aria-pressed="true"] { background: var(--ink-2); border-color: var(--ink-2); }
.obj-live .obj-card { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); background: var(--surface-2); margin-top: 8px; }
.acts-list { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 4px; }
.acts-list li { display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 4px 4px 4px 10px; background: var(--surface-2); border-radius: var(--r-s); font-size: 13px; }
.call-save { display: flex; gap: 8px; align-items: center; position: sticky; bottom: -14px; background: var(--surface); padding: 10px 0 2px; border-top: 1px solid var(--line-2); }
.call-done { max-width: 760px; }
.call-done h1 { margin: 0 0 6px; font: 600 22px/1.2 var(--serif); color: var(--ok); }

/* Befehlspalette */
dialog.palette { width: min(680px, calc(100vw - 32px)); padding: 0; margin-top: 12vh; }
.pal { display: flex; flex-direction: column; max-height: 70vh; }
.pal-in { border: 0 !important; border-bottom: 1px solid var(--line) !important; border-radius: 0 !important; height: 52px; font-size: 16px; padding: 0 18px; box-shadow: none !important; }
.pal-res { overflow: auto; padding: 6px 0; }
.pal-grp { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 18px 4px; }
.pal-it { display: flex; gap: 10px; align-items: center; padding: 8px 18px; cursor: pointer; }
.pal-it .l { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.pal-it .s { color: var(--muted); font-size: 12.5px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-it.sel { background: var(--accent-soft); }
.pal-foot { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 18px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--muted); }
.in.sm.snooze { height: 26px; font-size: 12px; }

@media (max-width: 1200px) {
  .call-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .call-brief { grid-column: 1 / -1; }
  .call-grid .panel .body { max-height: none; }
}
@media (max-width: 900px) {
  .compose-grid, .tpl-edit-grid, .tpl-lib, .obj-wrap, .call-grid { grid-template-columns: 1fr; }
  .tpl-side, .tpl-pick { position: static; }
  .tpl-items { max-height: 320px; }
  .tpl-list { max-height: 260px; }
  .nba-row { grid-template-columns: 34px minmax(0, 1fr); }
  .nba-row .what { grid-column: 2; }
  .nba-row .acts { grid-column: 2; justify-content: flex-start; }
  .qrow { grid-template-columns: 1fr; }
  .call-save { position: static; }
}
/* Schmale Fenster (z. B. geteilter Bildschirm): Navigation als waagerechte Leiste statt ausgeblendet */
@media (max-width: 900px) {
  .side { display: block; position: sticky; top: 0; z-index: 5; height: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .brand, .side .side-foot, .nav-sep { display: none; }
  .nav { display: flex; flex-direction: row; overflow-x: auto; gap: 2px; padding: 6px 8px; }
  .nav button { white-space: nowrap; width: auto; flex: none; }
}
.panel h2 .count { font: 600 12px/1 var(--sans); background: var(--surface-3); color: var(--ink-2); padding: 3px 8px; border-radius: 999px; margin-left: 6px; }

/* =============================================================================
 * Handy (bis 700 px). Gilt nur für schmale Bildschirme – die Desktop-Ansicht bleibt unverändert.
 * ===========================================================================*/
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
}
@media (hover: none) and (pointer: coarse) {
  .btn kbd, .search kbd, .dlg-foot .left { display: none; }
}
@media (max-width: 700px) {
  html, body { overflow-x: hidden; }
  .app { display: flex; flex-direction: column; height: 100dvh; }
  .side { flex: none; }
  .nav { padding: 6px 6px; }
  .nav button { padding: 6px 10px; font-size: 13.5px; }
  .main { flex: 1; min-height: 0; }
  .top { flex-wrap: wrap; gap: 8px; padding: 8px 12px; height: auto; }
  .search { max-width: none; flex: 1 1 100%; order: 2; }
  .search input { width: 100%; }
  .top-right { margin-left: 0; flex: 1 1 100%; justify-content: space-between; order: 1; }
  .content { padding: 14px 12px 32px; }
  .view-head { flex-direction: column; align-items: stretch; gap: 10px; }
  .view-head .actions { justify-content: flex-start; flex-wrap: wrap; }
  .view-head h1 { font-size: 22px; }
  .in, select.in, textarea.in { font-size: 16px; }                 /* iOS zoomt sonst beim Tippen */
  .btn.sm { height: 32px; padding: 0 10px; }
  .grid2, .grid3, .settings .grid2, .settings .grid3 { grid-template-columns: 1fr !important; }
  .filters { flex-wrap: wrap; }
  .filters .in { flex: 1 1 140px; min-width: 0; }
  /* Kontaktliste: Name und Phase */
  .vt-head, .vt-row { grid-template-columns: minmax(0, 1fr) auto !important; padding: 0 12px; }
  .vt-head > :not(:nth-child(1)):not(:nth-child(4)), .vt-row > :not(:nth-child(1)):not(:nth-child(4)) { display: none; }
  /* Kontaktseite */
  .crumbs { flex-wrap: wrap; gap: 8px; }
  .contact h1 { font-size: 22px; }
  .c-actions { gap: 6px; }
  .c-actions .btn { flex: 1 1 calc(50% - 6px); justify-content: center; }
  .c-actions .spacer { display: none; }
  .nba-c .nba-line { flex-wrap: wrap; }
  .timeline li { grid-template-columns: 1fr; }
  .tl-acts { justify-content: flex-start; }
  /* Heute */
  .today-cols { gap: 16px; }
  .todo-top { flex-wrap: wrap; }
  .fu-item .acts { flex-wrap: wrap; }
  /* Anruf-Modus */
  .call-head { flex-direction: column; gap: 10px; }
  .call-head h1 { font-size: 20px; }
  .call-dial { width: 100%; }
  .call-dial .btn.big { flex: 1; justify-content: center; }
  .call-save { position: sticky; bottom: 0; z-index: 2; }
  /* Dialoge bildschirmfüllend */
  dialog, dialog.wide, dialog.xwide { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0; }
  dialog form, dialog .dlg { max-height: 100dvh; height: 100%; }
  .dlg-body { overflow-y: auto; }
  .dlg-foot { flex-wrap: wrap; gap: 6px; }
  .dlg-foot .btn { flex: 1 1 auto; justify-content: center; }
  .log-grid { grid-template-columns: 1fr; }
  .tpl-list { max-height: 190px; }
  .compose-main textarea { min-height: 220px; }
  dialog.palette { margin-top: 0; }
  /* Process Management / Tabellen */
  .pm-table-wrap, .board-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .obj-row { grid-template-columns: minmax(0, 1fr) 70px 28px; }
  .toasts { left: 8px; right: 8px; }
  .toast { max-width: none; }
  .btn kbd, .search kbd, .dlg-foot .left { display: none; }
  .top { flex-wrap: nowrap; }
  .search { order: 1; flex: 1 1 auto; min-width: 0; }
  .top-right { order: 2; flex: none; gap: 6px; }
  #newbtn { font-size: 0; width: 40px; padding: 0; justify-content: center; }
  #newbtn::before { content: "+"; font-size: 22px; line-height: 1; }
  #status span { display: none; }
  #status { padding: 0 10px; }
  .nba-c .lbl { flex-basis: 100%; text-align: center; }
  .nba-c .nba-line .grow { flex: 1 1 60%; }
  .call-dial { flex-wrap: wrap; }
}

</style>
</head>

<div id="root"><div class="setup"><div class="setup-card"><h1>CRM wird geladen …</h1><noscript><p>Ohne JavaScript funktioniert das Tool nicht.</p></noscript></div></div></div>

["Backup max MB","500"],["Poll seconds","20"],["Calendar name in title","ja"],["Calendar include notes","nein"],["Calendar include phone","nein"],["Calendar include email","nein"],["Last saved by",""],["Last saved at",""],["File version",""],["Version history",""],["Template version","1"],["Website category 1","Keine eigene Seite"],["Mail 1 subject","{Vorname} {Nachname} bei Google"],["Mail 1 body","Hallo {Vorname},\n\nich habe nach „{Vorname} {Nachname} Finanzberatung {Stadt}“ gesucht und nur {Verzeichnis} gefunden, aber keine eigene Seite.\n\nWir kennen die Finanzbranche aus unserer Arbeit. Ihr Geschäft lebt von Vertrauen, und genau das sollte man online auch sehen. Dafür haben wir N3 Digital gegründet.\n\nIch habe Ihnen eine Startseite entworfen, kostenlos und unverbindlich. Schreiben Sie mir bis {Wochentag} kurz „ja“, dann schicke ich sie Ihnen rüber.\n\nHerzliche Grüße\nNiklas"],["Website category 2","Sehr alte Seite"],["Mail 2 subject","{Domain} auf dem Handy"],["Mail 2 body","Hallo {Vorname},\n\nich habe {Domain} auf dem Handy geöffnet. {Konkrete, selbst geprüfte Beobachtung, z. B.: Der Text läuft über den Rand, der Kontaktbutton ist kaum zu treffen.}\n\nWir kennen die Finanzbranche aus unserer Arbeit und wollten, dass Berater online so seriös wirken, wie sie im Gespräch sind. Deshalb haben wir N3 Digital gegründet.\n\nIch habe Ihre Startseite mit Ihren Inhalten neu gestaltet, als Vorher-Nachher. Schreiben Sie mir bis {Wochentag} kurz „ja“, dann sehen Sie es.\n\nHerzliche Grüße\nNiklas"],["Website category 3","Kleine Seite, wenig Infos"],["Mail 3 subject","3 Dinge auf {Domain}"],["Mail 3 body","Hallo {Vorname},\n\nauf {Domain} fehlen mir 3 Dinge, die Besucher zum Anruf bringen würden: {Punkt 1}, {Punkt 2}, {Punkt 3}.\n\nWir kennen die Finanzbranche aus unserer Arbeit und wissen, wie viel Vertrauen vor dem ersten Gespräch entscheidet. Deshalb gibt es N3 Digital.\n\nIch habe Ihnen einen fertigen Text für die Startseite geschrieben, kostenlos. Schreiben Sie mir bis {Wochentag} kurz „ja“, dann schicke ich ihn Ihnen.\n\nHerzliche Grüße\nNiklas"],["Website category 4","Große Seite, veraltet"],["Mail 4 subject","5 Seiten auf {Domain}"],["Mail 4 body","Hallo {Vorname},\n\n{Domain} hat viel Inhalt, aber 5 Seiten wirken veraltet, zum Beispiel {Seite 1} und {Seite 2}. Kein Neubau nötig, vieles lässt sich aufräumen.\n\nWir kennen die Finanzbranche aus unserer Arbeit. Weil dort alles auf Vertrauen beruht, soll eine Seite aktuell wirken. Dafür haben wir N3 Digital gegründet.\n\nIch habe die 5 Seiten mit Reihenfolge aufgelistet, kostenlos. Schreiben Sie mir bis {Wochentag} kurz „ja“, dann schicke ich Ihnen die Liste.\n\nHerzliche Grüße\nNiklas"],["Website category 5","Solide Seite, viel Potenzial"],["Mail 5 subject","Wer taucht bei „{Thema} {Stadt}“ auf?"],["Mail 5 body","Hallo {Vorname},\n\nich habe ChatGPT und Google nach „{Thema} in {Stadt}“ gefragt. {Ergebnis, nur nach eigener Prüfung, z. B.: Ihre Seite taucht nicht auf, genannt werden {Wettbewerber}.}\n\nIhre Seite ist gut gebaut. Wir kennen die Finanzbranche aus unserer Arbeit und möchten, dass vertrauenswürdige Berater auch dort gefunden werden. Deshalb gibt es N3 Digital.\n\nIch habe 3 konkrete Hebel aufgeschrieben, kostenlos. Schreiben Sie mir bis {Wochentag} kurz „ja“, dann kommt die Auswertung.\n\nHerzliche Grüße\nNiklas"]]},"systemActivityTypes":["Temperaturänderung"],"directions":["Ausgehend","Eingehend"],"stages":["Cold","Contact Made","Replied / Engaged","Drafts Sent","Qualified","Discovery Call Booked","Discovery Completed","Proposal Sent","Negotiation","Closed Won","Closed Lost"],"services":["Web Design","LinkedIn Management","Both"],"processPriorities":["Hoch","Mittel","Niedrig"],"taskStatuses":["Offen","In Arbeit","Wartet auf Kunde","Erledigt"]};
